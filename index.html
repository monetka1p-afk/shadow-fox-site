let imported=[],journal=ls.get('sd-journal',[]);
const blobs={};
const saveJ=()=>ls.set('sd-journal',journal);
const allTrades=()=>[...imported,...journal.filter(x=>x.pr!=null)];

const resultPr=(res,amt)=>res==='win'?amt*cfg.payout/100:res==='loss'?-amt:null;
function addJournal(e){const j={id:uid('j'),t:Date.now(),...e};journal.unshift(j);saveJ();renderJournal();renderTrades();updStatus();return j}
function setResult(id,res){

function autoImprove(){

  if(done-last<10)return;ls.set('sd-lastImprove',done);

function parseTrades(txt){
  const lines=txt.replace(/^\uFEFF/,'').trim().split(/\r?\n/);if(lines.length<2){alert('У файлі немає угод.');return}
  const dl=[';','\t',','].find(d=>lines[0].includes(d))||',';
  const clean=s=>s.trim().replace(/^"|"$/g,'');
  const head=lines[0].split(dl).map(clean),find=re=>head.findIndex(h=>re.test(h));
  const ix={t:find(/time|date|час|дата/i),p:find(/asset|pair|symbol|актив|пара|інструмент|инструмент/i),d:find(/^dir|direction|side|type|напрям|направ|тип/i),a:find(/amount|stake|sum|invest|сума|сумма|ставка/i),r:find(/profit|result|pnl|прибут|прибыл|результат/i)};
  if(ix.r<0){alert('Не знайшов колонку з результатом угоди (profit, result або прибуток). Перевір заголовки CSV.');return}
  const used=new Set(Object.values(ix));
  const num=s=>parseFloat(String(s||'').replace('−','-').replace(/[^\d.,-]/g,'').replace(',','.'));
  imported=lines.slice(1).map(l=>l.split(dl).map(clean)).map(c=>{
    const raw=c[ix.r]||'',amt=ix.a>=0?num(c[ix.a]):NaN,st=Number.isFinite(amt)?amt:cfg.stake;let pr=num(raw);
    if(!Number.isFinite(pr)){if(/^\s*w\s*$|win|виграш|выигр/i.test(raw))pr=st*cfg.payout/100;else if(/^\s*l\s*$|los|програш|проигр/i.test(raw))pr=-st}
    const ds=ix.d>=0?c[ix.d]||'':'',x={};head.forEach((h,i)=>{if(!used.has(i)&&c[i]!==undefined&&c[i]!=='')x[h]=c[i]});
    return{t:ix.t>=0?Date.parse(String(c[ix.t]).replace(' ','T')):NaN,pair:ix.p>=0?(c[ix.p]||'—'):'—',dir:/buy|call|up|вгор|вверх|long|купи|выш/i.test(ds)?'long':/sell|put|down|вниз|short|прода|ниж/i.test(ds)?'short':'—',amt:st,pr,x,src:'import'};
  }).filter(x=>Number.isFinite(x.pr));
  if(!imported.length){alert('Не вдалося прочитати жодної угоди.');return}
  renderTrades();updStatus();toast('Імпортовано угод: '+imported.length);
}
function grpBy(tr,key){const m={};tr.forEach(x=>{const k=key(x);if(k==null||k==='')return;(m[k]=m[k]||{n:0,w:0,p:0});m[k].n++;if(x.pr>0)m[k].w++;m[k].p+=x.pr});return m}
function extraKeys(tr){const ks={};tr.forEach(x=>x.x&&Object.entries(x.x).forEach(([k,v])=>{(ks[k]=ks[k]||new Set).add(v)}));return Object.entries(ks).filter(([,s])=>s.size>1&&s.size<=8).map(([k])=>k)}
function sortedTrades(){const tr=allTrades().slice();if(tr.every(x=>Number.isFinite(x.t)))tr.sort((a,b)=>a.t-b.t);return tr}
function renderTrades(){

  const head=`Ви — SHADOW FOX, команда ШІ-агентів, що працює як одне ціле над сигналами для бінарних опціонів (Pocket Option, зокрема OTC) і над самим ботом. Ви бачите повідомлення одне одного й спільний мозок нижче, сперечаєтесь по суті й доходите спільного рішення.
Склад:
- SHADOW FOX — шеф. Приймає завдання від власника, роздає доручення агентам (звертається на ім'я), збирає відповіді, оголошує рішення. Останнє слово за ним.
- ARGO — за трендом: старший таймфрейм, swing high/low, злам структури.
- NOVA — імпульс, свічкові патерни, момент входу.
- ZETA — рівні, підтримка/опір, позиція ціни в діапазоні (low/mid/high).
- KIRA — фільтр якості: ставить A/B/C, при C прямо каже, що сигнал слабкий.
- VEGA — самонавчання: дивиться, хто з агентів зараз найвлучніший за журналом, розбирає мінуси й пропонує зміни правил.
${BOTS.filter(b=>b.custom).map(b=>`- ${b.name} — ${b.role}${b.focus?': '+b.focus:''}.`).join('\n')}
Кожен агент думає САМОСТІЙНО через свою лінзу і має право не погоджуватись з іншими. Не повторюйте однакові аргументи: кожен називає власну ознаку. Запропонуйте 1–2 РІЗНІ ідеї входу (наприклад, «за трендом» від ARGO і «відбій від рівня» від ZETA), а FOX обирає сильнішу за аргументами й рейтингом агентів — або пропуск, якщо ідеї суперечать одна одній.
ПОТОЧНИЙ СКЛАД (слабких автоматично замінюють з лави): ${BOTS.map(b=>b.name+' — '+b.role).join('; ')}.
РЕЙТИНГ АГЕНТІВ ЗА ЖУРНАЛОМ ВЛАСНИКА (хто мав рацію на позначених угодах): ${(()=>{const s=agentStats(),e=Object.entries(s);return e.length?e.map(([k,v])=>`${k} ${v.r}/${v.n} (${Math.round(v.acc*100)}%${v.muted?', приглушений':''})`).join('; '):'ще немає даних'})()}. Довіряй більше тим, у кого влучність вища, і менше приглушеним.
Обов'язковий чекліст аналізу ринку для кожного сигналу: 1) тренд старшого горизонту — напрям і сила; 2) структура — останні swing high/low, злам чи продовження; 3) рівні — найближча підтримка й опір, відстань до них, позиція ціни в діапазоні; 4) імпульс — розмір і колір 3–5 останніх свічок, тіні, прискорення чи затухання; 5) волатильність — чи достатньо руху під експірацію; 6) контр-сценарій — що має статися, щоб угода не зайшла. Кожен агент у votes.why називає конкретну ознаку з графіка чи даних, а не загальні слова. FOX зважує голоси за силою аргументів, а не простою більшістю, і враховує уроки з мозку та статистику власника.
Мета команди — менше мінусових угод. Оцінюй якість входу: A — збіг 4+ незалежних ознак за трендом старшого горизонту біля рівня; B — 3 ознаки; C — менше, або ціна посередині діапазону, або щойно сплеск, або вхід проти тренду, або виснаження після 4+ свічок одного кольору. При C KIRA прямо пише, що краще пропустити, навіть якщо напрям обовʼязковий. Не входити на першій свічці після сильного сплеску. Для експірацій до 30 с вимагай підтвердження свічкою, а не лише індикатором.
Знання про Pocket Option (від LYNX, як спостереження трейдерів, а не гарантія): OTC-пари доступні 24/7 і будуються з власного фіду брокера, тому поводяться інакше, ніж міжбанк; у вихідні працюють лише OTC; виплата буває 80–92% і змінюється, а беззбиток = 100/(100+виплата); на 5–30 с багато шуму; після різких сплесків часто відкат до середнього; мартингейл не застосовувати.
Нові агенти: якщо власник просить створити одного чи кількох агентів — створюйте через add_agent, кожному унікальне ім'я, роль і спеціалізацію; після створення сторінка перезавантажиться, і вони одразу з'являться в чаті й серед ботів.
Підхід (з промпту власника): кожен аналізує за власним професійним судженням — price action, тренд, імпульс, підтримка/опір, свічкові патерни, волатильність — і завжди під задану експірацію; не плутайте короткий шум зі справжнім рухом на цьому горизонті.
Власник — трейдер, звертайтесь на «ти», українською, коротко й по ділу. Виконуйте його вказівки щодо змін. Кожну зміну з actions обов'язково назвіть у повідомленні. Не вигадуйте даних, яких немає нижче. Telegram і серверного бота в системі НЕМАЄ — не згадуйте їх і не пишіть код для сервера. Ви працюєте лише з цим застосунком: живі свічки otcharts, боти, Тіньова ліга, налаштування, Мозок.${pageAccessText()}

СПІЛЬНИЙ МОЗОК
${brainText()}

НАЛАШТУВАННЯ: ставка $${cfg.stake}, виплата ${cfg.payout}%, експірація ${exp}, актив за замовчуванням «${cfg.pair||'не задано'}», завжди давати напрям: ${cfg.forceDir?'так':'ні'}, обмеження впевненості OTC: ${cfg.otcCap?'так (до 60)':'ні'}, авто-розбір мінусів: ${cfg.autoLoss?'так':'ні'}.
БОТИ: ${BOTS.map((b,k)=>`${b.name}=${b.an}${botState[k].on?'':' (вимкнений)'}`).join(', ')}

СТАТИСТИКА УГОД ВЛАСНИКА
${statsText()}

РИНОК (свічки на сторінці)
${marketText()}

ОСТАННІЙ ЧАТ
${chatText()}
`;
  const sigRules=`Фінальний direction завжди UP або DOWN (власник хоче сигнал одразу після натискання). Якщо картина слабка — все одно дай напрям, але постав quality C і коротко поясни в skip_reason, чому слабко.${cfg.otcCap?' Для OTC і експірації до 5 хв confidence не більше 60.':''} confidence — наскільки однозначна картина (0–100), оцінюй чесно, без завищення.`;
  let task='';
  if(mode==='chat'){
    const to=o.to||'FOX';
    task=to==='FOX'?`Власник пише SHADOW FOX. FOX відповідає першим, за потреби дає доручення агентам; ті відповідають; FOX підсумовує. 2–8 повідомлень.`
      :to==='ALL'?`Власник пише всій команді. Відповідають ті, кого це стосується; FOX підсумовує. 2–8 повідомлень.`
      :`Власник пише напряму агенту ${to}. Відповідає ${to}; FOX та інші додають лише суттєве. 1–4 повідомлення.`;
    task+=`${o.hasImage?' До повідомлення додано зображення.':''}\nЯкщо власник просить угоду — заповніть signal (${sigRules}). Якщо просить зміни — виконайте через actions.\nПОВІДОМЛЕННЯ ВЛАСНИКА: «${o.text}»`;
  }else if(mode==='meeting'){
    task=`Нарада без власника. Тема: «${o.text||'як підняти winrate за статистикою й уроками'}». FOX веде, агенти обговорюють між собою, сперечаються, MIRA перевіряє цифри. Якщо домовились — ORIN вносить зміни через actions. 4–9 повідомлень, в кінці FOX підсумовує для власника.`;
  }else if(mode==='photo'){
    task=`Власник просить угоду по скріншоту графіка (зображення додано). Актив: «${o.pair||cfg.pair||'визнач із фото'}». Експірація: ${exp}. Кожен агент дає голос у signal.votes, KIRA оцінює якість (A/B/C); FOX оголошує рішення в signal. ${sigRules} Якщо на фото не графік — signal.readable=false. Повідомлення: 2–5 коротких реплік (агенти коротко, FOX — рішення).${anchorText(o.pair||cfg.pair)}`;
  }else if(mode==='loss'){
    const j=o.trade;
    task=`Угода закрилась у МІНУС: ${j.pair} ${j.dir==='long'?'UP':'DOWN'}, ставка $${j.amt}, ${new Date(j.t).toLocaleString('uk-UA')}, джерело ${j.src}${j.reason?', причина входу: «'+j.reason+'»':''}${j.votes?', голоси: '+j.votes.map(v=>v.agent+':'+v.direction).join(', '):''}.${o.image?' Скріншот, по якому входили, додано.':''}
VEGA веде розбір: що зробила ціна, тип помилки (${MISTAKES.join(', ')}), конкретний урок із числами. Додайте урок через add_lesson. Якщо агенти бачать, що правило чи стратегію треба змінити, — обговоріть, FOX вирішує, ORIN виконує. Не пишіть загальних фраз. 2–6 повідомлень.`;
  }
  return head+'\nЗАВДАННЯ\n'+task+'\n\n'+FORMAT();
}

async function teamCall(mode,o={}){
  if(!sampleFn){toast('ШІ-команда недоступна в цьому перегляді');return null}
  if(busy){toast('Команда ще працює над попереднім завданням');return null}
  busy=new AbortController();refreshButtons();showTyping(mode);
  const opts={modelTier:'default',signal:busy.signal,cache:false};
  STAGED=null;if((mode==='chat'||mode==='meeting')&&sampleTools&&artifactNS)opts.tools=pageTools();
  if(o.image){if(!sampleImg){busy=null;refreshButtons();hideTyping();toast(ERR.images_unavailable);return null}opts.images=[o.image]}
  const handle=async r=>{
    hideTyping();
    if(r._partial)addChat({kind:'sys',text:'⚠️ Відповідь команди прийшла обрізаною. Показую те, що вдалося прочитати.'});
    await playMessages(Array.isArray(r?.messages)?r.messages:[]);
    if(!r._partial&&Array.isArray(r?.actions)&&r.actions.length)applyActions(r.actions);
    if(!r._partial&&STAGED&&STAGED.edits.length)offerPatch(r?.page_summary);
    let sig=null;
    if(r?.signal&&typeof r.signal==='object'){sig=normSig(r.signal,o);if(sig)addChat({kind:'signal',sig})}
    return{sig,raw:r};
  };
  try{
    const r=await sampleFn.json(teamPrompt(mode,o),opts);
    return await handle(r);
    hideTyping();
    await playMessages(Array.isArray(r?.messages)?r.messages:[]);
    if(Array.isArray(r?.actions)&&r.actions.length)applyActions(r.actions);
    if(STAGED&&STAGED.edits.length)offerPatch(r?.page_summary);
    let sig=null;
    if(r?.signal&&typeof r.signal==='object'){sig=normSig(r.signal,o);if(sig)addChat({kind:'signal',sig})}
    return{sig,raw:r};
  }catch(e){
    if(e?.code==='invalid_json'&&e.text){const r=repairJSON(e.text);if(r)return await handle(r);hideTyping();addChat({kind:'agent',from:'FOX',to:'ВЛАСНИК',text:String(e.text).replace(/[{}\[\]"]/g,' ').replace(/\s+/g,' ').trim().slice(0,900)||'Не зміг сформулювати відповідь. Спробуй коротше завдання.'});return{error:e}}
    hideTyping();addChat({kind:'sys',text:'⚠️ '+errText(e)});if(e?.code==='not_granted'){sampleFn=null;$('stPhoto').textContent='Доступ не дозволено'}return{error:e}}
  finally{busy=null;refreshButtons()}
}
function normSig(s,o){
  const votes=(Array.isArray(s.votes)?s.votes:[]).filter(v=>ALL.includes(v.agent)).map(v=>({agent:v.agent,direction:normDir(v.direction),why:String(v.why||'').slice(0,160)}));
  let dir=normDir(s.direction);if(s.readable===false)dir='flat';
  const qg=/^[ABC]$/.test(String(s.quality||'').trim().toUpperCase())?String(s.quality).trim().toUpperCase():null;
  const AS=agentStats();let up=0,dn=0,nt=0;
  votes.forEach(v=>{if(v.agent==='FOX')return;const w=AS[v.agent]?AS[v.agent].w:1;if(v.direction==='long')up+=w;else if(v.direction==='short')dn+=w;else nt+=w});
  if(dir==='flat'&&s.readable!==false&&(up||dn))dir=up>=dn?'long':'short';
  const raw=up+dn?((dir==='long'?up:dn)+nt*.5)/(up+dn+nt)*100:Math.max(50,+s.confidence||50);
  const weakT=qg==='C'||(up+dn&&raw<60);
  return{id:uid('s'),direction:dir,pair:String(s.pair||o.pair||cfg.pair||'—').slice(0,40),expiry:String(s.expiry||expName()),confidence:Math.max(0,Math.min(100,Math.round(+s.confidence||0))),reason:String(s.reason_uk||'').slice(0,400),votes,lessons:Array.isArray(s.lessons_applied)?s.lessons_applied.slice(0,6):[],readable:s.readable!==false,quality:qg?{g:qg,n:null,tot:null,bad:s.skip_reason?[String(s.skip_reason).slice(0,160)]:[]}:null,src:o.image&&mode0(o)?'photo':'team',weak:!!weakT,power:sigPower(raw,qg)};
}
const mode0=o=>!!o.image;

const SET_KEYS={stake:v=>+v>0,payout:v=>+v>0&&+v<=100,expiry:v=>Number.isInteger(+v)&&+v>=1&&+v<=50,start:v=>+v>=10,tf:v=>[0.0833,0.25,0.5,1,5,15,60].includes(+v),speed:v=>[300,1000,2000].includes(+v),forceDir:v=>typeof v==='boolean',otcCap:v=>typeof v==='boolean',autoLoss:v=>typeof v==='boolean',skin:v=>typeof v==='string'&&!!SKINS[v],layout:v=>!!LAYOUTS[v],home:v=>!!HOMES[v],btn:v=>!!BTNS[v],gauge:v=>!!GAUGES[v],bg:v=>!!BGS[v],fx:v=>!!FXS[v],tap:v=>!!TAPS[v],confirmPatch:v=>typeof v==='boolean',pair:v=>typeof v==='string'};
function snapState(){return JSON.stringify({cfg,brain,bots:BOTS.map(b=>b.an),on:botState.map(s=>s.on)})}
function applyOne(a){
  switch(a.type){
    case'set_setting':{if(!SET_KEYS[a.key])throw new Error('невідоме налаштування '+a.key);let v=a.value;if(['forceDir','otcCap','autoLoss','confirmPatch'].includes(a.key))v=v===true||v==='true';else if(!['pair','skin','layout','bg','fx','tap','home','btn','gauge'].includes(a.key))v=+v;if(!SET_KEYS[a.key](v))throw new Error(`недопустиме значення ${a.key}=${a.value}`);const old=cfg[a.key];cfg[a.key]=v;saveCfg();cfgChanged(a.key);return`${a.key}: ${old} → ${v}`}
    case'set_bot':{setBot(a.bot,a.strategy??null,typeof a.active==='boolean'?a.active:null);return`${a.bot}: ${a.strategy?'стратегія '+a.strategy:''}${typeof a.active==='boolean'?(a.active?' увімкнено':' вимкнено'):''}`}
    case'add_rule':{const t=String(a.text||'').trim();if(!t)throw new Error('порожнє правило');brain.rules.push({id:uid('r'),text:t.slice(0,400),t:Date.now()});saveBrain();return'нове правило'}
    case'remove_rule':{const n=brain.rules.length;brain.rules=brain.rules.filter(x=>x.id!==a.id);if(n===brain.rules.length)throw new Error('немає правила '+a.id);saveBrain();return'правило видалено'}
    case'add_lesson':{const t=String(a.text||'').trim();if(!t)throw new Error('порожній урок');brain.lessons.push({id:uid('l'),text:t.slice(0,400),mistake:MISTAKES.includes(a.mistake)?a.mistake:'other',pair:String(a.pair||'').slice(0,40),t:Date.now()});if(brain.lessons.length>40)brain.lessons.shift();saveBrain();return'новий урок'}
    case'remove_lesson':{const n=brain.lessons.length;brain.lessons=brain.lessons.filter(x=>x.id!==a.id);if(n===brain.lessons.length)throw new Error('немає уроку '+a.id);saveBrain();return'урок видалено'}
    case'define_strategy':{const id=String(a.id||'').toLowerCase();if(!/^[a-z0-9-]{2,30}$/.test(id))throw new Error('id стратегії має бути латиницею');const ex=byId(id);if(ex&&!ex.team)throw new Error('не можна перезаписати вбудовану стратегію '+id);
      const s={id,name:String(a.name||id).slice(0,50),code:String(a.code||'')};const err=compileStrategy(s);if(err)throw new Error('код стратегії не скомпілювався: '+err+(evalOK?'':' (браузер заборонив виконання згенерованого коду)'));
      const test=safe(byId(id),candles.slice());if(test.reasons&&String(test.reasons[0]).startsWith('Помилка'))throw new Error('стратегія падає: '+test.reasons[0]);
      brain.strategies=brain.strategies.filter(x=>x.id!==id).concat(s);saveBrain();refreshStrategyLists();return`стратегія «${s.name}» (${id}), тест: ${test.direction}`}
    case'remove_strategy':{const s=byId(a.id);if(!s||!s.team)throw new Error('немає стратегії команди '+a.id);brain.strategies=brain.strategies.filter(x=>x.id!==a.id);ANALYZERS.splice(ANALYZERS.indexOf(s),1);BOTS.forEach(b=>{if(b.an===a.id)b.an='ema-rsi'});saveBrain();saveBots();refreshStrategyLists();return'стратегію видалено'}
    case'add_agent':{const n=String(a.name||'').toUpperCase().replace(/[^A-Z0-9_-]/g,'');if(n.length<2||n.length>12)throw new Error('імʼя агента має бути латиницею, 2–12 символів');if(ALL.includes(n)||n==='FOX')throw new Error('агент '+n+' уже є');if(brain.agents.length>=24)throw new Error('забагато агентів');const col=/^#[0-9a-f]{6}$/i.test(a.color||'')?a.color:'#'+Math.floor(Math.random()*0xffffff).toString(16).padStart(6,'0');brain.agents.push({name:n,role:String(a.role||'Агент').slice(0,40),focus:String(a.focus||'').slice(0,200),strategy:byId(a.strategy)?a.strategy:'ema-rsi',color:col});saveBrain();window.__needReload=true;return`новий агент ${n}`}
    case'remove_agent':{const n=String(a.name||'').toUpperCase();const k=brain.agents.findIndex(x=>x.name===n);if(k<0)throw new Error('можна видалити лише агента, створеного командою');brain.agents.splice(k,1);saveBrain();window.__needReload=true;return`агента ${n} видалено`}
    case'write_code':{brain.code.unshift({id:uid('c'),file:String(a.file||'').slice(0,80),title:String(a.title||'Зміна').slice(0,120),code:String(a.code||''),note:String(a.note||'').slice(0,400),t:Date.now()});brain.code=brain.code.slice(0,30);saveBrain();return`код для ${a.file||'бота'}`}
    default:throw new Error('невідома дія '+a.type);
  }
}
function applyActions(acts){
  const snap=snapState(),done=[];
  acts.slice(0,20).forEach(a=>{try{done.push('✓ '+applyOne(a))}catch(e){done.push('⚠️ '+e.message)}});
  const id=uid('u');undoMap[id]=snap;
  addChat({kind:'sys',text:'🔧 '+done.join('\n🔧 '),undo:id});renderBrain();
  if(window.__needReload){window.__needReload=false;toast('Оновлюю склад команди…');setTimeout(()=>location.reload(),2200)}
}
function undo(id){
  const s=undoMap[id];if(!s)return;const o=JSON.parse(s);
  cfg=o.cfg;saveCfg();
  ANALYZERS.filter(a=>a.team).forEach(a=>ANALYZERS.splice(ANALYZERS.indexOf(a),1));
  brain=o.brain;saveBrain();brain.strategies.forEach(compileStrategy);
  BOTS.forEach((b,k)=>{b.an=o.bots[k];botState[k].on=o.on[k]});saveBots();
  delete undoMap[id];refreshStrategyLists();fillCfg();renderBrain();
  addChat({kind:'sys',text:'↩️ Зміни скасовано власником'});
}

  else if(m.kind==='signal'){d.className='msg';d.style.maxWidth='100%';d.innerHTML=`${avatar('FOX',34)}<div style="flex:1">${signalHTML(m.sig)}</div>`}

}

function pageTools(){return[
  {name:'source_outline',description:'Зміст коду сторінки: для кожного файлу (css, body, js) кількість рядків і рядки-заголовки розділів з номерами. Починай з цього.',execute(){const s=stage();return Object.keys(FILES).map(f=>{const L=s[f].split('\n');const heads=L.map((l,i)=>[i+1,l.trim()]).filter(([,l])=>/^\/\*|^<\!--|^<section|^<div class="view"|^(async )?function /.test(l)).map(([i,l])=>i+': '+l.slice(0,90));return `## ${f} (${L.length} рядків)\n`+heads.slice(0,140).join('\n')}).join('\n\n')}},
  {name:'search_source',description:'Шукає текст у файлі (css, body або js), регістр не важливий. Повертає до 12 збігів з номерами рядків і контекстом.',inputSchema:{type:'object',properties:{file:{type:'string',enum:['css','body','js']},query:{type:'string'}},required:['file','query']},execute(i){const f=fileOf(String(i.file)),q=String(i.query||'').toLowerCase();if(!q)throw new Error('порожній запит');const L=stage()[f].split('\n'),out=[];L.forEach((l,k)=>{if(out.length<12&&l.toLowerCase().includes(q))out.push(L.slice(Math.max(0,k-2),k+3).map((x,j)=>`${Math.max(0,k-2)+j+1}: ${x}`).join('\n'))});return out.length?out.join('\n---\n'):'Нічого не знайдено'}},

  {name:'edit_source',description:'Замінює точний фрагмент old на new у файлі (css, body або js). old копіюй дослівно, без номерів рядків; він має зустрічатися рівно один раз. Порожній new видаляє фрагмент. Щоб додати нове, візьми як old сусідній унікальний рядок і поверни його в new разом із доданим. Повертає ok або помилку.',inputSchema:{type:'object',properties:{file:{type:'string',enum:['css','body','js']},old:{type:'string'},new:{type:'string'}},required:['file','old','new']},execute(i){const f=fileOf(String(i.file)),o=String(i.old??''),n=String(i.new??''),s=stage();if(!o)throw new Error('old порожній');const c=s[f].split(o).length-1;if(c!==1)throw new Error(c?`фрагмент зустрічається ${c} рази, додай більше контексту`:'фрагмент не знайдено, перевір через read_source');if(f==='js'&&/<\/script/i.test(n))throw new Error('у js не можна писати закриваючий тег script буквально, екрануй слеш: <\\/script>');if(f!=='js'&&/<script/i.test(n))throw new Error('скрипти додавай лише у файл js');s[f]=s[f].replace(o,()=>n);s.edits.push({file:f,old:o,new:n});return `ok (${s.edits.length} правок підготовлено)`}}

function chanceFor(s){
  const tr=allTrades().filter(x=>x.pr!=null&&x.dir!=='—');if(!tr.length)return null;

  const tries=[['та сама пара, напрям і джерело',x=>norm(x.pair)===P&&x.dir===s.direction&&x.src===s.src],['та сама пара й напрям',x=>norm(x.pair)===P&&x.dir===s.direction],['той самий напрям і джерело',x=>x.dir===s.direction&&x.src===s.src],['та сама пара',x=>norm(x.pair)===P],['той самий напрям',x=>x.dir===s.direction],['усі твої угоди',()=>true]];
  for(const[basis,f] of tries){const a=tr.filter(f);if(a.length>=10){const w=a.filter(x=>x.pr>0).length,[lo,hi]=wilson(w,a.length);return{p:w/a.length*100,lo,hi,n:a.length,w,basis}}}
  const w=tr.filter(x=>x.pr>0).length,[lo,hi]=wilson(w,tr.length);return{p:w/tr.length*100,lo,hi,n:tr.length,w,basis:'усі твої угоди',few:true};
}
function chanceHTML(s){
  const c=chanceFor(s),be=breakeven(),G=cfg.gauge||'bar';if(G==='off')return'';
  if(c&&G!=='bar'){const p=Math.round(c.p),col=c.p>=be?'var(--up)':'var(--down)',sub=`<p class="note" style="text-align:center">Шанс зайти за твоєю історією: ${c.w}/${c.n}${c.few?', мало даних':''}. Діапазон ${c.lo.toFixed(0)}–${c.hi.toFixed(0)}%, беззбиток ${be.toFixed(1)}%.</p>`;
    if(G==='number')return `<div class="gnum" style="color:${col}">${p}<small>%</small></div>${sub}`;
    if(G==='ring'){const C=2*Math.PI*44;return `<div class="gring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" class="t"/><circle cx="50" cy="50" r="44" class="v" style="stroke:${col};stroke-dasharray:${C};stroke-dashoffset:${C*(1-c.p/100)}"/></svg><span>${p}%</span></div>${sub}`}
    if(G==='speedo'){const a=-90+c.p*1.8,ab=-90+be*1.8,arc=(f,t)=>{const r=42,p1=[50+r*Math.cos((f-90)*Math.PI/180),55+r*Math.sin((f-90)*Math.PI/180)],p2=[50+r*Math.cos((t-90)*Math.PI/180),55+r*Math.sin((t-90)*Math.PI/180)];return `M${p1[0]} ${p1[1]} A${r} ${r} 0 0 1 ${p2[0]} ${p2[1]}`};
      return `<div class="gspeedo"><svg viewBox="0 0 100 62"><path d="${arc(-90,ab)}" class="lo"/><path d="${arc(ab,90)}" class="hi"/><line x1="50" y1="55" x2="50" y2="18" class="nd" style="transform:rotate(${a}deg)"/><circle cx="50" cy="55" r="4" class="hub"/></svg><b style="color:${col}">${p}%</b></div>${sub}`}
    if(G==='blocks'){const n=Math.round(c.p/10);return `<div class="gblocks">${Array.from({length:10},(_,i)=>`<i class="${i<n?'on':''}${i===Math.floor(be/10)?' be':''}"></i>`).join('')}<b style="color:${col}">${p}%</b></div>${sub}`}
  }
  if(!c)return `<div class="chance"><div class="lbl"><span>Шанс зайти</span><span>немає історії</span></div><p class="note">Познач кілька угод «Так / Ні» або імпортуй історію, і тут з’явиться відсоток.</p></div>`;
  return `<div class="chance"><div class="lbl"><span>Шанс зайти за твоєю історією</span><span>${c.w}/${c.n}</span></div><div class="big">${c.p.toFixed(0)}%</div>
  <div class="scale"><span class="rng" style="left:${c.lo}%;width:${Math.max(1,c.hi-c.lo)}%"></span><span class="be" style="left:${be}%" title="беззбиток"></span><span class="pt" data-pt="${c.p}" style="left:0%"></span></div>
  <div class="scale-ticks"><span>0</span><span>25</span><span>50</span><span>75</span><span>100</span></div>
  <p class="note">Діапазон ${c.lo.toFixed(0)}–${c.hi.toFixed(0)}%, основа: ${c.basis}${c.few?', мало даних — оцінка груба':''}. Червона риска — беззбиток ${be.toFixed(1)}%.</p></div>`;
}

function botsDeal(){
  const votes=[],score={long:0,short:0},reasons={long:[],short:[]};
  const AS=agentStats();
  BOTS.forEach((b,k)=>{if(!botState[k].on)return;const r=safe(byId(b.an),candles.slice());const w=AS[b.name]?AS[b.name].w:1;
    votes.push({agent:b.name,direction:r.direction,why:(r.reasons||[]).join('; ')+(w===0?' (приглушений: низька влучність)':'')});
    if(r.direction!=='flat'&&w>0){score[r.direction]+=Math.max(1,r.score)*w;reasons[r.direction].push(`${b.name}: ${(r.reasons||[])[0]||''}`)}});
  let dir=score.long>score.short?'long':score.short>score.long?'short':'flat',note='';
  if(dir==='flat'&&!cfg.forceDir){note='Пропуск: боти не бачать якісного входу (вимкнено «Завжди давати напрям»).'}
  else if(dir==='flat'){const s=snapshot(candles),l=candles[candles.length-1];dir=s&&s.trend?(s.trend<0?'short':'long'):(l&&l.c<l.o?'short':'long');note='Боти нейтральні, тому FOX узяв напрям тренду EMA50 (або останньої свічки).'}
  const nonflat=votes.filter(v=>v.direction!=='flat').length,agreeN=votes.filter(v=>v.direction===dir).length;
  votes.push({agent:'FOX',direction:dir,why:'Рішення за сумою сили голосів'});
  let qual=qualityOf(dir,votes);
  const tot=score.long+score.short,share=tot?Math.max(score.long,score.short)/tot:0;
  const weak=(qual&&qual.g==='C')||share<.6;
  let wa=0,wn=0,wt=0;votes.forEach(v=>{if(v.agent==='FOX')return;const w=AS[v.agent]?AS[v.agent].w:1;if(!w)return;wt+=w;if(v.direction===dir)wa+=w;else if(v.direction==='flat')wn+=w});
  const power=sigPower(wt?(wa+wn*.5)/wt*100:50,qual&&qual.g);
  const s={id:uid('s'),quality:qual,direction:dir,pair:cfg.pair||(source==='csv'?$('pairPill').textContent:source==='otc'?'EUR/USD OTC':'DEMO/USD'),expiry:expName(),reason:(reasons[dir]||[]).slice(0,3).join(' · '),votes,agree:`${agreeN} з ${votes.length-1} (нейтральних ${votes.length-1-nonflat})`,src:'bots',note:(source==='otc'?SRC_NOTE+'. ':source==='csv'?'':'Увага: свічки з демо-генератора, а не з реального ринку. ')+note,weak,power};
  return s;
}

}

function fixStrings(s){let o='',q=false,esc=false;for(const ch of s){if(q){if(esc){esc=false;o+=ch;continue}if(ch==='\\'){esc=true;o+=ch;continue}if(ch==='"'){q=false;o+=ch;continue}if(ch==='\n'){o+='\\n';continue}if(ch==='\r')continue;if(ch==='\t'){o+='\\t';continue}o+=ch}else{if(ch==='"')q=true;o+=ch}}return o}
function repairJSON(t){
  if(!t)return null;let s=String(t);const a=s.indexOf('{');if(a<0)return null;const b=s.lastIndexOf('}');s=s.slice(a,b>a?b+1:undefined);
  const tries=[s,fixStrings(s),fixStrings(s.replace(/[“”]/g,'"'))];
  for(const x of tries){try{const r=JSON.parse(x);if(r&&typeof r==='object')return r}catch(_){}}
  for(const tail of ['"}]}','"}],"actions":[]}',']}','}','"}']){try{const r=JSON.parse(fixStrings(s)+tail);if(r&&typeof r==='object'){r._partial=true;return r}}catch(_){}}
  const msgs=[],re=/"from"\s*:\s*"([A-Z]+)"[\s\S]*?"text"\s*:\s*"((?:[^"\\]|\\.)*)/g;let m;while((m=re.exec(s)))msgs.push({from:m[1],to:'ВЛАСНИК',text:m[2].replace(/\\n/g,'\n').replace(/\\"/g,'"')});
  return msgs.length?{messages:msgs,actions:[],signal:null,_partial:true}:null;
}

const NO_DATA='🔴 НЕМАЄ ПІДКЛЮЧЕННЯ ДО РЕАЛЬНИХ OTC-ДАНИХ';
const SRC_NOTE='Ціни otcharts OTC, можуть трохи відрізнятися від Pocket Option';
const OTC={base:'https://otcharts.com/v1',shift:7200,cacheMs:4500,cache:{},usage:null,err:null,timer:null};
let otcOk=false;
let SESSION_PASS=(()=>{try{return sessionStorage.getItem('sfPass')||''}catch(_){return''}})();try{localStorage.removeItem('otcPass')}catch(_){}
const otcPass=()=>SESSION_PASS;
const DEFAULT_PROXY='https://shadow-fox.andrijsamborin16.workers.dev';
const otcProxy=()=>{try{return(localStorage.getItem('otcProxy')||DEFAULT_PROXY).trim().replace(/\/+$/,'')}catch(_){return DEFAULT_PROXY}};

async function otcGet(path){
  const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),8000);
  try{const px=otcProxy();const r=await fetch((px?px+'/v1':OTC.base)+path,{headers:px?{Accept:'application/json','X-Access-Token':otcPass()}:{Authorization:'Bearer '+otcKey(),Accept:'application/json'},signal:ctl.signal});
    if(!r.ok){const e=new Error('HTTP '+r.status);e.status=r.status;throw e}return await r.json()}
  finally{clearTimeout(tm)}
}
const otcWhy=e=>e.status===401&&otcProxy()?'невірний пароль доступу':e.status===401||e.status===403?'ключ не прийнято':e.status===429?'перевищено ліміт запитів':e.status?'помилка otcharts '+e.status:'немає зʼєднання (мережа або браузер заблокував запит)';
async function otcUsage(){
  if(!otcKey()){$('otcUsage').textContent='Немає ключа';return null}
  try{const j=await otcGet('/usage'),q=j.requests||j;const rem=Number(q.remaining),lim=Number(q.limit??q.total??q.max);
    OTC.usage={rem,lim,plan:j.plan||j.tier||''};renderUsage();return OTC.usage}
  catch(e){$('otcUsage').textContent='Ліміт: '+otcWhy(e);return null}
}
function renderUsage(){const u=OTC.usage;if(!u)return;$('otcUsage').textContent=`${u.plan?u.plan+': ':''}залишилось ${Number.isFinite(u.rem)?u.rem:'?'}${Number.isFinite(u.lim)?' із '+u.lim:''} запитів`}
async function otcCandles(sym){
  const hit=OTC.cache[sym];if(hit&&Date.now()-hit.at<OTC.cacheMs)return hit.r;
  let r;
  try{
    if(OTC.usage&&Number.isFinite(OTC.usage.rem)&&OTC.usage.rem<=20){r={ok:false,why:'ліміт запитів otcharts майже вичерпано'}}
    else{
      const j=await otcGet('/candles?'+new URLSearchParams({venue:'otc',symbol:sym,tf:'5',limit:'500'})),now=Date.now()/1000;
      let c=(Array.isArray(j.candles)?j.candles:[]).map(x=>({t:Number(x.time)-OTC.shift,o:Number(x.open),h:Number(x.high),l:Number(x.low),c:Number(x.close),v:Number(x.volume||0)}))
        .filter(x=>[x.t,x.o,x.h,x.l,x.c].every(Number.isFinite)).sort((a,b)=>a.t-b.t).filter((x,i,a)=>!i||x.t!==a[i-1].t);
      while(c.length&&c[c.length-1].t+5>now)c.pop();
      const age=c.length?now-(c[c.length-1].t+5):Infinity;
      if(OTC.usage&&Number.isFinite(OTC.usage.rem)){OTC.usage.rem--;renderUsage()}
      r=c.length<60?{ok:false,why:'замало закритих свічок'}:age>60?{ok:false,why:`дані застарілі (${Math.round(age)} с)`}:{ok:true,c,age:Math.max(0,Math.round(age))};
    }
  }catch(e){r={ok:false,why:otcWhy(e)}}
  OTC.cache[sym]={at:Date.now(),r};return r;
}
function showOtc(){

async function otcTick(){

/* SMART: байєсове зважування учасників за їхньою реальною влучністю в лізі */
function smartVote(v,x){
  let L=0,k=0;
  Object.entries(v).forEach(([eng,y])=>{if(eng==='FOX (консенсус)'||eng.startsWith('SMART'))return;
    const mm=eng.match(/^MEMO (\d+)$/);if(mm&&+mm[1]!==x)return;const base=mm?'MEMO':eng,A=agg[base+'|'+x];if(!A||A.n<30)return;
    const ph=(A.w+10)/(A.n+20);L+=(y.direction==='long'?1:-1)*Math.log(ph/(1-ph));k++});
  if(!k)return null;const P=1/(1+Math.exp(-L));
  if(P>=.58)return{direction:'long',why:`SMART: ${k} учасників зважено за їхньою влучністю в лізі`,exp:x,p:P*100};
  if(P<=.42)return{direction:'short',why:`SMART: ${k} учасників зважено за їхньою влучністю в лізі`,exp:x,p:(1-P)*100};
  return null;
}
/* одна цифра проходимості */
function passRate(s){
  const ex=nearestExp(s.trackExp||(s.ctx&&s.ctx.exp)||expSec());
  const fromAgg=(eng,minN)=>{const A=agg[eng+'|'+ex];return A&&A.n>=minN?{p:A.w/A.n*100,basis:`за ${A.n} автоперевірками ${eng} на ${ex} с`}:null};
  if(s.src==='meta'&&s.metaS)return{p:s.metaS.p,basis:s.metaS.n>=20?`за ${s.metaS.n} автоперевірками ${s.metaEngine} на ${ex} с`:`оцінка ${s.metaEngine} — у лізі ще мало перевірок`};
  if(s.src==='bot1'){const a=fromAgg('Бот №1',20);if(a)return a}
  if(s.smart&&s.smart.direction===s.direction){const a=fromAgg('SMART',30);if(a)return a;return{p:Math.min(75,s.smart.p),basis:'оцінка SMART за влучністю учасників у лізі'}}
  if(s.src==='bots'){const a=fromAgg('FOX (консенсус)',20);if(a)return a}
  const c=chanceFor(s);if(c&&!c.few&&Number.isFinite(c.p))return{p:c.p,basis:`за ${c.n} твоїми угодами`};
  if(s.power)return{p:s.power,basis:'попередня оцінка за голосами — даних ще мало'};
  if(s.confidence)return{p:s.confidence,basis:'оцінка команди'};
  return{p:50,basis:'ще немає даних'};
}

  const perm=await Notification.requestPermission();if(perm!=='granted'){toast('Сповіщення не дозволено — увімкни їх для SHADOW FOX у налаштуваннях пристрою');return}
  const reg=await navigator.serviceWorker.ready,{pub}=await cloudReq('/push/key'),key=b64uToU8(pub);
  let sub=await reg.pushManager.getSubscription();
  if(sub){try{const k=new Uint8Array(sub.options.applicationServerKey||[]);if(k.length&&k.join()!==key.join()){await sub.unsubscribe();sub=null}}catch(_){}}
  if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:key});
  const{sid}=await cloudReq('/push/sub',{sub:sub.toJSON(),dev:IS_PHONE?'телефон':'ноутбук'});
  const c=await caches.open('sf-meta');await c.put('/push-meta',new Response(JSON.stringify({sid,base:otcProxy()}),{headers:{'Content-Type':'application/json'}}));
  cfg.pushOn=true;saveCfg();renderCloud();toast('🔔 Сповіщення увімкнено на цьому пристрої')
}catch(e){toast('Не вдалося увімкнути: '+(e.message||e))}}
$('pushOn').onclick=enablePush;
$('pushTest').onclick=async()=>{try{const r=await cloudReq('/push/test',{});toast(r.sent?`📨 Надіслано на ${r.sent} пристр.`:'Ще немає пристроїв зі сповіщеннями — спершу увімкни їх')}catch(e){toast('Помилка: '+e.message)}};

/* ===================== НАВІГАЦІЯ ===================== */
const VIEWS=['trade','team','system','bots','analyzer','compare','trades','config','brain'];
function route(){
  const v=VIEWS.includes(location.hash.slice(1))?location.hash.slice(1):'trade';
  VIEWS.forEach(x=>$('v-'+x).classList.toggle('on',x===v));
  document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.v===v));
  requestAnimationFrame(()=>{drawCandles();drawBal();if(v==='team'){const c=$('chat');c.scrollTop=c.scrollHeight}});
}
addEventListener('hashchange',route);
addEventListener('resize',()=>{drawCandles();drawBal()});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{drawCandles();drawBal()});
analyzerSel.onchange=()=>{lastDir=null;runSignal()};$('btBtn').onclick=runBt;$('cmpBtn').onclick=runCompare;$('resetBots').onclick=resetBots;

fillAnalyzerSel();fillCfg();genDemo();resetBots();runSignal();renderJournal();renderTrades();renderBrain();renderChatAll();welcome();updStatus();renderRoster();renderVersions();renderSkins();applyUX();renderUX();route();refreshButtons();
/* ===================== ІНТЕР'ЄР: фічі й переходи ===================== */
(function(){
  const bar=document.createElement('div');bar.className='progress';bar.innerHTML='<i></i>';document.body.appendChild(bar);
  const fab=document.createElement('button');fab.className='fab';fab.setAttribute('aria-label','Нагору');fab.textContent='↑';fab.onclick=()=>scrollTo({top:0,behavior:'smooth'});document.body.appendChild(fab);
  const th=document.createElement('button');th.className='themebtn';th.setAttribute('aria-label','Змінити тему');th.textContent='🌓';
  th.onclick=()=>{const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark';setTimeout(()=>{drawCandles();drawBal()},50)};
  const ctr=document.querySelector('.controls');if(ctr)ctr.appendChild(th);
  const upd=()=>{const h=document.documentElement,m=h.scrollHeight-innerHeight;bar.firstChild.style.width=(m>0?scrollY/m*100:0)+'%';fab.classList.toggle('show',scrollY>300)};
  addEventListener('scroll',upd,{passive:true});upd();
  const go=d=>{const i=VIEWS.indexOf(location.hash.slice(1)||'trade'),n=VIEWS[(i+d+VIEWS.length)%VIEWS.length];location.hash=n;document.body.dataset.dir=d>0?'r':'l'};
  addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)||e.ctrlKey||e.metaKey)return;
    if(e.key>='1'&&e.key<='7'){location.hash=VIEWS[+e.key-1]}else if(e.key==='ArrowRight')go(1);else if(e.key==='ArrowLeft')go(-1)});
  let sx=0,sy=0;addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
  addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>90&&Math.abs(dy)<45&&!e.target.closest('canvas,pre,.pairs,.tfbar,nav,textarea,.chat'))go(dx<0?1:-1)},{passive:true});
  document.addEventListener('pointerdown',e=>{const b=e.target.closest('button.primary,.tfbar button,.pairs button');if(!b)return;const r=b.getBoundingClientRect(),s=document.createElement('span');s.className='ripple';s.style.left=e.clientX-r.left+'px';s.style.top=e.clientY-r.top+'px';b.appendChild(s);setTimeout(()=>s.remove(),600)});
  document.querySelectorAll('.view .panel').forEach((p,i)=>p.style.setProperty('--i',i%6));
})();
window.__appOK=true;
