<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SHADOW FOX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;800&display=swap" rel="stylesheet">
<script id="safe">(function(){var t0=Date.now();
function show(msg){if(document.getElementById('safebar'))return;var b=document.createElement('div');b.id='safebar';
b.style.cssText='position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:99;background:#2a0f17;color:#fff;border:1px solid #ff5c7a;border-radius:12px;padding:12px;font:14px system-ui,sans-serif';
b.innerHTML='Сторінка зламалась після зміни: '+String(msg||'').slice(0,140).replace(/[<&]/g,'')+' <button id="safeback" style="margin-left:8px;padding:6px 12px;border-radius:8px;border:0;background:#ff5c7a;color:#fff;font-weight:600">Відкотити</button>';
(document.body||document.documentElement).appendChild(b);
document.getElementById('safeback').onclick=async function(){try{var bk=JSON.parse(localStorage.getItem('sd-backups')||'[]')[0];if(!bk){alert('Немає резервної копії');return}var a=window.claude&&await window.claude.use('artifact');if(!a){alert('Відкат працює, коли сторінку відкрито в Claude');return}await a.publish(bk.html)}catch(e){alert('Не вдалося: '+(e&&e.message))}};}
window.addEventListener('error',function(e){if(Date.now()-t0<10000)show(e.message)});
setTimeout(function(){if(!window.__appOK)show('застосунок не запустився')},7000);
window.__safeShow=show;})();</script>
<style id="app-css">
:root{
  --bg:#eef0f7; --panel:rgba(255,255,255,.84); --panel2:#f2f3fa; --line:#d9dcea;
  --text:#14172b; --muted:#5d6380; --up:#0f9d6b; --down:#d63a5c;
  --ring1:#7b5cff; --ring2:#ff5ca8; --flat:#8a90ad; --orb1:rgba(123,92,255,.28); --orb2:rgba(255,92,168,.22);
  --bot:#f4f5ff; --botline:#1a1d33;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#070915; --panel:rgba(18,21,40,.8); --panel2:#181c33; --line:#262b48;
    --text:#e9ebf8; --muted:#8a90b3; --up:#2fd39a; --down:#ff5c7a; --flat:#6d7396;
    --orb1:rgba(123,92,255,.32); --orb2:rgba(255,92,168,.2); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#070915; --panel:rgba(18,21,40,.8); --panel2:#181c33; --line:#262b48;
  --text:#e9ebf8; --muted:#8a90b3; --up:#2fd39a; --down:#ff5c7a; --flat:#6d7396;
  --orb1:rgba(123,92,255,.32); --orb2:rgba(255,92,168,.2); color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums;line-height:1.45;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
.orbs{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.orbs i{position:absolute;width:55vmax;height:55vmax;border-radius:50%;filter:blur(70px)}
.orbs i:nth-child(1){background:var(--orb1);top:-20vmax;left:-15vmax;animation:drift1 22s ease-in-out infinite alternate}
.orbs i:nth-child(2){background:var(--orb2);bottom:-25vmax;right:-15vmax;animation:drift2 26s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(18vmax,14vmax) scale(1.15)}}
@keyframes drift2{to{transform:translate(-16vmax,-12vmax) scale(.9)}}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.brand{font-weight:800;font-size:1.2rem;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.brand small{display:block;font-weight:400;font-size:.78rem;color:var(--muted)}
.logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--ring1),var(--ring2));background-size:200% 200%;animation:hue 6s ease infinite;display:grid;place-items:center;color:#fff;font-size:1rem}
@keyframes hue{50%{background-position:100% 100%}}
.live{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;color:var(--muted)}
.live b{width:8px;height:8px;border-radius:50%;background:var(--flat)}
.live.on b{background:var(--up);animation:ping 1.4s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--up) 70%,transparent)}100%{box-shadow:0 0 0 10px transparent}}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;padding:6px 0 10px;display:flex;gap:6px;overflow-x:auto;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
nav a{flex:none;text-decoration:none;color:var(--muted);font-weight:600;font-size:.9rem;padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--panel);transition:color .2s,transform .2s,background .3s}
nav a:hover{transform:translateY(-1px);color:var(--text)}
nav a.on{color:#fff;background:linear-gradient(135deg,var(--ring1),var(--ring2));border-color:transparent;box-shadow:0 6px 20px -6px var(--ring1)}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,button,input,textarea{font:inherit;font-size:.88rem;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
textarea{resize:none}
button{cursor:pointer;font-weight:600;transition:transform .15s,box-shadow .2s,opacity .2s}
button:hover:not(:disabled){transform:translateY(-1px)}
button:active:not(:disabled){transform:scale(.97)}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--ring1),var(--ring2));color:#fff;border:0;box-shadow:0 6px 18px -8px var(--ring2)}
button.primary::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-100%)}
button.primary:hover:not(:disabled)::after{animation:shine .8s}
@keyframes shine{to{transform:translateX(100%)}}
.pairtabs{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.pairtabs button{padding:5px 12px;border-radius:99px;font-size:.8rem}
.pairtabs button.on{background:linear-gradient(135deg,var(--ring1),var(--ring2));color:#fff;border-color:transparent}
.pairs{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px;max-height:230px;overflow:auto;margin-bottom:6px}
.pairs button{padding:9px 6px;font-size:.82rem;border-radius:12px;background:var(--panel2)}
.pairs button.sel{border-color:var(--ring1);box-shadow:0 0 0 2px color-mix(in srgb,var(--ring1) 35%,transparent);color:var(--ring1)}
#dealBtn{width:100%;font-size:1.15rem;padding:16px 26px;box-shadow:0 10px 28px -10px var(--ring1)}
.panel{border-radius:20px;box-shadow:0 8px 30px -18px var(--ring1)}
button.big{font-size:1.05rem;padding:14px 26px;border-radius:16px}
:focus-visible{outline:2px solid var(--ring1);outline-offset:2px}
.view{display:none}
.view.on{display:block;animation:viewIn .45s cubic-bezier(.2,.8,.2,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(12px)}}
.grid{display:grid;grid-template-columns:1.25fr 1fr;gap:14px}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:box-shadow .25s,border-color .25s}
.panel:hover{box-shadow:0 14px 34px -22px var(--ring1);border-color:color-mix(in srgb,var(--ring1) 35%,var(--line))}
.full{grid-column:1/-1}
.grid>*,.chat-wrap>*,.deal-grid>*{min-width:0}
.trade-card.long,.trade-card.short,.trade-card.flat{color:var(--text)}
.pill{display:inline-block;font-size:.75rem;padding:3px 9px;border-radius:99px;background:var(--panel2);color:var(--muted);margin:0 6px 4px 0}
.verdict{font-size:clamp(1.6rem,4.5vw,2.3rem);font-weight:800;letter-spacing:-.02em;margin:10px 0 6px}
.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.85);opacity:.3}}
.long{color:var(--up)} .short{color:var(--down)} .flat{color:var(--flat)}
.reasons{margin:0;padding-left:18px;color:var(--muted);font-size:.9rem}
.reasons li{animation:slideIn .35s both}
@keyframes slideIn{from{opacity:0;transform:translateX(-8px)}}
.signal{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.ring{width:130px;height:130px;position:relative}
.ring svg{transform:rotate(-90deg);overflow:visible}
.ring.hot svg{animation:glow 1.8s ease-in-out infinite}
@keyframes glow{50%{filter:drop-shadow(0 0 10px var(--ring2))}}
.ring .val{position:absolute;inset:0;display:grid;place-items:center;font-size:1.9rem;font-weight:600}
.ring .val span{font-size:.9rem;color:var(--muted)}
.cap{text-align:center;font-size:.75rem;color:var(--muted);margin-top:4px}
.chart-box{position:relative;height:300px}
.chart-box.sm{height:200px}
canvas{width:100%;height:100%;display:block}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.stat{background:var(--panel2);border-radius:12px;padding:10px}
.stat b{display:block;font-size:1.2rem}
.stat span{font-size:.75rem;color:var(--muted)}
h2{font-size:1rem;margin:0 0 10px}
.note{font-size:.8rem;color:var(--muted);margin:10px 0 0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
pre{background:var(--panel2);border-radius:12px;padding:12px;overflow-x:auto;font-size:.78rem;margin:8px 0 0;white-space:pre}
.bar{height:8px;border-radius:9px;background:var(--panel2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ring1),var(--ring2));transition:width .8s cubic-bezier(.2,.8,.2,1)}
/* інтер'єр */
.progress{position:fixed;top:0;left:0;right:0;height:3px;z-index:30;pointer-events:none}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ring1),var(--ring2));box-shadow:0 0 10px var(--ring2);transition:width .15s}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;width:44px;height:44px;border-radius:50%;padding:0;font-size:1.2rem;background:linear-gradient(135deg,var(--ring1),var(--ring2));color:#fff;border:0;box-shadow:0 10px 24px -8px var(--ring1);opacity:0;transform:translateY(20px) scale(.8);pointer-events:none;transition:opacity .3s,transform .3s}
.fab.show{opacity:1;transform:none;pointer-events:auto}
.themebtn{padding:6px 10px;border-radius:99px}
.themebtn:hover{transform:rotate(180deg) !important;transition:transform .5s}
.view.on .panel{animation:panelIn .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*.06s)}
@keyframes panelIn{from{opacity:0;transform:translateY(18px) scale(.985);filter:blur(4px)}}
body[data-dir=r] .view.on{animation-name:slideR}
body[data-dir=l] .view.on{animation-name:slideL}
@keyframes slideR{from{opacity:0;transform:translateX(28px)}}
@keyframes slideL{from{opacity:0;transform:translateX(-28px)}}
.panel{position:relative}
.panel::before{content:"";position:absolute;left:18px;right:18px;top:0;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--ring1),var(--ring2),transparent);opacity:.5;transition:opacity .3s}
.panel:hover::before{opacity:1}
nav a{position:relative}
nav a.on{animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
.ripple{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:rgba(255,255,255,.55);pointer-events:none;animation:rip .6s ease-out forwards}
@keyframes rip{to{transform:scale(18);opacity:0}}
.tfbar button,.pairs button,.pairtabs button{position:relative;overflow:hidden}
.bot{background:linear-gradient(160deg,var(--panel2),color-mix(in srgb,var(--ring1) 8%,var(--panel2)))}
.bot .bal{background:linear-gradient(135deg,var(--text),var(--ring1));-webkit-background-clip:text;background-clip:text;color:transparent}
.bot:hover{box-shadow:0 14px 28px -16px var(--ring1)}
.log div{animation:slideIn .35s both}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--ring1) 40%,transparent);border-radius:8px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01s !important;transition-duration:.01s !important}}
/* аватари */
.av{display:inline-block;flex:none;border-radius:50%;overflow:hidden;line-height:0}
.av svg{width:100%;height:100%}
.av{border-radius:22%;clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%);background:linear-gradient(145deg,#555b6e,#14161f);padding:2px;box-shadow:0 0 0 2px #0b0c12;filter:contrast(1.25) saturate(1.2) drop-shadow(0 3px 6px rgba(0,0,0,.55))}
.av svg{clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%)}
.av.fox{background:linear-gradient(145deg,var(--ring1),#14161f)}
.tfbar{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.tfbar button{padding:7px 12px;border-radius:10px;font-weight:700}
.tfbar button.on{background:var(--ring1);color:#fff;border-color:var(--ring1)}
.av .eye{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
.av.k1 .eye{animation-delay:1.1s}.av.k2 .eye{animation-delay:2.3s}.av.k3 .eye{animation-delay:.6s}.av.k4 .eye{animation-delay:3.1s}.av.k5 .eye{animation-delay:1.8s}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.av.talk{animation:bob .6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
/* угода */
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{border:0;background:transparent;border-radius:10px;padding:9px 14px;color:var(--muted)}
.seg button.on{background:var(--panel);color:var(--text);box-shadow:0 4px 14px -8px var(--ring1)}
.deal-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
@media (max-width:720px){.deal-grid{grid-template-columns:1fr}}
.roster{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
@media (max-width:760px){.roster{grid-template-columns:repeat(3,1fr)}.roster .rb:first-child{grid-column:1/-1;flex-direction:row;justify-content:center;gap:12px}}
.rb{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);font-size:.78rem;text-align:center;transition:transform .25s}
.rb:hover{transform:translateY(-3px)}
.rb b{font-size:.85rem;letter-spacing:.03em}
.rb .vt{font-weight:700;min-height:1.2em}
.drop{position:relative;min-height:200px;border-radius:16px;display:grid;place-items:center;text-align:center;cursor:pointer;overflow:hidden;color:var(--muted);font-size:.9rem;padding:18px;
  background:linear-gradient(var(--panel2),var(--panel2)) padding-box,repeating-linear-gradient(45deg,var(--ring1) 0 10px,transparent 10px 20px) border-box;border:2px dashed transparent;background-size:auto,28px 28px;animation:ants 1.2s linear infinite;transition:transform .2s}
@keyframes ants{to{background-position:0 0,28px 0}}
.drop.over{transform:scale(1.02)}
.drop.has{padding:0;animation:none;border:1px solid var(--line);background:var(--panel2)}
.drop img{width:100%;height:100%;max-height:320px;object-fit:contain;display:block}
.drop .icon{font-size:2rem;display:block;margin-bottom:6px;animation:bob 2.4s ease-in-out infinite}
.scan{position:absolute;left:0;right:0;height:60px;top:-60px;background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--ring1) 45%,transparent),transparent);display:none;pointer-events:none}
.drop.scanning .scan{display:block;animation:scan 1.6s ease-in-out infinite}
.drop.scanning img{filter:saturate(.6) brightness(.85)}
@keyframes scan{to{top:100%}}
.thinking{display:flex;align-items:center;justify-content:center;gap:6px;color:var(--muted);padding:20px 0}
.thinking i{width:8px;height:8px;border-radius:50%;background:var(--ring1);animation:dot 1s infinite}
.thinking i:nth-child(2){animation-delay:.15s;background:color-mix(in srgb,var(--ring1) 50%,var(--ring2))}.thinking i:nth-child(3){animation-delay:.3s;background:var(--ring2)}
@keyframes dot{50%{transform:translateY(-7px);opacity:.4}}
.trade-card{border-radius:16px;padding:16px;background:var(--panel2);border:1px solid var(--line);animation:cardIn .55s cubic-bezier(.2,1.3,.4,1)}
.trade-card.long{border-color:var(--up);box-shadow:0 0 0 1px var(--up) inset,0 10px 30px -18px var(--up)}
.trade-card.short{border-color:var(--down);box-shadow:0 0 0 1px var(--down) inset,0 10px 30px -18px var(--down)}
@keyframes cardIn{from{opacity:0;transform:scale(.92) translateY(10px)}}
.res-box{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.res-q{font-weight:700;margin-bottom:8px}
.res-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.res-btns button{font-size:1rem;padding:12px;border-radius:14px;border:2px solid}
.res-yes{border-color:var(--up)!important;color:var(--up)}
.res-no{border-color:var(--down)!important;color:var(--down)}
.res-done{font-weight:600;padding:10px 12px;border-radius:12px;background:var(--panel)}
.votes{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.vote{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:3px 10px 3px 3px;font-size:.78rem;animation:cardIn .4s both}
.conf{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin:6px 0 10px}
.conf i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ring1),var(--ring2));transition:width 1s cubic-bezier(.2,.8,.2,1)}
/* боти */
.bots{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.bot{position:relative;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px;transition:opacity .3s,transform .25s;animation:viewIn .4s both}
.bot:hover{transform:translateY(-3px)}
.bot.off{opacity:.5}
.bot.trading::before{content:"";position:absolute;inset:-1px;border-radius:15px;padding:1px;background:conic-gradient(from var(--a,0deg),var(--ring1),var(--ring2),transparent 60%,var(--ring1));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 2.4s linear infinite;pointer-events:none}
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
@keyframes spin{to{--a:360deg}}
.bot.win{animation:flashW .9s}.bot.lose{animation:flashL .9s}
@keyframes flashW{30%{box-shadow:0 0 0 3px var(--up),0 0 24px var(--up)}}
@keyframes flashL{30%{box-shadow:0 0 0 3px var(--down),0 0 24px var(--down)}}
.bot .top{display:flex;align-items:center;gap:10px}
.bot h3{margin:0;font-size:1rem;letter-spacing:.02em}
.bot .role{font-size:.72rem;color:var(--muted)}
.bot .bal{font-size:1.25rem;font-weight:600;margin:8px 0 2px}
.bot .chg{font-size:.8rem}
.bot .state{font-size:.75rem;color:var(--muted);margin-top:4px;min-height:1.1em}
.bot label{display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted);margin-top:8px;cursor:pointer}
.strat-sel{width:100%;margin-top:8px;font-size:.78rem;padding:5px 8px}
/* чат */
.chat-wrap{display:grid;grid-template-columns:1.6fr 1fr;gap:14px}
@media (max-width:860px){.chat-wrap{grid-template-columns:1fr}}
.chat{height:min(62vh,560px);overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px 2px 8px;scroll-behavior:smooth}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:92%;animation:msgIn .4s cubic-bezier(.2,1.2,.4,1) both}
@keyframes msgIn{from{opacity:0;transform:translateY(10px) scale(.97)}}
.msg .bub{background:var(--panel2);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:8px 12px;font-size:.9rem;white-space:pre-wrap;word-break:break-word}
.msg .who{font-size:.72rem;color:var(--muted);margin-bottom:2px}
.msg .who b{color:var(--text)}
.msg.me{align-self:flex-end;flex-direction:row-reverse}

/* ===================== переходи ===================== */
html[data-fx] .view.on .panel{animation:none!important;filter:none!important}

html[data-fx=swing] .view.on{animation:fxSwing .45s cubic-bezier(.2,1.3,.4,1) both;transform-origin:0 0}

html[data-fx=cascade] .view.on .panel:nth-child(2){animation-delay:.05s!important}html[data-fx=cascade] .view.on .panel:nth-child(3){animation-delay:.1s!important}html[data-fx=cascade] .view.on .panel:nth-child(n+4){animation-delay:.15s!important}
@keyframes fxFade{from{opacity:0}}

@keyframes tShake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

html[data-home=stack] #dealBtn,html[data-home=list] #dealBtn,html[data-home=scroll] #dealBtn{width:100%}
html[data-home=list] .pairs{grid-template-columns:1fr!important;max-height:280px}html[data-home=list] .pairs button{text-align:left;padding:12px 14px}
html[data-home=scroll] .pairs{display:flex!important;overflow-x:auto;max-height:none;padding-bottom:6px}html[data-home=scroll] .pairs button{flex:none}
html[data-home=minimal] .blk-tf,html[data-home=minimal] .pairtabs,html[data-home=minimal] #mBots,html[data-home=minimal] .blk-seg,html[data-home=minimal] .pairs{display:none!important}
html[data-home=minimal] #dealBtn{width:100%;min-height:72px;font-size:1.3rem}
html[data-home=cockpit] .blk-go{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:17;margin:0!important}
html[data-home=cockpit] #dealBtn{width:100%;min-height:64px;font-size:1.25rem;box-shadow:0 14px 34px -10px var(--ring1)}
html[data-home=cockpit] .wrap{padding-bottom:110px}
html[data-layout=bottom][data-home=cockpit] .blk-go,html[data-layout=fab][data-home=cockpit] .blk-go,html[data-layout=lefty][data-home=cockpit] .blk-go{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
html[data-home=side] .blk-tf .tfbar{flex-direction:column;align-items:stretch}
html[data-home=side] .deal-ctl{display:grid;grid-template-columns:auto 1fr;gap:0 12px}
html[data-home=side] .deal-ctl>*{grid-column:1/-1}html[data-home=side] .blk-tf{grid-column:1;grid-row:2 / span 2}html[data-home=side] .blk-pairs{grid-column:2;grid-row:2}
/* вигляд кнопок */
html[data-btn=square] :is(.tfbar,.pairs,.pairtabs,.seg) button,html[data-btn=square] nav a,html[data-btn=square] button.primary{border-radius:6px!important}
html[data-btn=outline] :is(.tfbar,.pairs,.pairtabs,.seg) button,html[data-btn=outline] nav a{background:transparent!important;border:1.5px solid var(--line)!important}
html[data-btn=outline] :is(.tfbar,.pairs,.pairtabs,.seg) button:is(.on,.sel),html[data-btn=outline] nav a.on{border-color:var(--ring1)!important;color:var(--ring1)!important;background:transparent!important}
html[data-btn=glass] :is(.tfbar,.pairs,.pairtabs,.seg) button,html[data-btn=glass] nav a{background:color-mix(in srgb,#fff 7%,transparent)!important;border:1px solid color-mix(in srgb,#fff 14%,transparent)!important;backdrop-filter:blur(10px)}
html[data-btn=neon] :is(.tfbar,.pairs,.pairtabs,.seg) button,html[data-btn=neon] nav a{background:transparent!important;border:1px solid var(--ring1)!important;box-shadow:0 0 8px color-mix(in srgb,var(--ring1) 35%,transparent)!important}
html[data-btn=neon] :is(.tfbar,.pairs,.pairtabs,.seg) button:is(.on,.sel),html[data-btn=neon] nav a.on{box-shadow:0 0 6px var(--ring1),0 0 22px var(--ring1)!important;color:var(--text)!important}
html[data-btn=solid] :is(.tfbar,.pairs,.pairtabs,.seg) button,html[data-btn=solid] nav a{background:var(--panel2)!important;border:0!important}
html[data-btn=solid] :is(.tfbar,.pairs,.pairtabs,.seg) button:is(.on,.sel),html[data-btn=solid] nav a.on{background:var(--ring1)!important;color:var(--on-acc,#fff)!important}
html[data-btn=d3] :is(.tfbar,.pairs,.pairtabs,.seg) button,html[data-btn=d3] nav a,html[data-btn=d3] button.primary{border:0!important;box-shadow:0 4px 0 color-mix(in srgb,#000 45%,var(--panel2))!important;transform:translateY(-2px)}
html[data-btn=d3] :is(.tfbar,.pairs,.pairtabs,.seg) button:active,html[data-btn=d3] button.primary:active{transform:translateY(2px);box-shadow:0 1px 0 #000!important}
html[data-btn=flat] :is(.tfbar,.pairs,.pairtabs,.seg) button,html[data-btn=flat] nav a{background:transparent!important;border:0!important;box-shadow:none!important;border-radius:0!important}
html[data-btn=flat] :is(.tfbar,.pairs,.pairtabs,.seg) button:is(.on,.sel),html[data-btn=flat] nav a.on{box-shadow:inset 0 -2px 0 var(--ring1)!important;color:var(--text)!important;background:transparent!important}
html[data-btn=round] :is(.tfbar,.pairtabs,.seg) button{border-radius:50%!important;width:52px;height:52px;padding:0!important;display:inline-grid;place-items:center;font-size:.72rem}
html[data-btn=round] .pairs button,html[data-btn=round] nav a{border-radius:99px!important}
html[data-btn=big] :is(.tfbar,.pairs,.pairtabs,.seg) button{padding:14px 16px!important;font-size:1rem!important}html[data-btn=big] nav a{padding:12px 18px!important}
/* шкали */
.gnum{font-size:3.4rem;font-weight:800;text-align:center;line-height:1;margin:10px 0 0;font-variant-numeric:tabular-nums}.gnum small{font-size:1.2rem}
.gring{position:relative;width:120px;height:120px;margin:10px auto 0}.gring svg{width:120px;height:120px;transform:rotate(-90deg)}
.gring .t{fill:none;stroke:var(--panel);stroke-width:9}.gring .v{fill:none;stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset 1s}
.gring span{position:absolute;inset:0;display:grid;place-items:center;font-size:1.6rem;font-weight:800}
.gspeedo{position:relative;width:200px;margin:10px auto 0;text-align:center}.gspeedo svg{width:200px;height:124px;overflow:visible}
.gspeedo path{fill:none;stroke-width:9;stroke-linecap:round}.gspeedo .lo{stroke:color-mix(in srgb,var(--down) 70%,transparent)}.gspeedo .hi{stroke:color-mix(in srgb,var(--up) 70%,transparent)}
.gspeedo .nd{stroke:var(--text);stroke-width:2.5;stroke-linecap:round;transform-origin:50px 55px;transition:transform 1s cubic-bezier(.2,.8,.2,1)}.gspeedo .hub{fill:var(--text)}
.gspeedo b{display:block;font-size:1.5rem;margin-top:-6px}
.gblocks{display:flex;align-items:center;gap:4px;margin:12px 0 0}.gblocks i{flex:1;height:18px;border-radius:4px;background:var(--panel);border:1px solid var(--line)}
.gblocks i.on{background:linear-gradient(180deg,var(--ring1),var(--ring2));border-color:transparent}.gblocks i.be{outline:2px dashed var(--down);outline-offset:1px}.gblocks b{margin-left:8px;font-size:1.2rem}
/* якість входу */
.qual{display:flex;align-items:center;gap:10px;margin:10px 0 2px;padding:8px 10px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.qual b{width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;font-size:1.1rem;color:#fff}
.qual span{display:flex;flex-direction:column;font-size:.85rem;font-weight:600}.qual small{font-weight:400;color:var(--muted);font-size:.74rem}
.qual.qA b{background:var(--up)}.qual.qB b{background:#f5a524}.qual.qC b{background:var(--down)}
.qual.qC{border-color:var(--down)}

/* ===================== otcharts ===================== */
.nodata{padding:22px 16px;border-radius:14px;border:1px solid var(--down);background:color-mix(in srgb,var(--down) 10%,transparent);font-weight:700;text-align:center}
.nodata small{display:block;font-weight:400;color:var(--muted);margin-top:6px}
#otcStatus.ok{color:var(--up)}#otcStatus.bad{color:var(--down)}
</style>
</head>
<body>
<template id="app-body"><div class="orbs" aria-hidden="true"><i></i><i></i></div>
<div class="toast" id="toast" role="status"></div>
<div class="wrap">
  <header>
    <div class="brand"><span class="logo">🦊</span><div>SHADOW FOX<small>Сигнали, боти й команда ШІ</small></div></div>
    <div class="controls">
      <span class="live" id="liveDot"><b></b><span id="liveTxt">Потік зупинено</span></span>
      <button id="liveBtn" class="primary">Запустити потік</button>
      <button id="csvBtn">Свічки CSV</button>
      <input type="file" id="csvInput" accept=".csv,text/csv">
    </div>
  </header>
  <nav>
    <a href="#trade" data-v="trade">Угода</a>
    <a href="#team" data-v="team">Чат</a>
    <a href="#brain" data-v="brain">Мозок</a>
    <a href="#bots" data-v="bots">Боти</a>
    <a href="#analyzer" data-v="analyzer">Аналізатор</a>
    <a href="#compare" data-v="compare">Порівняння</a>
    <a href="#trades" data-v="trades">Мої угоди</a>
    <a href="#config" data-v="config">Налаштування</a>
  </nav>

  <!-- УГОДА -->
  <div class="view" id="v-trade"><div class="grid">
    <section class="panel full">
      <div class="row" style="justify-content:space-between">
        <h2 style="margin:0">Зробити угоду</h2>
        <span><span class="pill" id="dealSrc"></span><span class="pill" id="dealExp"></span></span>
      </div>
      <div class="deal-info" id="dealInfo"><span>🕐 <b id="diClock">--:--:--</b></span><span>⏳ Експірація <b id="diExp">—</b></span><span>⏱ Угода <b id="diDeal">немає</b></span></div>
      <div class="seg blk-seg" role="tablist" style="margin-top:12px">
        <button data-m="bots" class="on" role="tab">🤖 Аналіз ботів</button>
        <button data-m="photo" role="tab">📸 Фото + ШІ-команда</button>
      </div>
      <div class="deal-grid">
        <div class="deal-ctl">
          <label class="blk-pair" style="font-size:.85rem;color:var(--muted);display:flex;flex-direction:column;gap:5px;margin-bottom:10px">Актив
            <input id="dealPair" placeholder="Напр. EUR/JPY OTC"></label>
          <div class="blk-tf"><div class="blk-lbl" style="font-size:.85rem;color:var(--muted);margin-bottom:5px">Таймфрейм</div>
          <div class="tfbar" id="tfBar"><button data-tf="0.0833">5с</button><button data-tf="0.25">15с</button><button data-tf="1">M1</button><button data-tf="5">M5</button><button data-tf="15">M15</button><button data-tf="60">H1</button></div></div>
          <div class="blk-pairs"><div class="pairtabs"><button data-pt="">Усі</button><button data-pt="cur" class="on">Валюти</button><button data-pt="otc">OTC</button><button data-pt="cry">Крипто</button></div>
          <div class="pairs" id="pairGrid"></div></div>
          <div class="blk-mode"><div id="mBots">
            <p class="note" style="margin-top:0">Шість ботів аналізують свічки з потоку за своїми стратегіями й голосують. Миттєво й без витрат лімітів Claude.</p>
          </div>
          <div id="mPhoto" hidden="">
            <div class="drop" id="drop" tabindex="0" role="button" aria-label="Додати фото графіка">
              <input type="file" id="phInput" accept="image/*">
              <img id="phImg" alt="Фото графіка" hidden="">
              <div class="scan"></div>
              <div id="dropHint"><span class="icon">📸</span>Натисни, щоб вибрати скріншот графіка.<br>Можна перетягнути або вставити (Ctrl+V).</div>
            </div>
            <p class="note" id="phNote">Фото розглядає вся команда: кожен агент голосує, ORIN оголошує спільне рішення.</p>
          </div></div>
          <div class="row blk-go" style="margin-top:14px">
            <button id="dealBtn" class="primary big">Зробити угоду</button>
            <button id="dealStop" hidden="">Зупинити</button>
            <button id="phClear" hidden="">Інше фото</button>
          </div>
        </div>
        <div id="dealOut"><div class="empty" style="text-align:center;padding:40px 0">Обери режим і натисни «Зробити угоду»</div></div>
      </div>
    </section>
    <section class="panel full">
      <h2>Команда</h2>
      <div class="roster" id="roster"></div>
    </section>
  </div></div>

  <!-- КОМАНДА -->
  <div class="view" id="v-team"><div>
    <section class="panel">
      <div class="row" style="justify-content:space-between;margin-bottom:6px">
        <h2 style="margin:0">Чат команди</h2>
        <div class="row"><button class="mini" id="meetBtn">Нарада</button><button class="mini" id="clearChat">Очистити</button></div>
      </div>
      <div class="chat" id="chat"></div>
      <div class="typing" id="typing"></div>
      <div class="chips" id="chips">
        <button data-q="Дайте сигнал по поточному ринку">Дай сигнал</button>
        <button data-q="Розберіть мої мінусові угоди й виправте, що потрібно">Розберіть мінуси</button>
        <button data-q="Що в моїй статистиці працює, а що ні? Чесно.">Що працює?</button>
        <button data-q="Що змінити в серверному боті, щоб підняти winrate? Напишіть код.">Код для бота</button>
        <button data-q="Покажіть, що зараз у спільному мозку, і що з цього варто прибрати">Перевірте мозок</button>
        <button data-q="Хочу змінити дизайн сторінки. Запропонуйте 2–3 варіанти, я оберу">Змінити дизайн</button>
      </div>
      <div class="attach" id="attachInfo" hidden=""></div>
      <div class="composer">
        <button id="chatPhoto" aria-label="Додати фото" title="Додати фото">📎</button>
        <input type="file" id="chatPhotoInput" accept="image/*">
        <textarea id="chatIn" rows="1" placeholder="Завдання команді…"></textarea>
        <button id="chatSend" class="primary">Надіслати</button>
        <button id="chatStop" hidden="">Стоп</button>
      </div>
    </section>
  </div></div>

  <!-- МОЗОК -->
  <div class="view" id="v-brain">
    <section class="panel brain">
      <h2>Спільний мозок</h2>
      <p class="note" style="margin-top:0">Усе, що тут, команда бачить у кожному запиті. Кожну зміну агенти пишуть у чат, і її можна скасувати.</p>
      <h3>Агенти, створені командою</h3><div id="bAgents"></div>
      <h3>Правила</h3><div id="bRules"></div>
      <h3>Уроки з мінусів</h3><div id="bLessons"></div>
      <h3>Стратегії агентів</h3><div id="bStrats"></div>
      <h3>Код для серверного бота</h3><div id="bCode"></div>
    </section>
  </div>

  <!-- БОТИ -->
  <div class="view" id="v-bots"><div class="grid">
    <section class="panel full">
      <div class="row" style="justify-content:space-between;margin-bottom:10px">
        <h2 style="margin:0">Боти</h2>
        <button id="resetBots">Скинути результати</button>
      </div>
      <div class="bots" id="botGrid"></div>
      <p class="note">Боти тестують стратегії на потоці свічок, без грошей. Кожному можна вибрати стратегію, зокрема ту, яку написала команда.</p>
    </section>
    <section class="panel" style="display:none"><h2>Історія балансу</h2><div class="chart-box sm"><canvas id="balChart"></canvas></div></section>
    <section class="panel full"><h2>Журнал ботів</h2><div class="log" id="botLog"><div><span style="color:var(--muted)">Поки що угод немає</span></div></div></section>
  </div></div>

  <!-- АНАЛІЗАТОР -->
  <div class="view" id="v-analyzer"><div class="grid">
    <section class="panel">
      <div class="row" style="margin-bottom:6px"><select id="analyzerSel" aria-label="Аналізатор"></select></div>
      <div class="signal">
        <div>
          <span class="pill" id="pairPill">DEMO/USD</span><span class="pill" id="srcPill">Демо-дані</span>
          <div class="verdict flat" id="verdict">Чекати</div>
          <ul class="reasons" id="reasons"><li>Немає даних</li></ul>
        </div>
        <div>
          <div class="ring" id="ring">
            <svg width="130" height="130" viewBox="0 0 130 130" aria-hidden="true">
              <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7b5cff"></stop><stop offset="1" stop-color="#ff5ca8"></stop></linearGradient></defs>
              <circle cx="65" cy="65" r="54" fill="none" stroke="var(--panel2)" stroke-width="10"></circle>
              <circle id="ringArc" cx="65" cy="65" r="54" fill="none" stroke="url(#g)" stroke-width="10" stroke-linecap="round" stroke-dasharray="339.3" stroke-dashoffset="339.3" style="transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)"></circle>
            </svg>
            <div class="val"><b id="scoreVal">0</b><span>%</span></div>
          </div>
          <div class="cap">Сила за індикаторами</div>
        </div>
      </div>
    </section>
    <section class="panel">
      <h2>Перевірка на історії</h2>
      <div class="stats">
        <div class="stat"><b id="btHit">—</b><span>Точність</span></div>
        <div class="stat"><b id="btN">—</b><span>Сигналів</span></div>
        <div class="stat"><b id="btPnl">—</b><span>Результат</span></div>
      </div>
      <div class="bar"><i id="btBar"></i></div>
      <p class="note" id="btNote"></p>
      <button id="btBtn" style="margin-top:10px">Перевірити</button>
    </section>
    <section class="panel full"><div class="chart-box"><canvas id="chart"></canvas></div></section>
  </div></div>

  <!-- ПОРІВНЯННЯ -->
  <div class="view" id="v-compare">
    <section class="panel">
      <div class="row" style="justify-content:space-between;margin-bottom:10px">
        <h2 style="margin:0">Порівняння стратегій на історії</h2>
        <button id="cmpBtn" class="primary">Порівняти всі</button>
      </div>
      <div class="table-wrap"><table>
        <thead><tr><th>Стратегія</th><th>Точність</th><th>Сигналів</th><th>Результат</th><th>Вердикт</th></tr></thead>
        <tbody id="cmpBody"><tr><td colspan="5" style="color:var(--muted)">Натисни «Порівняти всі»</td></tr></tbody>
      </table></div>
      <p class="note" id="cmpNote"></p>
    </section>
  </div>

  <!-- МОЇ УГОДИ -->
  <div class="view" id="v-trades"><div class="grid">
    <section class="panel full">
      <div class="row" style="justify-content:space-between;margin-bottom:10px">
        <h2 style="margin:0">Мої угоди</h2>
        <div class="row">
          <button id="addBtn" class="primary">＋ Додати угоду</button>
          <button id="trBtn">Імпорт CSV</button>
          <input type="file" id="trInput" accept=".csv,text/csv">
        </div>
      </div>
      <div class="addform" id="addForm">
        <input id="afPair" placeholder="Актив, напр. EUR/JPY" aria-label="Актив">
        <select id="afDir" aria-label="Напрям"><option value="long">Вгору</option><option value="short">Вниз</option></select>
        <input id="afAmt" type="number" min="1" step="1" placeholder="Сума, $" aria-label="Сума">
        <select id="afRes" aria-label="Результат"><option value="pending">Очікує</option><option value="win">Виграш</option><option value="loss">Програш</option></select>
        <button id="afSave" class="primary">Зберегти</button>
      </div>
      <div class="stats">
        <div class="stat"><b id="trN">—</b><span>Угод</span></div>
        <div class="stat"><b id="trWin">—</b><span>Виграшних</span></div>
        <div class="stat"><b id="trPnl">—</b><span>Результат</span></div>
      </div>
      <div class="log" id="jList" style="margin-top:12px"></div>
    </section>
    <section class="panel">
      <h2>Розбір від ботів</h2>
      <ul class="reasons" id="trInsights"><li>Додай угоди або імпортуй історію, щоб побачити розбір</li></ul>
    </section>
    <section class="panel">
      <h2>По активах</h2>
      <div class="table-wrap"><table>
        <thead><tr><th>Актив</th><th>Угод</th><th>Виграш</th><th>Результат</th></tr></thead>
        <tbody id="trPairs"><tr><td colspan="4" style="color:var(--muted)">Немає даних</td></tr></tbody>
      </table></div>
    </section>
    <section class="panel full status">
      <h2>Підключення</h2>
      <div><span>Стратегії команди</span><span id="stCode">Немає</span></div>
      <div><span>ШІ-команда (Claude)</span><span id="stPhoto">Перевіряю…</span></div>
      <div><span>Історія угод</span><span id="stTrades">Порожньо</span></div>
      <div><span>Котирування</span><span>Демо-потік або CSV</span></div>
      <div><span>Серверний бот</span><span>Команда пише для нього код у мозку, застосовуєш ти</span></div>
    </section>
  </div></div>

  <!-- НАЛАШТУВАННЯ -->
  <div class="view" id="v-config"><div class="set-wrap">
    <h1 class="set-h">Налаштування</h1>
    <div class="set-gt">Дані otcharts (OTC-котирування)</div><div class="set-g">
      <div class="set-row"><span>Ключ otcharts <small class="note" style="margin:0">(зберігається лише на цьому пристрої)</small></span></div>

const HEAD_FIXED=`<meta charset="utf-8">

/* ===================== ЯДРО ===================== */
const ANALYZERS=[];
function registerAnalyzer(a){const i=ANALYZERS.findIndex(x=>x.id===a.id);if(i>=0)ANALYZERS[i]=a;else ANALYZERS.push(a)}
const ind={
  ema(v,p){const k=2/(p+1),o=[];let pr;v.forEach((x,i)=>{pr=i?x*k+pr*(1-k):x;o.push(pr)});return o},
  sma(v,p){return v.map((_,i)=>i<p-1?null:v.slice(i-p+1,i+1).reduce((a,b)=>a+b,0)/p)},
  std(v,p){return v.map((_,i)=>{if(i<p-1)return null;const s=v.slice(i-p+1,i+1),m=s.reduce((a,b)=>a+b,0)/p;return Math.sqrt(s.reduce((a,b)=>a+(b-m)**2,0)/p)})},
  rsi(v,p=14){const o=Array(v.length).fill(null);let g=0,l=0;for(let i=1;i<v.length;i++){const d=v[i]-v[i-1],u=Math.max(d,0),n=Math.max(-d,0);if(i<=p){g+=u;l+=n;if(i===p){g/=p;l/=p;o[i]=100-100/(1+g/(l||1e-9))}}else{g=(g*(p-1)+u)/p;l=(l*(p-1)+n)/p;o[i]=100-100/(1+g/(l||1e-9))}}return o}
};
/* Знімок ринку — перенесено з rules.mjs (snapshot) */
function snapshot(a){
  a=a.slice(-400);const c=a.map(x=>x.c),n=a.length;if(n<20)return null;
  const e50=ind.ema(c,50),slope=Math.sign(e50[n-1]-e50[Math.max(0,n-11)]);
  const tr=a.map(x=>x.h-x.l),last20=tr.slice(-21,-1),avg=last20.reduce((s,x)=>s+x,0)/Math.max(1,last20.length);
  const sorted=tr.slice().sort((x,y)=>x-y),rank=sorted.filter(x=>x<=tr[n-1]).length/sorted.length;
  const vol=rank<.33?'low':rank>.67?'high':'mid',spike=avg>0&&tr[n-1]>3*avg?1:0;
  let st=0;for(let i=n-1;i>=Math.max(0,n-20);i--){const d=Math.sign(a[i].c-a[i].o);if(!d)break;if(!st)st=d;else if(d!==Math.sign(st))break;else st+=d}
  const w=a.slice(-60),hi=Math.max(...w.map(x=>x.h)),lo=Math.min(...w.map(x=>x.l));
  const pos=hi>lo?(c[n-1]-lo)/(hi-lo):.5,posB=pos>.8?'high':pos<.2?'low':'mid';
  return{trend:slope,vol,spike,streak:st,pos:+pos.toFixed(3),posB,price:c[n-1]};
}

/* ============ ВБУДОВАНІ СТРАТЕГІЇ ============ */
registerAnalyzer({id:'ema-rsi',name:'EMA 9/21 + RSI',analyze(c){
  const cl=c.map(x=>x.c);if(cl.length<30)return{direction:'flat',score:0,reasons:['Мало даних']};
  const f=ind.ema(cl,9),s=ind.ema(cl,21),r=ind.rsi(cl),i=cl.length-1,rsi=r[i],gap=(f[i]-s[i])/cl[i]*1e4;
  let d='flat',sc=Math.min(100,Math.round(Math.abs(gap)*8+Math.abs(rsi-50)));const rs=[];
  if(f[i]>s[i]&&rsi<70){d='long';rs.push('EMA 9 вище EMA 21')}else if(f[i]<s[i]&&rsi>30){d='short';rs.push('EMA 9 нижче EMA 21')}else rs.push('RSI у крайній зоні');
  rs.push('RSI '+rsi.toFixed(1));if(d==='flat')sc=Math.min(sc,30);
  return{direction:d,score:sc,reasons:rs,lines:[{values:f,color:'#7b5cff'},{values:s,color:'#ff5ca8'}]};
}});
registerAnalyzer({id:'momentum',name:'Імпульс 3 свічки',analyze(c){
  if(c.length<5)return{direction:'flat',score:0};const l=c.slice(-3);
  if(l.every(x=>x.c>x.o))return{direction:'long',score:60,reasons:['Три зелені свічки поспіль']};
  if(l.every(x=>x.c<x.o))return{direction:'short',score:60,reasons:['Три червоні свічки поспіль']};
  return{direction:'flat',score:15,reasons:['Немає імпульсу']};
}});
registerAnalyzer({id:'range-pos',name:'Позиція в діапазоні (твої дані)',analyze(c){
  const s=snapshot(c);if(!s)return{direction:'flat',score:0,reasons:['Мало даних']};
  const p=`позиція ${(s.pos*100).toFixed(0)}% діапазону 60 свічок`;
  if(s.posB==='low')return{direction:'short',score:70,reasons:['Ціна внизу діапазону',p]};
  if(s.posB==='high')return{direction:'long',score:52,reasons:['Ціна вгорі діапазону',p]};
  return{direction:'flat',score:20,reasons:['Ціна посередині діапазону',p]};
}});
registerAnalyzer({id:'bollinger',name:'Відскок від Боллінджера',analyze(c){
  const cl=c.map(x=>x.c);if(cl.length<25)return{direction:'flat',score:0};
  const m=ind.sma(cl,20),sd=ind.std(cl,20),i=cl.length-1,up=m.map((x,k)=>x==null?null:x+2*sd[k]),dn=m.map((x,k)=>x==null?null:x-2*sd[k]);
  const lines=[{values:up,color:'#8a90ad'},{values:dn,color:'#8a90ad'}];
  if(cl[i]>up[i])return{direction:'short',score:65,reasons:['Ціна вище верхньої смуги'],lines};
  if(cl[i]<dn[i])return{direction:'long',score:65,reasons:['Ціна нижче нижньої смуги'],lines};
  return{direction:'flat',score:10,reasons:['Ціна всередині каналу'],lines};
}});
registerAnalyzer({id:'rsi-rev',name:'RSI розворот',analyze(c){
  const cl=c.map(x=>x.c);if(cl.length<20)return{direction:'flat',score:0};
  const r=ind.rsi(cl,7),i=cl.length-1;
  if(r[i]>75)return{direction:'short',score:Math.round(r[i]-10),reasons:['RSI(7) '+r[i].toFixed(1)+': перекупленість']};
  if(r[i]<25)return{direction:'long',score:Math.round(90-r[i]),reasons:['RSI(7) '+r[i].toFixed(1)+': перепроданість']};
  return{direction:'flat',score:10,reasons:['RSI(7) '+r[i].toFixed(1)+': нейтрально']};
}});
registerAnalyzer({id:'confluence',name:'Збіг ознак (KIRA)',analyze(c){
  const cl=c.map(x=>x.c);if(cl.length<55)return{direction:'flat',score:0,reasons:['Мало даних']};
  const s=snapshot(c),e20=ind.ema(cl,20),r=ind.rsi(cl),i=cl.length-1,l=c[i];
  const up=[],dn=[];
  if(s.trend>0)up.push('тренд EMA50 вгору');if(s.trend<0)dn.push('тренд EMA50 вниз');
  if(cl[i]>e20[i])up.push('ціна над EMA20');else dn.push('ціна під EMA20');
  if(r[i]>52&&r[i]<70)up.push('RSI '+r[i].toFixed(0));if(r[i]<48&&r[i]>30)dn.push('RSI '+r[i].toFixed(0));
  if(l.c>l.o)up.push('остання свічка зелена');else if(l.c<l.o)dn.push('остання свічка червона');
  if(s.posB==='low')dn.push('ціна внизу діапазону (твоя історія: low+DOWN)');if(s.posB==='high')up.push('ціна вгорі діапазону');
  const block=[];if(s.posB==='mid')block.push('ціна посередині діапазону');if(s.spike)block.push('щойно був сплеск');if(s.vol==='low')block.push('ринок майже стоїть');
  const best=up.length>dn.length?['long',up]:dn.length>up.length?['short',dn]:['flat',[]];
  if(best[1].length<3||block.length)return{direction:'flat',score:15,reasons:[block.length?'Пропуск: '+block.join(', '):'Замало збігів: '+Math.max(up.length,dn.length)+' з 3']};
  return{direction:best[0],score:Math.min(95,40+best[1].length*11),reasons:['Збіг '+best[1].length+' ознак: '+best[1].join(', ')]};
}});
registerAnalyzer({id:'pullback',name:'Відкат по тренду (LYNX)',analyze(c){
  const cl=c.map(x=>x.c);if(cl.length<40)return{direction:'flat',score:0,reasons:['Мало даних']};
  const e21=ind.ema(cl,21),i=cl.length-1,sl=e21[i]-e21[i-8],l=c[i],p=c[i-1],s=snapshot(c);

  const touched=k=>c[k].l<=e21[k]&&c[k].h>=e21[k];
  if(sl>0&&(touched(i-1)||touched(i-2))&&l.c>l.o&&l.c>p.h*0.9999)return{direction:'long',score:66,reasons:['Висхідний тренд, відкат до EMA21 і відновлення']};
  if(sl<0&&(touched(i-1)||touched(i-2))&&l.c<l.o&&l.c<p.l*1.0001)return{direction:'short',score:66,reasons:['Низхідний тренд, відкат до EMA21 і відновлення']};
  return{direction:'flat',score:12,reasons:['Немає відкату з підтвердженням']};
}});

button.primary::after{display:none!important}
.logo{background:var(--term)!important;color:var(--bg)!important;border-radius:2px!important;animation:none!important}
.brand>div::after{content:"_";color:var(--term);animation:cur 1s steps(1) infinite;margin-left:2px}

.verdict{text-shadow:0 0 14px var(--glow)}
.bot,.rb,.stat{background:var(--panel2)!important;box-shadow:none!important}

.msg .bub{background:var(--panel2)!important}
.msg.me .bub{background:var(--term)!important;color:var(--bg)!important}
.bar i,.conf i{background:var(--term)!important}

::-webkit-scrollbar-thumb{background:var(--line)!important}`;
function skinCSS(id){
  const s=SKINS[id]||SKINS.orig;if(id==='terminal')return TERM_CSS;
  const mix=(c,p,b)=>`color-mix(in srgb,${c} ${p}%,${b})`;
  const dark=`--bg:${s.bg};--panel:${mix(s.p2,82,'transparent')};--panel2:${s.p2};--line:${s.ln};--text:#e9ebf8;--muted:#8a90b3;--orb1:${mix(s.a1,32,'transparent')};--orb2:${mix(s.a2,22,'transparent')};color-scheme:dark`;
  return `:root{--ring1:${s.a1};--ring2:${s.a2};--on-acc:${s.on||'#fff'};--bg:${mix(s.a1,7,'#f2f3f8')};--panel2:${mix(s.a1,5,'#f4f5fb')};--orb1:${mix(s.a1,26,'transparent')};--orb2:${mix(s.a2,20,'transparent')}}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){${dark}}}
:root[data-theme="dark"]{${dark}}`;
}
function applySkin(id){
  let el=document.getElementById('skin-css');if(!el){el=document.createElement('style');el.id='skin-css';document.head.appendChild(el)}
  el.textContent=skinCSS(SKINS[id]?id:'orig');
  document.querySelectorAll('.skin').forEach(b=>b.classList.toggle('on',b.dataset.skin===id));
  requestAnimationFrame(()=>{try{drawCandles();drawBal()}catch(e){}});
}
function renderSkins(){
  const g=document.getElementById('skinGrid');if(!g)return;
  g.innerHTML=Object.entries(SKINS).filter(([id,s])=>!s.secret||cfg.eggGold).map(([id,s])=>`<button class="skin${(cfg.skin||'orig')===id?' on':''}" data-skin="${id}"><span class="pv" style="background:${s.bg}"><i style="width:60px;height:60px;left:-10px;top:-14px;background:${s.a1};opacity:.55"></i><i style="width:50px;height:50px;right:-8px;bottom:-16px;background:${s.a2};opacity:.45"></i><b style="background:${s.p2}"></b><u style="background:${id==='terminal'?s.a1:`linear-gradient(135deg,${s.a1},${s.a2})`}"></u></span><span class="nm">${s.n}</span></button>`).join('');
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-skin]');if(!b)return;cfg.skin=b.dataset.skin;saveCfg();applySkin(cfg.skin);toast('Тема: '+SKINS[cfg.skin].n)});
applySkin(cfg.skin||'orig');

function wilson(k,n){if(!n)return[0,0];const z=1.96,p=k/n,c=(p+z*z/2/n)/(1+z*z/n),h=z*Math.sqrt(p*(1-p)/n+z*z/4/n/n)/(1+z*z/n);return[(c-h)*100,(c+h)*100]}
function countTo(el,to,f=v=>Math.round(v)){
  const from=parseFloat(el.dataset.v||0);el.dataset.v=to;
  if(RM||!Number.isFinite(from)){el.textContent=f(to);return}
  const t0=performance.now(),d=600;cancelAnimationFrame(el._raf);
  const step=t=>{const k=Math.min(1,(t-t0)/d),e=1-Math.pow(1-k,3);el.textContent=f(from+(to-from)*e);if(k<1)el._raf=requestAnimationFrame(step)};
  el._raf=requestAnimationFrame(step);
}
function popClass(el,c){el.classList.remove(c);void el.offsetWidth;el.classList.add(c)}
let toastT;function toast(t){const el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),3200)}

function genDemo(n=300){price=150;candles=[];const tf=cfg.tf*60000,st=Date.now()-n*tf;for(let i=0;i<n;i++)candles.push(demoCandle(st+i*tf))}

const analyzerSel=$('analyzerSel');

let lastLines=[],lastDir=null;
function runSignal(){
  const r=safe(byId(analyzerSel.value),candles.slice()),d=r.direction,sc=Math.max(0,Math.min(100,Math.round(r.score)));
  const v=$('verdict');v.className='verdict '+d;v.textContent=d==='long'?'Заходити в лонг':d==='short'?'Заходити в шорт':'Чекати';
  if(d!==lastDir){popClass(v,'pop');lastDir=d;$('reasons').innerHTML=(r.reasons||[]).map(x=>'<li>'+esc(x)+'</li>').join('')||'<li>Без пояснень</li>'}
  else [...$('reasons').children].forEach((li,i)=>{if(r.reasons&&r.reasons[i]!=null)li.textContent=r.reasons[i]});
  countTo($('scoreVal'),sc);$('ringArc').style.strokeDashoffset=339.3*(1-sc/100);

/* ===================== БЕКТЕСТ ===================== */
function backtest(a){
  const h=cfg.expiry;let hits=0,n=0,pnl=0;
  for(let i=40;i<candles.length-h;i++){
    const r=safe(a,candles.slice(0,i+1));if(r.direction==='flat')continue;
    const ch=candles[i+h].c-candles[i].c;if(!ch)continue;
    const w=(r.direction==='long'&&ch>0)||(r.direction==='short'&&ch<0);n++;
    if(w){hits++;pnl+=cfg.stake*cfg.payout/100}else pnl-=cfg.stake;
  }
  return{n,rate:n?hits/n*100:0,pnl};
}
function runBt(){
  const r=backtest(byId(analyzerSel.value)),be=breakeven();
  if(r.n){countTo($('btHit'),r.rate,v=>v.toFixed(1)+'%');countTo($('btN'),r.n);countTo($('btPnl'),r.pnl,fmt)}else{$('btHit').textContent='—';$('btN').textContent='0';$('btPnl').textContent='—'}
  $('btPnl').style.color=r.pnl>=0?'var(--up)':'var(--down)';$('btBar').style.width=r.rate+'%';
  $('btNote').textContent=!r.n?'Стратегія не дала сигналів.':r.rate>be?`Вище порогу ${be.toFixed(1)}% на цих даних. Перевір на інших, перш ніж довіряти.`:`Нижче порогу ${be.toFixed(1)}%: на дистанції стратегія в мінусі.`;
}
function runCompare(){
  const be=breakeven(),rows=ANALYZERS.map(a=>({a,...backtest(a)})).sort((x,y)=>y.pnl-x.pnl);
  $('cmpBody').innerHTML=rows.map((r,i)=>`<tr style="animation-delay:${i*.06}s"><td>${esc(r.a.name)}</td><td>${r.n?r.rate.toFixed(1)+'%':'—'}</td><td>${r.n}</td><td class="${r.pnl>=0?'long':'short'}">${r.n?fmt(r.pnl):'—'}</td><td>${!r.n?'Без сигналів':r.rate>be?'Вище порогу':'Збиткова'}</td></tr>`).join('');
  $('cmpNote').textContent=`Поріг беззбитковості при виплаті ${cfg.payout}%: ${be.toFixed(1)}%. Перевіряй на кількох наборах даних: одна вдала вибірка ще нічого не доводить.`;
}

function stepBots(){

    if(s.on&&s.open.length===0&&s.bal>=cfg.stake){const r=safe(byId(b.an),candles.slice());if(r.direction!=='flat')s.open.push({dir:r.direction,entry:last.c,exp:i+cfg.expiry})}

function drawBal(){
  const cv=$('balChart');if(!cv.clientWidth)return;const{g,W,H}=prepCanvas(cv);

    g.fillStyle=BCOL[k];g.beginPath();g.arc(Math.min(lx,W-4),lyy,3,0,7);g.fill();g.font='600 11px Onest,sans-serif';g.fillText(BOTS[k].name,6+k*50,H-2)});
}

function parseTrades(txt){
  const lines=txt.replace(/^\uFEFF/,'').trim().split(/\r?\n/);if(lines.length<2){alert('У файлі немає угод.');return}
  const dl=[';','\t',','].find(d=>lines[0].includes(d))||',';
  const clean=s=>s.trim().replace(/^"|"$/g,'');
  const head=lines[0].split(dl).map(clean),find=re=>head.findIndex(h=>re.test(h));
  const ix={t:find(/time|date|час|дата/i),p:find(/asset|pair|symbol|актив|пара|інструмент|инструмент/i),d:find(/^dir|direction|side|type|напрям|направ|тип/i),a:find(/amount|stake|sum|invest|сума|сумма|ставка/i),r:find(/profit|result|pnl|прибут|прибыл|результат/i)};
  if(ix.r<0){alert('Не знайшов колонку з результатом угоди (profit, result або прибуток). Перевір заголовки CSV.');return}
  const used=new Set(Object.values(ix));
  const num=s=>parseFloat(String(s||'').replace('−','-').replace(/[^\d.,-]/g,'').replace(',','.'));
  imported=lines.slice(1).map(l=>l.split(dl).map(clean)).map(c=>{
    const raw=c[ix.r]||'',amt=ix.a>=0?num(c[ix.a]):NaN,st=Number.isFinite(amt)?amt:cfg.stake;let pr=num(raw);
    if(!Number.isFinite(pr)){if(/^\s*w\s*$|win|виграш|выигр/i.test(raw))pr=st*cfg.payout/100;else if(/^\s*l\s*$|los|програш|проигр/i.test(raw))pr=-st}
    const ds=ix.d>=0?c[ix.d]||'':'',x={};head.forEach((h,i)=>{if(!used.has(i)&&c[i]!==undefined&&c[i]!=='')x[h]=c[i]});
    return{t:ix.t>=0?Date.parse(String(c[ix.t]).replace(' ','T')):NaN,pair:ix.p>=0?(c[ix.p]||'—'):'—',dir:/buy|call|up|вгор|вверх|long|купи|выш/i.test(ds)?'long':/sell|put|down|вниз|short|прода|ниж/i.test(ds)?'short':'—',amt:st,pr,x,src:'import'};
  }).filter(x=>Number.isFinite(x.pr));
  if(!imported.length){alert('Не вдалося прочитати жодної угоди.');return}
  renderTrades();updStatus();toast('Імпортовано угод: '+imported.length);
}
function grpBy(tr,key){const m={};tr.forEach(x=>{const k=key(x);if(k==null||k==='')return;(m[k]=m[k]||{n:0,w:0,p:0});m[k].n++;if(x.pr>0)m[k].w++;m[k].p+=x.pr});return m}
function extraKeys(tr){const ks={};tr.forEach(x=>x.x&&Object.entries(x.x).forEach(([k,v])=>{(ks[k]=ks[k]||new Set).add(v)}));return Object.entries(ks).filter(([,s])=>s.size>1&&s.size<=8).map(([k])=>k)}
function sortedTrades(){const tr=allTrades().slice();if(tr.every(x=>Number.isFinite(x.t)))tr.sort((a,b)=>a.t-b.t);return tr}
function renderTrades(){
  const tr=sortedTrades(),n=tr.length;
  if(!n){$('trN').textContent='0';$('trWin').textContent='—';$('trPnl').textContent='—';$('trPairs').innerHTML='<tr><td colspan="4" style="color:var(--muted)">Немає даних</td></tr>';$('trInsights').innerHTML='<li>Додай угоди або імпортуй історію, щоб побачити розбір</li>';return}
  const w=tr.filter(x=>x.pr>0).length,pnl=tr.reduce((a,x)=>a+x.pr,0),rate=w/n*100,be=breakeven(),[lo]=wilson(w,n);
  countTo($('trN'),n);countTo($('trWin'),rate,v=>v.toFixed(1)+'%');countTo($('trPnl'),pnl,fmt);$('trPnl').style.color=pnl>=0?'var(--up)':'var(--down)';
  const pairs=Object.entries(grpBy(tr,x=>x.pair)).sort((a,b)=>b[1].p-a[1].p);
  $('trPairs').innerHTML=pairs.map(([k,v],i)=>`<tr style="animation-delay:${i*.05}s"><td>${esc(k)}</td><td>${v.n}</td><td>${(v.w/v.n*100).toFixed(0)}%</td><td class="${v.p>=0?'long':'short'}">${fmt(v.p)}</td></tr>`).join('');
  const ins=[];
  ins.push(`<b>MIRA:</b> ${w}/${n} = ${rate.toFixed(1)}%, нижня межа Wilson ${lo.toFixed(0)}% при беззбитку ${be.toFixed(1)}% — ${lo>be?'перевага підтверджена статистично.':'перевага поки не доведена, потрібно більше угод.'}`);
  const dirs=grpBy(tr,x=>x.dir==='—'?null:x.dir);
  if(dirs.long&&dirs.short)ins.push(`<b>NOVA:</b> вгору ${dirs.long.w}/${dirs.long.n} (${(dirs.long.w/dirs.long.n*100).toFixed(0)}%), вниз ${dirs.short.w}/${dirs.short.n} (${(dirs.short.w/dirs.short.n*100).toFixed(0)}%).`);
  extraKeys(tr).slice(0,3).forEach(k=>{const g=Object.entries(grpBy(tr,x=>x.x?.[k])).filter(([,v])=>v.n>=5).sort((a,b)=>b[1].w/b[1].n-a[1].w/a[1].n);if(g.length>=2)ins.push(`<b>ZETA:</b> за «${esc(k)}» найкраще ${esc(g[0][0])} (${g[0][1].w}/${g[0][1].n}), найгірше ${esc(g.at(-1)[0])} (${g.at(-1)[1].w}/${g.at(-1)[1].n}).`)});
  let after=0,raised=0,streak=0,maxS=0;
  tr.forEach((x,i)=>{if(x.pr<0){streak++;maxS=Math.max(maxS,streak)}else streak=0;if(i&&tr[i-1].pr<0){after++;if(+x.amt>+tr[i-1].amt)raised++}});
  if(after>=3){const pct=raised/after*100;ins.push(`<b>VEGA:</b> після програшу ставка зростає в ${pct.toFixed(0)}% випадків. ${pct>30?'Схоже на спроби відігратися.':'Ставку після програшів тримаєш рівно, це добре.'}`)}
  ins.push(`<b>ORIN:</b> найдовша серія програшів — ${maxS} поспіль (${fmt(-maxS*cfg.stake)} при ставці $${cfg.stake}).`);
  ['photo','bots'].forEach(s=>{const a=tr.filter(x=>x.src===s);if(a.length)ins.push(`<b>${s==='photo'?'📸 Фото + команда':'🤖 Аналіз ботів'}:</b> ${a.filter(x=>x.pr>0).length}/${a.length} виграшних.`)});
  $('trInsights').innerHTML=ins.map(x=>'<li>'+x+'</li>').join('');
}
function statsText(){
  const tr=sortedTrades(),n=tr.length;if(!n)return'Угод ще немає.';
  const w=tr.filter(x=>x.pr>0).length,[lo,hi]=wilson(w,n),pnl=tr.reduce((a,x)=>a+x.pr,0);
  const line=(title,m)=>{const e=Object.entries(m).filter(([,v])=>v.n>=2);return e.length?`${title}: `+e.map(([k,v])=>`${k} ${v.w}/${v.n}`).join('; '):''};
  const out=[`Усього ${n}, виграшних ${w} (${(w/n*100).toFixed(1)}%, Wilson 95%: ${lo.toFixed(0)}–${hi.toFixed(0)}%), беззбиток ${breakeven().toFixed(1)}%, результат ${fmt(pnl)}.`,
    line('Пари',grpBy(tr,x=>x.pair)),line('Напрям',grpBy(tr,x=>x.dir)),line('Джерело',grpBy(tr,x=>x.src))];
  extraKeys(tr).forEach(k=>out.push(line(k,grpBy(tr,x=>x.x?.[k]))));
  const losses=tr.filter(x=>x.pr<0).slice(-8).map(x=>`${Number.isFinite(x.t)?new Date(x.t).toLocaleString('uk-UA',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):''} ${x.pair} ${x.dir==='long'?'UP':'DOWN'}${x.reason?' — причина: '+String(x.reason).slice(0,100):''}`);
  if(losses.length)out.push('Останні мінуси: '+losses.join(' | '));
  const wins=tr.filter(x=>x.pr>0&&x.reason).slice(-6).map(x=>`${x.pair} ${x.dir==='long'?'UP':'DOWN'} — ${String(x.reason).slice(0,100)}`);
  if(wins.length)out.push('Останні плюси з причинами входу (відштовхуйтесь від того, що спрацювало): '+wins.join(' | '));

function chanceFor(s){

  }

    const o=(T*.6)%1;for(let k=0;k<14;k++){const p=Math.pow((k+o)/14,2.2),yy=hz+(H-hz)*p;g.globalAlpha=.08+.25*p;g.beginPath();g.moveTo(0,yy);g.lineTo(W,yy);g.stroke()}

};

/* ремонт відповіді, якщо формат зламався */
function fixStrings(s){let o='',q=false,esc=false;for(const ch of s){if(q){if(esc){esc=false;o+=ch;continue}if(ch==='\\'){esc=true;o+=ch;continue}if(ch==='"'){q=false;o+=ch;continue}if(ch==='\n'){o+='\\n';continue}if(ch==='\r')continue;if(ch==='\t'){o+='\\t';continue}o+=ch}else{if(ch==='"')q=true;o+=ch}}return o}
function repairJSON(t){
  if(!t)return null;let s=String(t);const a=s.indexOf('{');if(a<0)return null;const b=s.lastIndexOf('}');s=s.slice(a,b>a?b+1:undefined);
  const tries=[s,fixStrings(s),fixStrings(s.replace(/[“”]/g,'"'))];
  for(const x of tries){try{const r=JSON.parse(x);if(r&&typeof r==='object')return r}catch(_){}}
  for(const tail of ['"}]}','"}],"actions":[]}',']}','}','"}']){try{const r=JSON.parse(fixStrings(s)+tail);if(r&&typeof r==='object'){r._partial=true;return r}}catch(_){}}
  const msgs=[],re=/"from"\s*:\s*"([A-Z]+)"[\s\S]*?"text"\s*:\s*"((?:[^"\\]|\\.)*)/g;let m;while((m=re.exec(s)))msgs.push({from:m[1],to:'ВЛАСНИК',text:m[2].replace(/\\n/g,'\n').replace(/\\"/g,'"')});
  return msgs.length?{messages:msgs,actions:[],signal:null,_partial:true}:null;
}


/* ===================== otcharts: реальні OTC-свічки (окремий сайт) ===================== */
const NO_DATA='🔴 НЕМАЄ ПІДКЛЮЧЕННЯ ДО РЕАЛЬНИХ OTC-ДАНИХ';
const SRC_NOTE='Ціни otcharts OTC, можуть трохи відрізнятися від Pocket Option';
const OTC={base:'https://otcharts.com/v1',shift:7200,cacheMs:4500,cache:{},usage:null,err:null,timer:null};
let otcOk=false;
const otcKey=()=>{try{return localStorage.getItem('otcKey')||''}catch(_){return''}};
const symOf=p=>String(p||'EUR/USD').replace(/\s*OTC$/i,'').replace(/\W/g,'').toUpperCase()+'_otc';
async function otcGet(path){
  const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),8000);
  try{const r=await fetch(OTC.base+path,{headers:{Authorization:'Bearer '+otcKey(),Accept:'application/json'},signal:ctl.signal});
    if(!r.ok){const e=new Error('HTTP '+r.status);e.status=r.status;throw e}return await r.json()}
  finally{clearTimeout(tm)}
}
const otcWhy=e=>e.status===401||e.status===403?'ключ не прийнято':e.status===429?'перевищено ліміт запитів':e.status?'помилка otcharts '+e.status:'немає зʼєднання (мережа або браузер заблокував запит)';
async function otcUsage(){
  if(!otcKey()){$('otcUsage').textContent='Немає ключа';return null}
  try{const j=await otcGet('/usage'),q=j.requests||j;const rem=Number(q.remaining),lim=Number(q.limit??q.total??q.max);
    OTC.usage={rem,lim,plan:j.plan||j.tier||''};renderUsage();return OTC.usage}
  catch(e){$('otcUsage').textContent='Ліміт: '+otcWhy(e);return null}
}
function renderUsage(){const u=OTC.usage;if(!u)return;$('otcUsage').textContent=`${u.plan?u.plan+': ':''}залишилось ${Number.isFinite(u.rem)?u.rem:'?'}${Number.isFinite(u.lim)?' із '+u.lim:''} запитів`}
async function otcCandles(sym){
  const hit=OTC.cache[sym];if(hit&&Date.now()-hit.at<OTC.cacheMs)return hit.r;
  let r;
  try{
    if(OTC.usage&&Number.isFinite(OTC.usage.rem)&&OTC.usage.rem<=20){r={ok:false,why:'ліміт запитів otcharts майже вичерпано'}}
    else{
      const j=await otcGet('/candles?'+new URLSearchParams({venue:'otc',symbol:sym,tf:'5',limit:'500'})),now=Date.now()/1000;
      let c=(Array.isArray(j.candles)?j.candles:[]).map(x=>({t:Number(x.time)-OTC.shift,o:Number(x.open),h:Number(x.high),l:Number(x.low),c:Number(x.close),v:Number(x.volume||0)}))
        .filter(x=>[x.t,x.o,x.h,x.l,x.c].every(Number.isFinite)).sort((a,b)=>a.t-b.t).filter((x,i,a)=>!i||x.t!==a[i-1].t);
      while(c.length&&c[c.length-1].t+5>now)c.pop();
      const age=c.length?now-(c[c.length-1].t+5):Infinity;
      if(OTC.usage&&Number.isFinite(OTC.usage.rem)){OTC.usage.rem--;renderUsage()}
      r=c.length<60?{ok:false,why:'замало закритих свічок'}:age>60?{ok:false,why:`дані застарілі (${Math.round(age)} с)`}:{ok:true,c,age:Math.max(0,Math.round(age))};
    }
  }catch(e){r={ok:false,why:otcWhy(e)}}
  OTC.cache[sym]={at:Date.now(),r};return r;
}
function showOtc(){
  const st=$('otcStatus');if(!st)return;
  if(cfg.dataSrc!=='otc'){st.className='note';st.textContent=cfg.dataSrc==='demo'?'Джерело: демо-генератор (не реальний ринок)':'Джерело ще не обрано';return}
  st.className='note '+(otcOk?'ok':'bad');
  st.textContent=otcOk?`✅ Дані otcharts йдуть: ${cfg.pair||'EUR/USD OTC'} (${symOf(cfg.pair)})`:`${NO_DATA}: ${OTC.err||'чекаю дані'}`;
  $('liveDot').classList.toggle('on',otcOk);$('liveTxt').textContent=otcOk?'otcharts: дані йдуть':'otcharts: немає даних';
  $('liveBtn').textContent=OTC.timer?'Зупинити otcharts':'Запустити otcharts';
}
async function otcTick(){
  if(cfg.dataSrc!=='otc')return;
  if(!otcKey()){otcOk=false;OTC.err='немає ключа';showOtc();return}
  const r=await otcCandles(symOf(cfg.pair));
  if(!r.ok){otcOk=false;OTC.err=r.why;showOtc();updateDealInfo();return}
  const k=Math.max(1,Math.round(cfg.tf*60/5)),base=r.c.map(x=>({...x,t:x.t*1000})),cs=k>1?resample(base,k):base;
  if(cs.length<30){otcOk=false;OTC.err='otcharts дає 500 свічок по 5 с (≈40 хв), для цього таймфрейму замало — обери 5 с, 15 с або M1';showOtc();updateDealInfo();return}
  const prevT=source==='otc'&&candles.length?candles[candles.length-1].t:0;
  candles=cs;source='otc';otcOk=true;OTC.err=null;
  $('srcPill').textContent='otcharts';$('pairPill').textContent=cfg.pair||'EUR/USD OTC';
  runSignal();if(prevT&&cs[cs.length-1].t>prevT)stepBots();showOtc();updateDealInfo();
}
function otcStart(){if(!cfg.pair){cfg.pair='EUR/USD OTC';saveCfg();$('dealPair').value=cfg.pair;try{renderPairs()}catch(_){}}if(OTC.timer)return;if(live)stopLive();OTC.timer=setInterval(()=>{if(!document.hidden)otcTick()},5000);otcTick();showOtc()}

  $('otcStatus').textContent=r.ok?`✅ Ключ працює, свічки ${symOf(cfg.pair)} надходять (остання ${r.age} с тому)`:`${NO_DATA}: ${r.why}`;
  if(r.ok){cfg.dataSrc='otc';if(cfg.tf>1){cfg.tf=0.0833;cfgChanged('tf');try{renderTf()}catch(_){}}saveCfg();otcStart();toast('✅ otcharts підключено — сигнали на реальних OTC-свічках')}

$('otcUse').onclick=()=>{$('otcKey').dispatchEvent(new Event('change'));if(!otcKey()){toast('Спершу встав ключ');return}cfg.dataSrc='otc';if(cfg.tf>1){cfg.tf=0.0833;cfgChanged('tf');renderUX&&renderUX();try{renderTf()}catch(_){}}saveCfg();otcStart();otcUsage();toast('Свічки беруться з otcharts (таймфрейм 5 с)')};
$('otcDemo').onclick=()=>{cfg.dataSrc='demo';saveCfg();otcStop();otcOk=false;source='demo';genDemo();runSignal();$('srcPill').textContent='Демо-дані';$('pairPill').textContent='DEMO/USD';updateDealInfo();showOtc();toast('Увімкнено демо: це не реальний ринок')};
$('otcForget').onclick=()=>{if(!confirm('Видалити ключ otcharts з цього пристрою?'))return;try{localStorage.removeItem('otcKey')}catch(_){}$('otcKey').value='';otcStop();cfg.dataSrc='demo';saveCfg();OTC.usage=null;$('otcUsage').textContent='Немає ключа';showOtc();toast('Ключ видалено')};
/* перемикання пари й таймфрейму одразу оновлює свічки */
document.addEventListener('click',e=>{if(cfg.dataSrc==='otc'&&e.target.closest('#pairGrid button,#tfBar button,[data-tfs]'))setTimeout(()=>{OTC.cache={};otcTick()},50)});
