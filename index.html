<script id="safe">(function(){var t0=Date.now();
function show(msg){if(document.getElementById('safebar'))return;var b=document.createElement('div');b.id='safebar';
b.style.cssText='position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:99;background:#2a0f17;color:#fff;border:1px solid #ff5c7a;border-radius:12px;padding:12px;font:14px system-ui,sans-serif';
b.innerHTML='Сторінка зламалась після зміни: '+String(msg||'').slice(0,140).replace(/[<&]/g,'')+' <button id="safeback" style="margin-left:8px;padding:6px 12px;border-radius:8px;border:0;background:#ff5c7a;color:#fff;font-weight:600">Відкотити</button>';
(document.body||document.documentElement).appendChild(b);
document.getElementById('safeback').onclick=async function(){try{var bk=JSON.parse(localStorage.getItem('sd-backups')||'[]')[0];if(!bk){alert('Немає резервної копії');return}var a=window.claude&&await window.claude.use('artifact');if(!a){alert('Відкат працює, коли сторінку відкрито в Claude');return}await a.publish(bk.html)}catch(e){alert('Не вдалося: '+(e&&e.message))}};}

window.__safeShow=show;})();</script>

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums;line-height:1.45;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
.orbs{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.orbs i{position:absolute;width:55vmax;height:55vmax;border-radius:50%;filter:blur(70px)}
.orbs i:nth-child(1){background:var(--orb1);top:-20vmax;left:-15vmax;animation:drift1 22s ease-in-out infinite alternate}
.orbs i:nth-child(2){background:var(--orb2);bottom:-25vmax;right:-15vmax;animation:drift2 26s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(18vmax,14vmax) scale(1.15)}}
@keyframes drift2{to{transform:translate(-16vmax,-12vmax) scale(.9)}}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.brand{font-weight:800;font-size:1.2rem;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.brand small{display:block;font-weight:400;font-size:.78rem;color:var(--muted)}
.logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--ring1),var(--ring2));background-size:200% 200%;animation:hue 6s ease infinite;display:grid;place-items:center;color:#fff;font-size:1rem}
@keyframes hue{50%{background-position:100% 100%}}
.live{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;color:var(--muted)}
.live b{width:8px;height:8px;border-radius:50%;background:var(--flat)}
.live.on b{background:var(--up);animation:ping 1.4s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--up) 70%,transparent)}100%{box-shadow:0 0 0 10px transparent}}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;padding:6px 0 10px;display:flex;gap:6px;overflow-x:auto;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
nav a{flex:none;text-decoration:none;color:var(--muted);font-weight:600;font-size:.9rem;padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--panel);transition:color .2s,transform .2s,background .3s}
nav a:hover{transform:translateY(-1px);color:var(--text)}
nav a.on{color:#fff;background:linear-gradient(135deg,var(--ring1),var(--ring2));border-color:transparent;box-shadow:0 6px 20px -6px var(--ring1)}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,button,input,textarea{font:inherit;font-size:.88rem;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
textarea{resize:none}
button{cursor:pointer;font-weight:600;transition:transform .15s,box-shadow .2s,opacity .2s}
button:hover:not(:disabled){transform:translateY(-1px)}
button:active:not(:disabled){transform:scale(.97)}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--ring1),var(--ring2));color:#fff;border:0;box-shadow:0 6px 18px -8px var(--ring2)}
button.primary::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-100%)}
button.primary:hover:not(:disabled)::after{animation:shine .8s}
@keyframes shine{to{transform:translateX(100%)}}
.pairtabs{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.pairtabs button{padding:5px 12px;border-radius:99px;font-size:.8rem}
.pairtabs button.on{background:linear-gradient(135deg,var(--ring1),var(--ring2));color:#fff;border-color:transparent}
.pairs{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px;max-height:230px;overflow:auto;margin-bottom:6px}
.pairs button{padding:9px 6px;font-size:.82rem;border-radius:12px;background:var(--panel2)}
.pairs button.sel{border-color:var(--ring1);box-shadow:0 0 0 2px color-mix(in srgb,var(--ring1) 35%,transparent);color:var(--ring1)}
#dealBtn{width:100%;font-size:1.15rem;padding:16px 26px;box-shadow:0 10px 28px -10px var(--ring1)}
.panel{border-radius:20px;box-shadow:0 8px 30px -18px var(--ring1)}
button.big{font-size:1.05rem;padding:14px 26px;border-radius:16px}
:focus-visible{outline:2px solid var(--ring1);outline-offset:2px}
.view{display:none}
.view.on{display:block;animation:viewIn .45s cubic-bezier(.2,.8,.2,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(12px)}}
.grid{display:grid;grid-template-columns:1.25fr 1fr;gap:14px}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:box-shadow .25s,border-color .25s}
.panel:hover{box-shadow:0 14px 34px -22px var(--ring1);border-color:color-mix(in srgb,var(--ring1) 35%,var(--line))}
.full{grid-column:1/-1}
.grid>*,.chat-wrap>*,.deal-grid>*{min-width:0}
.trade-card.long,.trade-card.short,.trade-card.flat{color:var(--text)}
.pill{display:inline-block;font-size:.75rem;padding:3px 9px;border-radius:99px;background:var(--panel2);color:var(--muted);margin:0 6px 4px 0}
.verdict{font-size:clamp(1.6rem,4.5vw,2.3rem);font-weight:800;letter-spacing:-.02em;margin:10px 0 6px}
.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.85);opacity:.3}}
.long{color:var(--up)} .short{color:var(--down)} .flat{color:var(--flat)}
.reasons{margin:0;padding-left:18px;color:var(--muted);font-size:.9rem}
.reasons li{animation:slideIn .35s both}
@keyframes slideIn{from{opacity:0;transform:translateX(-8px)}}
.signal{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.ring{width:130px;height:130px;position:relative}
.ring svg{transform:rotate(-90deg);overflow:visible}
.ring.hot svg{animation:glow 1.8s ease-in-out infinite}
@keyframes glow{50%{filter:drop-shadow(0 0 10px var(--ring2))}}
.ring .val{position:absolute;inset:0;display:grid;place-items:center;font-size:1.9rem;font-weight:600}
.ring .val span{font-size:.9rem;color:var(--muted)}
.cap{text-align:center;font-size:.75rem;color:var(--muted);margin-top:4px}
.chart-box{position:relative;height:300px}
.chart-box.sm{height:200px}
canvas{width:100%;height:100%;display:block}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.stat{background:var(--panel2);border-radius:12px;padding:10px}
.stat b{display:block;font-size:1.2rem}
.stat span{font-size:.75rem;color:var(--muted)}
h2{font-size:1rem;margin:0 0 10px}
.note{font-size:.8rem;color:var(--muted);margin:10px 0 0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
pre{background:var(--panel2);border-radius:12px;padding:12px;overflow-x:auto;font-size:.78rem;margin:8px 0 0;white-space:pre}
.bar{height:8px;border-radius:9px;background:var(--panel2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ring1),var(--ring2));transition:width .8s cubic-bezier(.2,.8,.2,1)}
/* інтер'єр */
.progress{position:fixed;top:0;left:0;right:0;height:3px;z-index:30;pointer-events:none}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ring1),var(--ring2));box-shadow:0 0 10px var(--ring2);transition:width .15s}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;width:44px;height:44px;border-radius:50%;padding:0;font-size:1.2rem;background:linear-gradient(135deg,var(--ring1),var(--ring2));color:#fff;border:0;box-shadow:0 10px 24px -8px var(--ring1);opacity:0;transform:translateY(20px) scale(.8);pointer-events:none;transition:opacity .3s,transform .3s}
.fab.show{opacity:1;transform:none;pointer-events:auto}
.themebtn{padding:6px 10px;border-radius:99px}
.themebtn:hover{transform:rotate(180deg) !important;transition:transform .5s}
.view.on .panel{animation:panelIn .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*.06s)}
@keyframes panelIn{from{opacity:0;transform:translateY(18px) scale(.985);filter:blur(4px)}}
body[data-dir=r] .view.on{animation-name:slideR}
body[data-dir=l] .view.on{animation-name:slideL}
@keyframes slideR{from{opacity:0;transform:translateX(28px)}}
@keyframes slideL{from{opacity:0;transform:translateX(-28px)}}
.panel{position:relative}
.panel::before{content:"";position:absolute;left:18px;right:18px;top:0;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--ring1),var(--ring2),transparent);opacity:.5;transition:opacity .3s}
.panel:hover::before{opacity:1}
nav a{position:relative}
nav a.on{animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
.ripple{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:rgba(255,255,255,.55);pointer-events:none;animation:rip .6s ease-out forwards}
@keyframes rip{to{transform:scale(18);opacity:0}}
.tfbar button,.pairs button,.pairtabs button{position:relative;overflow:hidden}
.bot{background:linear-gradient(160deg,var(--panel2),color-mix(in srgb,var(--ring1) 8%,var(--panel2)))}
.bot .bal{background:linear-gradient(135deg,var(--text),var(--ring1));-webkit-background-clip:text;background-clip:text;color:transparent}
.bot:hover{box-shadow:0 14px 28px -16px var(--ring1)}
.log div{animation:slideIn .35s both}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--ring1) 40%,transparent);border-radius:8px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01s !important;transition-duration:.01s !important}}
/* аватари */
.av{display:inline-block;flex:none;border-radius:50%;overflow:hidden;line-height:0}
.av svg{width:100%;height:100%}
.av{border-radius:22%;clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%);background:linear-gradient(145deg,#555b6e,#14161f);padding:2px;box-shadow:0 0 0 2px #0b0c12;filter:contrast(1.25) saturate(1.2) drop-shadow(0 3px 6px rgba(0,0,0,.55))}
.av svg{clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%)}
.av.fox{background:linear-gradient(145deg,var(--ring1),#14161f)}
.tfbar{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.tfbar button{padding:7px 12px;border-radius:10px;font-weight:700}
.tfbar button.on{background:var(--ring1);color:#fff;border-color:var(--ring1)}
.av .eye{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
.av.k1 .eye{animation-delay:1.1s}.av.k2 .eye{animation-delay:2.3s}.av.k3 .eye{animation-delay:.6s}.av.k4 .eye{animation-delay:3.1s}.av.k5 .eye{animation-delay:1.8s}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.av.talk{animation:bob .6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
/* угода */
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{border:0;background:transparent;border-radius:10px;padding:9px 14px;color:var(--muted)}
.seg button.on{background:var(--panel);color:var(--text);box-shadow:0 4px 14px -8px var(--ring1)}
.deal-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
@media (max-width:720px){.deal-grid{grid-template-columns:1fr}}
.roster{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
@media (max-width:760px){.roster{grid-template-columns:repeat(3,1fr)}.roster .rb:first-child{grid-column:1/-1;flex-direction:row;justify-content:center;gap:12px}}
.rb{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);font-size:.78rem;text-align:center;transition:transform .25s}
.rb:hover{transform:translateY(-3px)}
.rb b{font-size:.85rem;letter-spacing:.03em}
.rb .vt{font-weight:700;min-height:1.2em}
.drop{position:relative;min-height:200px;border-radius:16px;display:grid;place-items:center;text-align:center;cursor:pointer;overflow:hidden;color:var(--muted);font-size:.9rem;padding:18px;
  background:linear-gradient(var(--panel2),var(--panel2)) padding-box,repeating-linear-gradient(45deg,var(--ring1) 0 10px,transparent 10px 20px) border-box;border:2px dashed transparent;background-size:auto,28px 28px;animation:ants 1.2s linear infinite;transition:transform .2s}
@keyframes ants{to{background-position:0 0,28px 0}}
.drop.over{transform:scale(1.02)}
.drop.has{padding:0;animation:none;border:1px solid var(--line);background:var(--panel2)}
.drop img{width:100%;height:100%;max-height:320px;object-fit:contain;display:block}
.drop .icon{font-size:2rem;display:block;margin-bottom:6px;animation:bob 2.4s ease-in-out infinite}
.scan{position:absolute;left:0;right:0;height:60px;top:-60px;background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--ring1) 45%,transparent),transparent);display:none;pointer-events:none}
.drop.scanning .scan{display:block;animation:scan 1.6s ease-in-out infinite}
.drop.scanning img{filter:saturate(.6) brightness(.85)}
@keyframes scan{to{top:100%}}
.thinking{display:flex;align-items:center;justify-content:center;gap:6px;color:var(--muted);padding:20px 0}
.thinking i{width:8px;height:8px;border-radius:50%;background:var(--ring1);animation:dot 1s infinite}
.thinking i:nth-child(2){animation-delay:.15s;background:color-mix(in srgb,var(--ring1) 50%,var(--ring2))}.thinking i:nth-child(3){animation-delay:.3s;background:var(--ring2)}
@keyframes dot{50%{transform:translateY(-7px);opacity:.4}}
.trade-card{border-radius:16px;padding:16px;background:var(--panel2);border:1px solid var(--line);animation:cardIn .55s cubic-bezier(.2,1.3,.4,1)}
.trade-card.long{border-color:var(--up);box-shadow:0 0 0 1px var(--up) inset,0 10px 30px -18px var(--up)}
.trade-card.short{border-color:var(--down);box-shadow:0 0 0 1px var(--down) inset,0 10px 30px -18px var(--down)}
@keyframes cardIn{from{opacity:0;transform:scale(.92) translateY(10px)}}
.res-box{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.res-q{font-weight:700;margin-bottom:8px}
.res-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.res-btns button{font-size:1rem;padding:12px;border-radius:14px;border:2px solid}
.res-yes{border-color:var(--up)!important;color:var(--up)}
.res-no{border-color:var(--down)!important;color:var(--down)}
.res-done{font-weight:600;padding:10px 12px;border-radius:12px;background:var(--panel)}
.votes{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.vote{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:3px 10px 3px 3px;font-size:.78rem;animation:cardIn .4s both}
.conf{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin:6px 0 10px}
.conf i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ring1),var(--ring2));transition:width 1s cubic-bezier(.2,.8,.2,1)}
/* боти */
.bots{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.bot{position:relative;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px;transition:opacity .3s,transform .25s;animation:viewIn .4s both}
.bot:hover{transform:translateY(-3px)}
.bot.off{opacity:.5}
.bot.trading::before{content:"";position:absolute;inset:-1px;border-radius:15px;padding:1px;background:conic-gradient(from var(--a,0deg),var(--ring1),var(--ring2),transparent 60%,var(--ring1));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 2.4s linear infinite;pointer-events:none}
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
@keyframes spin{to{--a:360deg}}
.bot.win{animation:flashW .9s}.bot.lose{animation:flashL .9s}
@keyframes flashW{30%{box-shadow:0 0 0 3px var(--up),0 0 24px var(--up)}}
@keyframes flashL{30%{box-shadow:0 0 0 3px var(--down),0 0 24px var(--down)}}
.bot .top{display:flex;align-items:center;gap:10px}
.bot h3{margin:0;font-size:1rem;letter-spacing:.02em}
.bot .role{font-size:.72rem;color:var(--muted)}
.bot .bal{font-size:1.25rem;font-weight:600;margin:8px 0 2px}
.bot .chg{font-size:.8rem}
.bot .state{font-size:.75rem;color:var(--muted);margin-top:4px;min-height:1.1em}
.bot label{display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted);margin-top:8px;cursor:pointer}
.strat-sel{width:100%;margin-top:8px;font-size:.78rem;padding:5px 8px}
/* чат */
.chat-wrap{display:grid;grid-template-columns:1.6fr 1fr;gap:14px}
@media (max-width:860px){.chat-wrap{grid-template-columns:1fr}}
.chat{height:min(62vh,560px);overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px 2px 8px;scroll-behavior:smooth}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:92%;animation:msgIn .4s cubic-bezier(.2,1.2,.4,1) both}
@keyframes msgIn{from{opacity:0;transform:translateY(10px) scale(.97)}}
.msg .bub{background:var(--panel2);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:8px 12px;font-size:.9rem;white-space:pre-wrap;word-break:break-word}
.msg .who{font-size:.72rem;color:var(--muted);margin-bottom:2px}
.msg .who b{color:var(--text)}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg.me .bub{background:linear-gradient(135deg,var(--ring1),var(--ring2));color:#fff;border:0;border-radius:16px 16px 4px 16px}
.msg.me .bub img{max-width:180px;border-radius:10px;display:block;margin-top:6px}
.sys{align-self:center;font-size:.78rem;color:var(--muted);background:var(--panel2);border:1px dashed var(--line);border-radius:12px;padding:6px 12px;max-width:95%;animation:msgIn .4s both}
.sys button{margin-left:8px}
.typing{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--muted);min-height:34px}
.composer{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin-top:10px}
.composer select{flex:1 1 100%}
@media (min-width:700px){.composer select{flex:0 0 auto}}
.composer textarea{min-width:0}
.composer textarea{flex:1;min-height:44px;max-height:140px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px}
.chips button{flex:none;font-size:.78rem;padding:6px 10px;border-radius:99px;font-weight:500}
.attach{display:flex;align-items:center;gap:8px;font-size:.78rem;color:var(--muted);margin-top:6px}
.attach img{height:40px;border-radius:6px}
.brain h3{font-size:.85rem;margin:14px 0 6px;color:var(--muted);font-weight:600}
.brain .it{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;font-size:.84rem;padding:7px 0;border-bottom:1px solid var(--line);animation:slideIn .3s both}
.brain .it small{color:var(--muted)}
.empty{font-size:.82rem;color:var(--muted)}
/* інше */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:500;font-size:.78rem}
tbody tr{animation:slideIn .35s both}
.log{max-height:280px;overflow:auto;font-size:.82rem}
.log>div{padding:7px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;animation:slideIn .35s both}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.form label{display:flex;flex-direction:column;gap:5px;font-size:.85rem;color:var(--muted)}
.tg{display:flex;gap:10px;align-items:center;font-size:.9rem;margin-top:10px;cursor:pointer}
.tg input{width:18px;height:18px;accent-color:var(--ring1)}
.status>div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:.88rem}
.status span:last-child{color:var(--muted);text-align:right}
.mini{font-size:.75rem;padding:4px 9px;border-radius:8px}
.mini.w{color:var(--up);border-color:var(--up)}.mini.l{color:var(--down);border-color:var(--down)}
.addform{display:none;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:10px;animation:viewIn .3s}
.addform.on{display:grid}
input[type=file]{display:none}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 16px;font-size:.88rem;box-shadow:0 14px 34px -14px rgba(0,0,0,.4);transition:all .35s cubic-bezier(.2,1.2,.4,1);z-index:30;max-width:92vw}
.toast.on{transform:translate(-50%,0);opacity:1}

html[data-btn=d3] :is(.tfbar,.pairs,.pairtabs,.seg) button,html[data-btn=d3] nav a,html[data-btn=d3] button.primary{border:0!important;box-shadow:0 4px 0 color-mix(in srgb,#000 45%,var(--panel2))!important;transform:translateY(-2px)}
html[data-btn=d3] :is(.tfbar,.pairs,.pairtabs,.seg) button:active,html[data-btn=d3] button.primary:active{transform:translateY(2px);box-shadow:0 1px 0 #000!important}
html[data-btn=flat] :is(.tfbar,.pairs,.pairtabs,.seg) button,html[data-btn=flat] nav a{background:transparent!important;border:0!important;box-shadow:none!important;border-radius:0!important}
html[data-btn=flat] :is(.tfbar,.pairs,.pairtabs,.seg) button:is(.on,.sel),html[data-btn=flat] nav a.on{box-shadow:inset 0 -2px 0 var(--ring1)!important;color:var(--text)!important;background:transparent!important}
html[data-btn=round] :is(.tfbar,.pairtabs,.seg) button{border-radius:50%!important;width:52px;height:52px;padding:0!important;display:inline-grid;place-items:center;font-size:.72rem}
html[data-btn=round] .pairs button,html[data-btn=round] nav a{border-radius:99px!important}
html[data-btn=big] :is(.tfbar,.pairs,.pairtabs,.seg) button{padding:14px 16px!important;font-size:1rem!important}html[data-btn=big] nav a{padding:12px 18px!important}
/* шкали */
.gnum{font-size:3.4rem;font-weight:800;text-align:center;line-height:1;margin:10px 0 0;font-variant-numeric:tabular-nums}.gnum small{font-size:1.2rem}
.gring{position:relative;width:120px;height:120px;margin:10px auto 0}.gring svg{width:120px;height:120px;transform:rotate(-90deg)}
.gring .t{fill:none;stroke:var(--panel);stroke-width:9}.gring .v{fill:none;stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset 1s}
.gring span{position:absolute;inset:0;display:grid;place-items:center;font-size:1.6rem;font-weight:800}
.gspeedo{position:relative;width:200px;margin:10px auto 0;text-align:center}.gspeedo svg{width:200px;height:124px;overflow:visible}
.gspeedo path{fill:none;stroke-width:9;stroke-linecap:round}.gspeedo .lo{stroke:color-mix(in srgb,var(--down) 70%,transparent)}.gspeedo .hi{stroke:color-mix(in srgb,var(--up) 70%,transparent)}
.gspeedo .nd{stroke:var(--text);stroke-width:2.5;stroke-linecap:round;transform-origin:50px 55px;transition:transform 1s cubic-bezier(.2,.8,.2,1)}.gspeedo .hub{fill:var(--text)}
.gspeedo b{display:block;font-size:1.5rem;margin-top:-6px}
.gblocks{display:flex;align-items:center;gap:4px;margin:12px 0 0}.gblocks i{flex:1;height:18px;border-radius:4px;background:var(--panel);border:1px solid var(--line)}
.gblocks i.on{background:linear-gradient(180deg,var(--ring1),var(--ring2));border-color:transparent}.gblocks i.be{outline:2px dashed var(--down);outline-offset:1px}.gblocks b{margin-left:8px;font-size:1.2rem}
/* якість входу */
.qual{display:flex;align-items:center;gap:10px;margin:10px 0 2px;padding:8px 10px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.qual b{width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;font-size:1.1rem;color:#fff}
.qual span{display:flex;flex-direction:column;font-size:.85rem;font-weight:600}.qual small{font-weight:400;color:var(--muted);font-size:.74rem}
.qual.qA b{background:var(--up)}.qual.qB b{background:#f5a524}.qual.qC b{background:var(--down)}
.qual.qC{border-color:var(--down)}

/* ===================== otcharts ===================== */
.nodata{padding:22px 16px;border-radius:14px;border:1px solid var(--down);background:color-mix(in srgb,var(--down) 10%,transparent);font-weight:700;text-align:center}
.nodata small{display:block;font-weight:400;color:var(--muted);margin-top:6px}
#otcStatus.ok{color:var(--up)}#otcStatus.bad{color:var(--down)}

/* ===================== екран входу ===================== */
html.locked .wrap,html.locked #dealFab,html.locked .fab{visibility:hidden}
#lockScreen{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--ring1) 35%,var(--bg)),var(--bg) 70%);color:var(--text)}
#lockScreen img{width:96px;height:96px;border-radius:24px;box-shadow:0 18px 40px -14px var(--ring1)}
#lockScreen h1{margin:4px 0 0;font-size:1.6rem;letter-spacing:.02em}
#lockScreen p{margin:0;color:var(--muted);font-size:.9rem;text-align:center}
#lockScreen form{display:flex;flex-direction:column;gap:10px;width:min(320px,100%);margin-top:8px}
#lockScreen input{font-size:1.1rem;padding:14px 16px;border-radius:14px;text-align:center}
#lockScreen button{font-size:1.05rem;padding:14px;border-radius:14px}
#lockErr{min-height:1.3em;color:var(--down);font-size:.9rem;text-align:center}
#lockScreen.shake form{animation:tShake .45s}

/* сила сигналу */
.split{margin:10px 0 4px}.split-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.split-h b{font-size:1.25rem;font-variant-numeric:tabular-nums}.split-h b.long{color:var(--up)}.split-h b.short{color:var(--down)}
.weak-tag{font-size:.72rem;padding:3px 8px;border-radius:99px;background:color-mix(in srgb,#f5a524 22%,transparent);color:#f5a524;font-weight:700}
.split-bar{display:flex;height:22px;border-radius:11px;overflow:hidden;margin-top:6px;background:var(--panel)}
.split-bar i{display:flex;align-items:center;font-style:normal;font-size:.72rem;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden}
.split-bar .u{background:var(--up);justify-content:flex-start;padding-left:8px}.split-bar .d{background:var(--down);justify-content:flex-end;padding-right:8px}
.split.weak .split-bar{opacity:.75}

.scanbox{margin-top:12px;padding:12px;border-radius:14px;border:1px dashed var(--line);background:color-mix(in srgb,var(--panel2) 60%,transparent)}
.scanbox .row{gap:8px}.scanbox #scanBtn{flex:1;font-weight:700}
.scanopt{display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--muted);margin-top:8px;cursor:pointer}
.scanopt input{width:18px;height:18px;accent-color:var(--ring1)}
#scanStatus.found{color:var(--up);font-weight:700}
.lg-ok{color:var(--up);font-weight:700}.lg-bad{color:var(--down);font-weight:700}.lg-mid,.lg-learn{color:var(--muted)}

/* ===================== проходимість · пасхалки ===================== */
.pass{margin:10px 0 4px;padding:12px 14px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.pass-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.pass-h span{font-size:.85rem;color:var(--muted);font-weight:600}
.pass-h b{font-size:2.1rem;line-height:1;font-variant-numeric:tabular-nums}
.pass.good .pass-h b{color:var(--up)}.pass.meh .pass-h b{color:#f5a524}
.pass-bar{height:10px;border-radius:99px;background:var(--panel2);overflow:hidden;margin:8px 0 6px}
.pass-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--ring1),var(--ring2));transition:width .9s cubic-bezier(.2,.8,.2,1)}
.pass.good .pass-bar i{background:linear-gradient(90deg,#2fd39a,#7bf5c4)}
.pass small{font-size:.74rem;color:var(--muted)}
#eggModal{position:fixed;inset:0;z-index:9000;display:grid;place-items:center;padding:18px;background:rgba(5,6,14,.6);backdrop-filter:blur(6px);animation:eggIn .25s ease-out}
@keyframes eggIn{from{opacity:0}to{opacity:1}}
.egg-card{position:relative;width:min(520px,100%);max-height:84vh;overflow:auto;padding:20px 18px 16px;border-radius:22px;background:var(--panel2);border:1px solid var(--line);box-shadow:0 30px 80px -20px var(--ring1);animation:eggPop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes eggPop{from{transform:scale(.85) translateY(20px)}to{transform:none}}
.egg-card h3{margin:0 0 10px;font-size:1.25rem}.egg-card p{margin:8px 0;font-size:.92rem}
.egg-big{font-size:1.05rem!important;font-weight:700}
.egg-x{position:absolute;top:10px;right:10px;width:34px;height:34px;padding:0;border-radius:50%}
.egg-card table{width:100%;border-collapse:collapse;font-size:.82rem}.egg-card td,.egg-card th{padding:6px 5px;border-bottom:1px solid var(--line);text-align:left}
.egg-card .long{color:var(--up)}.egg-card .short{color:var(--down)}
html.zen nav,html.zen header .controls,html.zen .blk-seg,html.zen .blk-pairs,html.zen #scanBox,html.zen .deal-info,html.zen #livebg{display:none!important}
html.zen header .brand small::after{content:" · 🧘 дзен"}
.fxfox{display:none!important;position:fixed;z-index:60;font-size:46px;bottom:18%;left:-80px;pointer-events:none;animation:runFox 2.8s linear forwards;filter:drop-shadow(0 0 14px #ff7a1a)}
.moonfox{position:fixed;z-index:60;font-size:40px;top:12%;left:-80px;pointer-events:none;animation:moonFox 5s ease-in-out forwards;filter:drop-shadow(0 0 16px #c9d6ff)}
@keyframes moonFox{0%{transform:translateX(0)}50%{transform:translateX(50vw) translateY(-20px)}100%{transform:translateX(115vw)}}
@media (prefers-reduced-motion:reduce){.fxfox,.moonfox{display:none!important}}

.egg-bar{height:10px;border-radius:99px;background:var(--panel);border:1px solid var(--line);overflow:hidden}
.egg-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd36b,#ff7a1a);border-radius:99px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.egg-badge{position:absolute;margin:-6px 0 0 28px;min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:linear-gradient(135deg,#ffd36b,#ff7a1a);color:#1b1206;font-size:.7rem;font-weight:800;display:inline-grid;place-items:center;box-shadow:0 4px 12px -4px #ff7a1a;cursor:pointer}
.egg-badge.pop{animation:tPulse .8s ease-out}
.brand{position:relative}

/* ===================== секретні стилі ===================== */
html.st-matrix{--bg:#000!important;--panel:rgba(0,18,6,.86)!important;--panel2:#001a08!important;--text:#22ff77!important;--muted:#11b552!important;--line:#0b4d22!important;--ring1:#22ff77!important;--ring2:#00c853!important;--up:#22ff77!important;--down:#ff3b5c!important}
html.st-matrix body{background:#000!important;font-family:"Courier New",ui-monospace,monospace!important}
html.st-matrix body *{font-family:"Courier New",ui-monospace,monospace!important;text-shadow:0 0 6px rgba(34,255,119,.45)}
html.st-matrix #livebg{opacity:0!important}
html.st-matrix button.primary,html.st-matrix nav a.on{background:#003d14!important;color:#22ff77!important;border:1px solid #22ff77!important;box-shadow:0 0 14px rgba(34,255,119,.5)!important}
#mxRain{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.32;display:none}
html.st-matrix #mxRain{display:block}
html.st-retro{--bg:#1b1036!important;--panel:#2a1b5e!important;--panel2:#22164b!important;--text:#fff6d5!important;--muted:#c9b8ff!important;--line:#000!important;--ring1:#ff4fa3!important;--ring2:#ffd23f!important;--up:#3dff8b!important;--down:#ff4f4f!important}
html.st-retro body *{font-family:"Courier New",ui-monospace,monospace!important;letter-spacing:.02em}
html.st-retro :is(.panel,.trade-card,button,nav a,input,select,.pill,.set-g,.pass,.scanbox,.deal-info span){border-radius:0!important;border:3px solid #000!important;box-shadow:4px 4px 0 #000!important}
html.st-retro button:active{transform:translate(3px,3px)!important;box-shadow:1px 1px 0 #000!important}
html.st-retro body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:9999;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 2px,transparent 2px 4px);mix-blend-mode:multiply}
html.st-retro #livebg{image-rendering:pixelated;filter:saturate(1.6) contrast(1.2)}
/* титри */
#credits{position:fixed;inset:0;z-index:9500;background:#000;overflow:hidden;cursor:pointer;perspective:420px;animation:eggIn .6s}
#credits .stars{position:absolute;inset:-50%;background-image:radial-gradient(1px 1px at 10% 20%,#fff,transparent),radial-gradient(1px 1px at 30% 80%,#cfd8ff,transparent),radial-gradient(2px 2px at 70% 30%,#fff,transparent),radial-gradient(1px 1px at 85% 65%,#ffe9c4,transparent),radial-gradient(1px 1px at 50% 50%,#fff,transparent);background-size:220px 220px;animation:starDrift 60s linear infinite}
@keyframes starDrift{to{transform:translateY(220px)}}
#credits .crawl{position:absolute;left:50%;bottom:-120%;width:min(640px,90vw);transform-origin:50% 100%;transform:translateX(-50%) rotateX(24deg);color:#ffd36b;text-align:center;font-weight:800;font-size:clamp(18px,4.6vw,30px);line-height:1.5;animation:crawl 46s linear forwards}
#credits .crawl h1{font-size:2.2em;margin:0 0 .4em;letter-spacing:.08em}#credits .crawl p{margin:0 0 1.1em}
@keyframes crawl{to{bottom:240%}}
#credits .ctitle{position:absolute;top:38%;width:100%;text-align:center;color:#ffd36b;font-size:clamp(34px,9vw,80px);font-weight:900;letter-spacing:.12em;animation:ctitle 5s ease-in forwards;text-shadow:0 0 30px #ff7a1a}
@keyframes ctitle{0%{opacity:0;transform:scale(1.6)}20%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(.4)}}
/* тренажер */
.gm-chart{width:100%;height:170px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.gm-btns{display:flex;gap:10px;margin-top:10px}.gm-btns button{flex:1;font-size:1.1rem;font-weight:800;padding:14px}
.gm-up{color:var(--up)!important}.gm-dn{color:var(--down)!important}
.gm-score{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);margin-top:6px}
@media (prefers-reduced-motion:reduce){#credits .crawl{animation-duration:1s}#credits .stars{animation:none}}

/* ===================== v3: система, аналізатор, журнал, нові розкладки й кнопки ===================== */
#csvBtn,#csvInput,[data-m="bot1"],#mBot1,#bCode,#bCode+*,.scanopt:has(#scanBot1){display:none!important}
.brain h3:has(+#bCode){display:none}
.nav-badge[hidden]{display:none!important}
.nav-badge{display:inline-grid;place-items:center;min-width:18px;height:18px;margin-left:6px;padding:0 5px;border-radius:99px;background:var(--down);color:#fff;font-size:.68rem;font-weight:800}
.sys-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.sys-tabs button{flex:none;padding:9px 14px;border-radius:12px;font-weight:700;font-size:.86rem}
.sys-tabs button.on{background:linear-gradient(135deg,var(--ring1),var(--ring2));color:#fff;border-color:transparent}
.sys-tabs b{font-size:.72rem;margin-left:4px;color:var(--down)}
.sys-pane{display:none}.sys-pane.on{display:block;animation:eggIn .25s}
.sys-pane .panel{box-shadow:none;border:0;padding:0;background:none;margin:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:0 0 12px}
.kpi{padding:12px 14px;border-radius:16px;background:var(--panel);border:1px solid var(--line)}
.kpi small{display:block;color:var(--muted);font-size:.74rem;font-weight:600;margin-bottom:4px}
.kpi b{font-size:1.45rem;font-variant-numeric:tabular-nums}
.kpi.good b{color:var(--up)}.kpi.bad b{color:var(--down)}
.lsn{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:14px;background:var(--panel);border:1px solid var(--line);margin-bottom:8px}
.lsn .st{flex:none;font-size:.72rem;font-weight:800;padding:4px 8px;border-radius:99px;background:var(--panel2);white-space:nowrap}
.lsn .st.ok{color:var(--up)}.lsn .st.bad{color:var(--down)}.lsn .st.wait{color:var(--muted)}.lsn .st.mid{color:#f5a524}
.lsn p{margin:0;font-size:.86rem;flex:1}.lsn small{display:block;color:var(--muted);font-size:.72rem;margin-top:3px}
.errrow{padding:9px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--down);margin-bottom:6px;font-size:.84rem}
.errrow small{display:block;color:var(--muted);font-size:.7rem}
/* головний: блок пошуку */
.scanbox{border:1px solid var(--line)!important;border-radius:20px!important;background:linear-gradient(160deg,color-mix(in srgb,var(--ring1) 12%,var(--panel)),var(--panel))!important;padding:14px!important;position:relative;overflow:hidden}
.scanbox::before{content:"";position:absolute;inset:0;border-radius:20px;padding:1px;background:linear-gradient(135deg,var(--ring1),transparent 40%,var(--ring2));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.scanbox #scanBtn{min-height:52px;font-size:1.05rem;border-radius:14px;background:linear-gradient(135deg,var(--ring1),var(--ring2));color:#fff;border:0}
.scanmore{margin-top:10px}.scanmore summary{cursor:pointer;font-size:.82rem;color:var(--muted);font-weight:700;list-style:none;padding:6px 2px}
.scanmore summary::-webkit-details-marker{display:none}.scanmore summary::before{content:"⚙ ";}.scanmore[open] summary::before{content:"▾ ⚙ "}
.scanopt input[type=checkbox]{appearance:none;-webkit-appearance:none;width:42px;height:24px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);position:relative;flex:none;cursor:pointer;transition:background .2s}
.scanopt input[type=checkbox]::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.scanopt input[type=checkbox]:checked{background:var(--up);border-color:transparent}.scanopt input[type=checkbox]:checked::after{transform:translateX(18px)}
/* аналізатор */
#v-analyzer .grid>section:not(#anaPanel){display:none!important}
.ana-top{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.ana-top select{flex:1;min-width:150px}
.ana-verdict{padding:14px 16px;border-radius:18px;background:linear-gradient(135deg,color-mix(in srgb,var(--ring1) 18%,var(--panel)),var(--panel));border:1px solid var(--line);margin-bottom:12px}
.ana-verdict b{font-size:1.15rem}.ana-verdict p{margin:6px 0 0;font-size:.88rem;color:var(--muted)}
.tf-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.tf{padding:10px;border-radius:14px;background:var(--panel);border:1px solid var(--line);text-align:center}
.tf small{display:block;color:var(--muted);font-size:.72rem;font-weight:700}.tf b{display:block;font-size:1.4rem;margin:2px 0}.tf span{font-size:.72rem;color:var(--muted)}
.tf.up b{color:var(--up)}.tf.dn b{color:var(--down)}
.meter{margin:10px 0}.meter .lbl{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);margin-bottom:4px}
.meter .bar{position:relative;height:12px;border-radius:99px;background:linear-gradient(90deg,color-mix(in srgb,var(--up) 45%,transparent),var(--panel2) 50%,color-mix(in srgb,var(--down) 45%,transparent))}
.meter .bar i{position:absolute;top:-4px;width:6px;height:20px;border-radius:4px;background:var(--text);transform:translateX(-50%);box-shadow:0 0 10px var(--ring1)}
.ana-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:720px){.ana-cols{grid-template-columns:1fr}.tf-grid{grid-template-columns:repeat(2,1fr)}}
.ana-box{padding:12px;border-radius:16px;background:var(--panel);border:1px solid var(--line)}.ana-box h4{margin:0 0 8px;font-size:.9rem}
.ana-box table{width:100%;border-collapse:collapse;font-size:.8rem}.ana-box td,.ana-box th{padding:5px 4px;border-bottom:1px solid var(--line);text-align:left}
.ana-box .long{color:var(--up)}.ana-box .short{color:var(--down)}
.scan-row{cursor:pointer}.scan-row:hover td{background:var(--panel2)}
/* журнал */
.tr-hero{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;margin-bottom:12px}
.tr-ring{width:110px;height:110px;position:relative}.tr-ring svg{width:110px;height:110px;transform:rotate(-90deg)}
.tr-ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:1.5rem}
.dots{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.dots i{width:12px;height:12px;border-radius:50%;background:var(--panel2)}.dots i.w{background:var(--up)}.dots i.l{background:var(--down)}
#jList>div{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px!important;border-radius:14px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--line);margin-bottom:8px}
#jList>div.rw{border-left-color:var(--up)}#jList>div.rl{border-left-color:var(--down)}
#jList .mini.w{background:color-mix(in srgb,var(--up) 18%,transparent);color:var(--up);border-color:transparent}
#jList .mini.l{background:color-mix(in srgb,var(--down) 18%,transparent);color:var(--down);border-color:transparent}
/* нові розкладки */
html[data-layout=dock] nav{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:30;justify-content:flex-start;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--panel2) 82%,transparent);border-top:1px solid var(--line)}
html[data-layout=dock] nav a{flex:1 0 auto;text-align:center;font-size:.76rem;border-radius:12px;border:0;background:transparent}
html[data-layout=dock] nav a.on{background:linear-gradient(135deg,var(--ring1),var(--ring2));color:#fff}
html[data-layout=dock] .wrap{padding-bottom:96px}
html[data-layout=capsule] nav{position:fixed;left:50%;transform:translateX(-50%);top:auto;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:30;max-width:calc(100% - 20px);padding:6px;border-radius:99px;background:color-mix(in srgb,var(--panel2) 80%,transparent);border:1px solid var(--line);box-shadow:0 18px 40px -16px #000}
html[data-layout=capsule] nav a{border:0;background:transparent;font-size:.8rem;padding:9px 13px}
html[data-layout=capsule] nav a.on{background:var(--text);color:var(--bg)}
html[data-layout=capsule] .wrap{padding-bottom:100px}
@media(min-width:900px){html[data-layout=rail] nav{position:fixed;left:12px;top:90px;bottom:12px;flex-direction:column;width:170px;overflow:auto;padding:10px;border-radius:20px;background:var(--panel);border:1px solid var(--line)}
 html[data-layout=rail] nav a{border:0;background:transparent;text-align:left}html[data-layout=rail] nav a.on{background:var(--panel2);color:var(--text);box-shadow:inset 3px 0 0 var(--ring1)}
 html[data-layout=rail] .wrap{padding-left:200px}}
@media(max-width:899px){html[data-layout=rail] nav{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:30;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--panel2) 85%,transparent);border-top:1px solid var(--line)}html[data-layout=rail] .wrap{padding-bottom:92px}}
html[data-layout=studio] .wrap{max-width:820px;margin:0 auto}
html[data-layout=studio] nav{justify-content:center}html[data-layout=studio] nav a{border:0;background:transparent;border-radius:0;box-shadow:inset 0 -2px 0 transparent}
html[data-layout=studio] nav a.on{background:transparent;color:var(--text);box-shadow:inset 0 -2px 0 var(--ring1)}
html[data-layout=dense] .panel{padding:12px!important}html[data-layout=dense] body{font-size:15px}html[data-layout=dense] nav a{padding:6px 11px;font-size:.82rem}
/* нові стилі кнопок */
html[data-btn=glassx] :is(.tfbar,.pairs,.pairtabs,.seg,.sys-tabs) button{background:color-mix(in srgb,#fff 6%,transparent)!important;border:1px solid color-mix(in srgb,#fff 16%,transparent)!important;backdrop-filter:blur(14px);border-radius:14px!important}
html[data-btn=glassx] :is(.tfbar,.pairs,.pairtabs,.seg) button:is(.on,.sel){background:color-mix(in srgb,var(--ring1) 35%,transparent)!important;border-color:var(--ring1)!important;color:#fff!important}
html[data-btn=softx] :is(.tfbar,.pairs,.pairtabs,.seg,.sys-tabs) button{background:var(--panel2)!important;border:0!important;border-radius:16px!important;box-shadow:inset 0 1px 0 color-mix(in srgb,#fff 8%,transparent),0 6px 14px -10px #000!important}
html[data-btn=softx] :is(.tfbar,.pairs,.pairtabs,.seg) button:is(.on,.sel){background:var(--text)!important;color:var(--bg)!important}
html[data-btn=gradx] :is(.tfbar,.pairs,.pairtabs,.seg) button:is(.on,.sel){background:linear-gradient(135deg,var(--ring1),var(--ring2))!important;color:#fff!important;border-color:transparent!important;box-shadow:0 8px 20px -10px var(--ring1)!important}
html[data-btn=gradx] :is(.tfbar,.pairs,.pairtabs,.seg) button{border-radius:12px!important}
html[data-btn=linex] :is(.tfbar,.pairs,.pairtabs,.seg) button{background:transparent!important;border:1.5px solid var(--line)!important;border-radius:10px!important}
html[data-btn=linex] :is(.tfbar,.pairs,.pairtabs,.seg) button:is(.on,.sel){border-color:var(--text)!important;color:var(--text)!important}
html[data-btn=chipx] :is(.tfbar,.pairs,.pairtabs,.seg) button{border-radius:99px!important;padding-left:16px!important;padding-right:16px!important;background:var(--panel)!important}
html[data-btn=chipx] :is(.tfbar,.pairs,.pairtabs,.seg) button:is(.on,.sel){background:color-mix(in srgb,var(--up) 22%,var(--panel))!important;color:var(--up)!important;border-color:var(--up)!important}

/* ===================== хвиля 1 ===================== */
.pp{display:block;font-size:.68rem;font-weight:800;margin-top:2px;opacity:.9}.pp.g{color:var(--up)}.pp.m{color:#f5a524}.pp.b{color:var(--down)}
.reso{display:inline-flex;align-items:center;gap:6px;margin:8px 0 0;padding:6px 12px;border-radius:99px;font-weight:800;font-size:.85rem;background:linear-gradient(135deg,color-mix(in srgb,var(--ring1) 30%,transparent),color-mix(in srgb,var(--ring2) 30%,transparent));border:1px solid var(--ring1);animation:resoPulse 1.6s ease-in-out infinite}
.reso.soft{animation:none;opacity:.85;border-color:var(--line)}
@keyframes resoPulse{50%{box-shadow:0 0 18px var(--ring1)}}
.bestexp{font-size:.8rem;color:var(--muted);margin:6px 0 0}
.dlt{font-size:.7rem;margin-left:5px;font-weight:700}.dlt.up{color:var(--up)}.dlt.dn{color:var(--down)}
.lvl{display:inline-grid;place-items:center;min-width:34px;padding:2px 6px;border-radius:99px;font-size:.72rem;font-weight:800;background:var(--panel2)}
.lvl.b{color:#d08a4a;box-shadow:inset 0 0 0 1px #d08a4a}.lvl.s{color:#c8d3e0;box-shadow:inset 0 0 0 1px #c8d3e0}.lvl.g{color:#ffd36b;box-shadow:inset 0 0 0 1px #ffd36b}.lvl.d{color:#7ff3ff;box-shadow:inset 0 0 0 1px #7ff3ff,0 0 10px #7ff3ff66}
.fired td{opacity:.5;text-decoration:line-through}

#laptopCard{margin:0 0 12px;padding:12px 14px;border-radius:16px;background:linear-gradient(135deg,color-mix(in srgb,var(--ring2) 14%,var(--panel)),var(--panel));border:1px solid var(--line);font-size:.86rem}
#laptopCard b{font-size:.95rem}#laptopCard small{display:block;color:var(--muted);margin-top:3px}
</style>
</head>
<body>
<template id="app-body"><div class="orbs" aria-hidden="true"><i></i><i></i></div>
<div class="toast" id="toast" role="status"></div>
<div class="wrap">
  <header>
    <div class="brand"><span class="logo">🦊</span><div>SHADOW FOX<small>Сигнали, боти й команда ШІ</small></div></div>
    <div class="controls">
      <span class="live" id="liveDot"><b></b><span id="liveTxt">Потік зупинено</span></span>
      <button id="liveBtn" class="primary">Запустити потік</button>
      <button id="csvBtn">Свічки CSV</button>
      <input type="file" id="csvInput" accept=".csv,text/csv">
    </div>
  </header>
  <nav>
    <a href="#trade" data-v="trade">Угода</a>
    <a href="#team" data-v="team">Чат</a>
    <a href="#system" data-v="system">Система<span class="nav-badge" id="sysBadge" hidden></span></a>
    <a href="#brain" data-v="brain" hidden>Мозок</a>
    <a href="#bots" data-v="bots">Боти</a>
    <a href="#analyzer" data-v="analyzer">Аналізатор</a>
    <a href="#compare" data-v="compare">Порівняння</a>
    <a href="#trades" data-v="trades">Мої угоди</a>
    <a href="#config" data-v="config">Налаштування</a>
  </nav>

  <!-- УГОДА -->
  <div class="view" id="v-trade"><div class="grid">
    <section class="panel full">
      <div class="row" style="justify-content:space-between">
        <h2 style="margin:0">Зробити угоду</h2>
        <span><span class="pill" id="dealSrc"></span><span class="pill" id="dealExp"></span></span>
      </div>
      <div class="deal-info" id="dealInfo"><span>🕐 <b id="diClock">--:--:--</b></span><span>📊 Таймфрейм <b id="diTf">—</b></span><span>⏳ Час угоди <b id="diExp">—</b></span><span>⏱ Угода <b id="diDeal">немає</b></span></div>
      <div class="seg blk-seg" role="tablist" style="margin-top:12px">
        <button data-m="bots" class="on" role="tab">🤖 Аналіз ботів</button>
        <button data-m="photo" role="tab">📸 Фото + ШІ-команда</button>
        <button data-m="bot1" role="tab">🧠 Бот №1</button>
      </div>
      <div class="deal-grid">
        <div class="deal-ctl">
          <label class="blk-pair" style="font-size:.85rem;color:var(--muted);display:flex;flex-direction:column;gap:5px;margin-bottom:10px">Актив
            <input id="dealPair" placeholder="Напр. EUR/JPY OTC"></label>
          <div class="blk-tf"><div class="blk-lbl" style="font-size:.85rem;color:var(--muted);margin-bottom:5px">Таймфрейм</div>
          <div class="tfbar" id="tfBar"><button data-tf="0.0833">5с</button><button data-tf="0.25">15с</button><button data-tf="0.5">30с</button><button data-tf="1">M1</button><button data-tf="5">M5</button><button data-tf="15">M15</button><button data-tf="60">H1</button></div></div>
          <div class="blk-exp"><div class="blk-lbl" style="font-size:.85rem;color:var(--muted);margin:10px 0 5px">Час угоди</div>
          <div class="tfbar" id="expBar"><button data-es="15">15с</button><button data-es="30">30с</button><button data-es="60">1 хв</button><button data-es="120">2 хв</button><button data-es="300">5 хв</button></div></div>
          <div class="blk-pairs"><div class="pairtabs"><button data-pt="">Усі</button><button data-pt="cur" class="on">Валюти</button><button data-pt="otc">OTC</button><button data-pt="cry">Крипто</button></div>
          <div class="pairs" id="pairGrid"></div></div>
          <div class="blk-mode"><div id="mBots">
            <p class="note" style="margin-top:0">Шість ботів аналізують свічки з потоку за своїми стратегіями й голосують. Миттєво й без витрат лімітів Claude.</p>
          </div>
          <div id="mPhoto" hidden="">
            <div class="drop" id="drop" tabindex="0" role="button" aria-label="Додати фото графіка">
              <input type="file" id="phInput" accept="image/*">
              <img id="phImg" alt="Фото графіка" hidden="">
              <div class="scan"></div>
              <div id="dropHint"><span class="icon">📸</span>Натисни, щоб вибрати скріншот графіка.<br>Можна перетягнути або вставити (Ctrl+V).</div>
            </div>
            <p class="note" id="phNote">Фото розглядає вся команда: кожен агент голосує, ORIN оголошує спільне рішення.</p>
          </div>
          <div id="mBot1" hidden><p class="note" style="margin-top:0">Бот №1: ШІ-трейдер за твоїм промптом на реальних свічках otcharts. Головний і допоміжний таймфрейм під експірацію (15 с, 30 с або 1 хв), старший ТФ, твої угоди на парі, уроки й анти-якір. Відповідь — лише UP або DOWN з причиною. Після мінуса сам записує урок. Кожна угода витрачає трохи балансу Claude API.</p></div></div>
          <div class="row blk-go" style="margin-top:14px">
            <button id="dealBtn" class="primary big">Зробити угоду</button>
            <button id="dealStop" hidden="">Зупинити</button>
            <button id="phClear" hidden="">Інше фото</button>
          </div>
          <div class="scanbox" id="scanBox">
            <div class="row"><button id="scanBtn">🔍 Шукати сигнал</button><button id="scanStop" hidden>⏹ Зупинити пошук</button></div>
            <label class="scanopt"><input type="checkbox" id="scanAll"> шукати по всіх OTC-парах</label>
            <label class="scanopt"><input type="checkbox" id="scanBot1"> підтверджувати Ботом №1 (витрачає баланс API)</label>
            <label class="scanopt">💰 Виплата зараз на Pocket Option: <input type="number" id="payoutIn" min="50" max="100" step="1" style="width:74px;padding:6px 8px"> % <span id="beOut"></span></label>
            <label class="scanopt"><input type="checkbox" id="learnOn"> 🎓 фонове навчання ліги, поки застосунок відкритий
              <select id="learnRate" style="padding:4px 6px;margin-left:4px"><option value="60">60 запитів/год</option><option value="120">120 запитів/год</option><option value="240">240 запитів/год</option></select></label>
            <div class="note" id="learnStatus" style="margin:4px 0 0"></div>
            <div class="note" id="scanStatus" style="margin:6px 0 0"></div>
          </div>
        </div>
        <div id="dealOut"><div class="empty" style="text-align:center;padding:40px 0">Обери режим і натисни «Зробити угоду»</div></div>
      </div>
    </section>
    <section class="panel full">
      <h2>Команда</h2>
      <div class="roster" id="roster"></div>
    </section>
  </div></div>

  <!-- КОМАНДА -->
  <div class="view" id="v-team"><div>
    <section class="panel">
      <div class="row" style="justify-content:space-between;margin-bottom:6px">
        <h2 style="margin:0">Чат команди</h2>
        <div class="row"><button class="mini" id="meetBtn">Нарада</button><button class="mini" id="clearChat">Очистити</button></div>
      </div>
      <div class="chat" id="chat"></div>
      <div class="typing" id="typing"></div>
      <div class="chips" id="chips">
        <button data-q="Дайте сигнал по поточному ринку">Дай сигнал</button>
        <button data-q="Розберіть мої мінусові угоди й виправте, що потрібно">Розберіть мінуси</button>
        <button data-q="Що в моїй статистиці працює, а що ні? Чесно.">Що працює?</button>
        <button data-q="Дайте 3 конкретні ідеї, як покращити аналіз ринку за даними Тіньової ліги, і одразу виконайте найкращу через actions.">Ідеї для аналізу</button>
        <button data-q="Покажіть, що зараз у спільному мозку, і що з цього варто прибрати">Перевірте мозок</button>
        <button data-q="Хочу змінити дизайн сторінки. Запропонуйте 2–3 варіанти, я оберу">Змінити дизайн</button>
      </div>
      <div class="attach" id="attachInfo" hidden=""></div>
      <div class="composer">
        <button id="chatPhoto" aria-label="Додати фото" title="Додати фото">📎</button>
        <input type="file" id="chatPhotoInput" accept="image/*">
        <textarea id="chatIn" rows="1" placeholder="Завдання команді…"></textarea>
        <button id="chatSend" class="primary">Надіслати</button>
        <button id="chatStop" hidden="">Стоп</button>
      </div>
    </section>
  </div></div>

  <!-- МОЗОК -->
  <div class="view" id="v-brain">
    <section class="panel brain">
      <h2>Спільний мозок</h2>
      <p class="note" style="margin-top:0">Усе, що тут, команда бачить у кожному запиті. Кожну зміну агенти пишуть у чат, і її можна скасувати.</p>
      <h3>Агенти, створені командою</h3><div id="bAgents"></div>
      <h3>Правила</h3><div id="bRules"></div>
      <h3>Уроки з мінусів</h3><div id="bLessons"></div>
      <h3>Стратегії агентів</h3><div id="bStrats"></div>
      <h3>Код для серверного бота</h3><div id="bCode"></div>
    </section>
  </div>

  <!-- СИСТЕМА -->
  <div class="view" id="v-system"><div class="grid">
    <section class="panel full sys">
      <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:10px"><h2 style="margin:0">⚙️ Система бота</h2><span class="note" id="sysSummary" style="margin:0"></span></div>
      <div class="sys-tabs" role="tablist">
        <button data-sys="brain" class="on">🧠 Мозок</button><button data-sys="lessons">📚 Уроки</button><button data-sys="league">🏆 Ліга</button><button data-sys="coach">🧑‍🏫 Тренер</button><button data-sys="errors">⚠️ Помилки <b id="errCnt"></b></button>
      </div>
      <div class="sys-pane on" id="sysBrain"></div>
      <div class="sys-pane" id="sysLessons"></div>
      <div class="sys-pane" id="sysLeague"></div>
      <div class="sys-pane" id="sysCoach"></div>
      <div class="sys-pane" id="sysErrors"></div>
    </section>
  </div></div>

  <!-- БОТИ -->
  <div class="view" id="v-bots"><div class="grid">
    <section class="panel full" id="leaguePanel">
      <div class="row" style="justify-content:space-between;margin-bottom:6px"><h2 style="margin:0">🏆 Тіньова ліга</h2><button id="leagueReset">Очистити</button></div>
      <p class="note" style="margin-top:0">Кожен сигнал кожного бота, OMNI, MEMO, консенсусу (FOX) і Бота №1 автоматично перевіряється за свічками otcharts одразу на 15, 30 і 60 с, без грошей. «Доведено» — коли на 60+ перевірках навіть нижня межа влучності вища за беззбиток. Пошук бере сигнали лише від доведених.</p>
      <div class="table-wrap"><table><thead><tr><th>Хто</th><th>Експірація</th><th>Сигналів</th><th>Влучність</th><th>Межі (95%)</th><th>Статус</th><th>Банк</th><th>Рів.</th></tr></thead><tbody id="leagueBody"></tbody></table></div>
      <p class="note" id="leagueNote"></p>
      <div id="leagueHours" class="note"></div>
    </section>
    <section class="panel full">
      <div class="row" style="justify-content:space-between;margin-bottom:10px">
        <h2 style="margin:0">Боти</h2>
        <button id="resetBots">Скинути результати</button>
      </div>
      <div class="bots" id="botGrid"></div>
      <p class="note">Боти тестують стратегії на потоці свічок, без грошей. Кожному можна вибрати стратегію, зокрема ту, яку написала команда.</p>
    </section>
    <section class="panel full"><h2>Рейтинг агентів (з твоїх «Так / Ні»)</h2>
      <div class="table-wrap"><table><thead><tr><th>Агент</th><th>Підхід</th><th>Голосів</th><th>Влучність</th><th>Вага</th><th>Статус</th></tr></thead><tbody id="leaderBody"></tbody></table></div>
      <p class="note">Агент з влучністю нижче 48% (від 8 позначених угод) автоматично йде на лаву, і на його місце приходить наступний з іншим підходом. Кращі отримують більшу вагу, а VEGA повторює найкращого.</p>
      <p class="note" id="benchNote"></p>
    </section>
    <section class="panel" style="display:none"><h2>Історія балансу</h2><div class="chart-box sm"><canvas id="balChart"></canvas></div></section>
    <section class="panel full"><h2>Журнал ботів</h2><div class="log" id="botLog"><div><span style="color:var(--muted)">Поки що угод немає</span></div></div></section>
  </div></div>

  <!-- АНАЛІЗАТОР -->
  <div class="view" id="v-analyzer"><div class="grid">
    <section class="panel">
      <div class="row" style="margin-bottom:6px"><select id="analyzerSel" aria-label="Аналізатор"></select></div>
      <div class="signal">
        <div>
          <span class="pill" id="pairPill">DEMO/USD</span><span class="pill" id="srcPill">Демо-дані</span>
          <div class="verdict flat" id="verdict">Чекати</div>
          <ul class="reasons" id="reasons"><li>Немає даних</li></ul>
        </div>
        <div>
          <div class="ring" id="ring">
            <svg width="130" height="130" viewBox="0 0 130 130" aria-hidden="true">
              <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7b5cff"></stop><stop offset="1" stop-color="#ff5ca8"></stop></linearGradient></defs>
              <circle cx="65" cy="65" r="54" fill="none" stroke="var(--panel2)" stroke-width="10"></circle>
              <circle id="ringArc" cx="65" cy="65" r="54" fill="none" stroke="url(#g)" stroke-width="10" stroke-linecap="round" stroke-dasharray="339.3" stroke-dashoffset="339.3" style="transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)"></circle>
            </svg>
            <div class="val"><b id="scoreVal">0</b><span>%</span></div>
          </div>
          <div class="cap">Сила за індикаторами</div>
        </div>
      </div>
    </section>
    <section class="panel">
      <h2>Перевірка на історії</h2>
      <div class="stats">
        <div class="stat"><b id="btHit">—</b><span>Точність</span></div>
        <div class="stat"><b id="btN">—</b><span>Сигналів</span></div>
        <div class="stat"><b id="btPnl">—</b><span>Результат</span></div>
      </div>
      <div class="bar"><i id="btBar"></i></div>
      <p class="note" id="btNote"></p>
      <button id="btBtn" style="margin-top:10px">Перевірити</button>
    </section>
    <section class="panel full"><div class="chart-box"><canvas id="chart"></canvas></div></section>
  </div></div>

  <!-- ПОРІВНЯННЯ -->
  <div class="view" id="v-compare">
    <section class="panel">

<script id="app-js">
/* ===================== BOOT: розмітка з шаблону + канонічне джерело сторінки ===================== */
const HEAD_FIXED=`<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SHADOW FOX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;800&display=swap" rel="stylesheet">`;
const SRC={css:document.getElementById('app-css').textContent,body:document.getElementById('app-body').innerHTML,js:document.getElementById('app-js').textContent,safe:document.getElementById('safe').textContent};
document.body.insertBefore(document.getElementById('app-body').content.cloneNode(true),document.getElementById('app-body'));
function buildPage(s){return `<!DOCTYPE html>\n<html lang="uk">\n<head>\n${HEAD_FIXED}\n<script id="safe">${SRC.safe}<\/script>\n<style id="app-css">${s.css}</style>\n</head>\n<body>\n<template id="app-body">${s.body}</template>\n<script id="app-js">${s.js}<\/script>\n</body>\n</html>\n`}
/* ===================== ЯДРО ===================== */
const ANALYZERS=[];
function registerAnalyzer(a){const i=ANALYZERS.findIndex(x=>x.id===a.id);if(i>=0)ANALYZERS[i]=a;else ANALYZERS.push(a)}
const ind={
  ema(v,p){const k=2/(p+1),o=[];let pr;v.forEach((x,i)=>{pr=i?x*k+pr*(1-k):x;o.push(pr)});return o},
  sma(v,p){return v.map((_,i)=>i<p-1?null:v.slice(i-p+1,i+1).reduce((a,b)=>a+b,0)/p)},
  std(v,p){return v.map((_,i)=>{if(i<p-1)return null;const s=v.slice(i-p+1,i+1),m=s.reduce((a,b)=>a+b,0)/p;return Math.sqrt(s.reduce((a,b)=>a+(b-m)**2,0)/p)})},
  rsi(v,p=14){const o=Array(v.length).fill(null);let g=0,l=0;for(let i=1;i<v.length;i++){const d=v[i]-v[i-1],u=Math.max(d,0),n=Math.max(-d,0);if(i<=p){g+=u;l+=n;if(i===p){g/=p;l/=p;o[i]=100-100/(1+g/(l||1e-9))}}else{g=(g*(p-1)+u)/p;l=(l*(p-1)+n)/p;o[i]=100-100/(1+g/(l||1e-9))}}return o}
};
/* Знімок ринку — перенесено з rules.mjs (snapshot) */
function snapshot(a){
  a=a.slice(-400);const c=a.map(x=>x.c),n=a.length;if(n<20)return null;
  const e50=ind.ema(c,50),slope=Math.sign(e50[n-1]-e50[Math.max(0,n-11)]);
  const tr=a.map(x=>x.h-x.l),last20=tr.slice(-21,-1),avg=last20.reduce((s,x)=>s+x,0)/Math.max(1,last20.length);
  const sorted=tr.slice().sort((x,y)=>x-y),rank=sorted.filter(x=>x<=tr[n-1]).length/sorted.length;
  const vol=rank<.33?'low':rank>.67?'high':'mid',spike=avg>0&&tr[n-1]>3*avg?1:0;
  let st=0;for(let i=n-1;i>=Math.max(0,n-20);i--){const d=Math.sign(a[i].c-a[i].o);if(!d)break;if(!st)st=d;else if(d!==Math.sign(st))break;else st+=d}
  const w=a.slice(-60),hi=Math.max(...w.map(x=>x.h)),lo=Math.min(...w.map(x=>x.l));
  const pos=hi>lo?(c[n-1]-lo)/(hi-lo):.5,posB=pos>.8?'high':pos<.2?'low':'mid';
  return{trend:slope,vol,spike,streak:st,pos:+pos.toFixed(3),posB,price:c[n-1]};
}

/* ============ ВБУДОВАНІ СТРАТЕГІЇ ============ */
registerAnalyzer({id:'ema-rsi',name:'EMA 9/21 + RSI',analyze(c){
  const cl=c.map(x=>x.c);if(cl.length<30)return{direction:'flat',score:0,reasons:['Мало даних']};
  const f=ind.ema(cl,9),s=ind.ema(cl,21),r=ind.rsi(cl),i=cl.length-1,rsi=r[i],gap=(f[i]-s[i])/cl[i]*1e4;
  let d='flat',sc=Math.min(100,Math.round(Math.abs(gap)*8+Math.abs(rsi-50)));const rs=[];
  if(f[i]>s[i]&&rsi<70){d='long';rs.push('EMA 9 вище EMA 21')}else if(f[i]<s[i]&&rsi>30){d='short';rs.push('EMA 9 нижче EMA 21')}else rs.push('RSI у крайній зоні');
  rs.push('RSI '+rsi.toFixed(1));if(d==='flat')sc=Math.min(sc,30);
  return{direction:d,score:sc,reasons:rs,lines:[{values:f,color:'#7b5cff'},{values:s,color:'#ff5ca8'}]};
}});
registerAnalyzer({id:'momentum',name:'Імпульс 3 свічки',analyze(c){
  if(c.length<5)return{direction:'flat',score:0};const l=c.slice(-3);
  if(l.every(x=>x.c>x.o))return{direction:'long',score:60,reasons:['Три зелені свічки поспіль']};
  if(l.every(x=>x.c<x.o))return{direction:'short',score:60,reasons:['Три червоні свічки поспіль']};
  return{direction:'flat',score:15,reasons:['Немає імпульсу']};
}});
registerAnalyzer({id:'range-pos',name:'Позиція в діапазоні (твої дані)',analyze(c){
  const s=snapshot(c);if(!s)return{direction:'flat',score:0,reasons:['Мало даних']};
  const p=`позиція ${(s.pos*100).toFixed(0)}% діапазону 60 свічок`;
  if(s.posB==='low')return{direction:'short',score:70,reasons:['Ціна внизу діапазону',p]};
  if(s.posB==='high')return{direction:'long',score:52,reasons:['Ціна вгорі діапазону',p]};
  return{direction:'flat',score:20,reasons:['Ціна посередині діапазону',p]};
}});
registerAnalyzer({id:'bollinger',name:'Відскок від Боллінджера',analyze(c){
  const cl=c.map(x=>x.c);if(cl.length<25)return{direction:'flat',score:0};

  const lines=[{values:up,color:'#8a90ad'},{values:dn,color:'#8a90ad'}];
  if(cl[i]>up[i])return{direction:'short',score:65,reasons:['Ціна вище верхньої смуги'],lines};
  if(cl[i]<dn[i])return{direction:'long',score:65,reasons:['Ціна нижче нижньої смуги'],lines};
  return{direction:'flat',score:10,reasons:['Ціна всередині каналу'],lines};
}});
registerAnalyzer({id:'rsi-rev',name:'RSI розворот',analyze(c){
  const cl=c.map(x=>x.c);if(cl.length<20)return{direction:'flat',score:0};
  const r=ind.rsi(cl,7),i=cl.length-1;
  if(r[i]>75)return{direction:'short',score:Math.round(r[i]-10),reasons:['RSI(7) '+r[i].toFixed(1)+': перекупленість']};
  if(r[i]<25)return{direction:'long',score:Math.round(90-r[i]),reasons:['RSI(7) '+r[i].toFixed(1)+': перепроданість']};

registerAnalyzer({id:'confluence',name:'Збіг ознак (KIRA)',analyze(c){
  const cl=c.map(x=>x.c);if(cl.length<55)return{direction:'flat',score:0,reasons:['Мало даних']};
  const s=snapshot(c),e20=ind.ema(cl,20),r=ind.rsi(cl),i=cl.length-1,l=c[i];
  const up=[],dn=[];

registerAnalyzer({id:'pullback',name:'Відкат по тренду (LYNX)',analyze(c){
  const cl=c.map(x=>x.c);if(cl.length<40)return{direction:'flat',score:0,reasons:['Мало даних']};
  const e21=ind.ema(cl,21),i=cl.length-1,sl=e21[i]-e21[i-8],l=c[i],p=c[i-1],s=snapshot(c);
  if(s.spike)return{direction:'flat',score:10,reasons:['Сплеск: на OTC після сплеску часто відкат, вхід ризикований']};
  const touched=k=>c[k].l<=e21[k]&&c[k].h>=e21[k];
  if(sl>0&&(touched(i-1)||touched(i-2))&&l.c>l.o&&l.c>p.h*0.9999)return{direction:'long',score:66,reasons:['Висхідний тренд, відкат до EMA21 і відновлення']};
  if(sl<0&&(touched(i-1)||touched(i-2))&&l.c<l.o&&l.c<p.l*1.0001)return{direction:'short',score:66,reasons:['Низхідний тренд, відкат до EMA21 і відновлення']};
  return{direction:'flat',score:12,reasons:['Немає відкату з підтвердженням']};
}});
registerAnalyzer({id:'pattern',name:'Свічкові патерни (NOVA)',analyze(c){
  const n=c.length;if(n<20)return{direction:'flat',score:0,reasons:['Мало даних']};
  const a=c[n-2],b=c[n-1],body=x=>Math.abs(x.c-x.o),rng=x=>(x.h-x.l)||1e-9,lw=Math.min(b.o,b.c)-b.l,uw=b.h-Math.max(b.o,b.c);
  const avg=c.slice(-21,-1).reduce((s,x)=>s+rng(x),0)/20;
  if(b.c>b.o&&a.c<a.o&&b.c>=a.o&&b.o<=a.c&&body(b)>avg*.5)return{direction:'long',score:62,reasons:['Бичаче поглинання']};
  if(b.c<b.o&&a.c>a.o&&b.c<=a.o&&b.o>=a.c&&body(b)>avg*.5)return{direction:'short',score:62,reasons:['Ведмеже поглинання']};
  if(lw>2*body(b)&&lw>uw*2&&rng(b)>avg*.8)return{direction:'long',score:58,reasons:['Пін-бар знизу: відбій вгору']};
  if(uw>2*body(b)&&uw>lw*2&&rng(b)>avg*.8)return{direction:'short',score:58,reasons:['Пін-бар зверху: відбій вниз']};
  return{direction:'flat',score:10,reasons:['Немає чіткого патерну']};
}});
registerAnalyzer({id:'breakout',name:'Пробій рівня (RAVEN)',analyze(c){
  const n=c.length;if(n<30)return{direction:'flat',score:0,reasons:['Мало даних']};
  const w=c.slice(-21,-1),hi=Math.max(...w.map(x=>x.h)),lo=Math.min(...w.map(x=>x.l)),l=c[n-1],rng=x=>x.h-x.l,avg=w.reduce((s,x)=>s+rng(x),0)/w.length;
  if(l.c>hi&&l.c>l.o&&rng(l)<avg*3)return{direction:'long',score:60,reasons:['Закриття вище максимуму 20 свічок: пробій вгору']};
  if(l.c<lo&&l.c<l.o&&rng(l)<avg*3)return{direction:'short',score:60,reasons:['Закриття нижче мінімуму 20 свічок: пробій вниз']};

}});
/* статистика агентів з журналу: хто мав рацію */
function agentStats(){
  const st={};
  (typeof journal!=='undefined'?journal:[]).forEach(j=>{if(j.pr==null||!Array.isArray(j.votes))return;const win=j.pr>0;
    j.votes.forEach(v=>{if(v.agent==='FOX'||!v.direction||v.direction==='flat')return;if((j.t||0)<(SINCE[v.agent]||0))return;const right=(v.direction===j.dir)===win;
      const s=st[v.agent]||(st[v.agent]={n:0,r:0});s.n++;if(right)s.r++})});
  Object.values(st).forEach(s=>{s.acc=s.r/s.n;s.lb=(typeof wilson==='function'?wilson(s.r,s.n)[0]:s.acc*100)/100;
    s.w=s.n<8?1:s.acc<.48?0:Math.max(.3,Math.min(2,(s.acc-.45)/.1));s.muted=s.n>=8&&s.acc<.48});
  return st;
}

function hueOf(hex){const m=/^#?([0-9a-f]{6})$/i.exec(hex||'');if(!m)return 0;const n=parseInt(m[1],16),r=(n>>16&255)/255,g=(n>>8&255)/255,b=(n&255)/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;if(!d)return 0;let h=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;return Math.round(h*60+360)%360}

function demoCandle(t){const o=price,vol=price*.0009;let h=o,l=o,p=o;for(let k=0;k<6;k++){p+=(Math.random()-.5)*2*vol;h=Math.max(h,p);l=Math.min(l,p)}price=p;return{t,o,h,l,c:p,v:Math.round(500+Math.random()*1500)}}
function genDemo(n=300){price=150;candles=[];const tf=cfg.tf*60000,st=Date.now()-n*tf;for(let i=0;i<n;i++)candles.push(demoCandle(st+i*tf))}
const byId=id=>ANALYZERS.find(a=>a.id===id);
function safe(a,c){if(!a)return{direction:'flat',score:0,reasons:['Стратегію не знайдено']};try{const r=a.analyze(c)||{};return{...r,direction:normDir(r.direction),score:+r.score||0}}catch(e){return{direction:'flat',score:0,reasons:['Помилка: '+e.message]}}}

/* ===================== АНАЛІЗАТОР ===================== */
const analyzerSel=$('analyzerSel');
function fillAnalyzerSel(){const cur=analyzerSel.value;analyzerSel.innerHTML=ANALYZERS.map(a=>`<option value="${esc(a.id)}">${esc(a.name)}</option>`).join('');if(byId(cur))analyzerSel.value=cur}
let lastLines=[],lastDir=null;
function runSignal(){
  const r=safe(byId(analyzerSel.value),candles.slice()),d=r.direction,sc=Math.max(0,Math.min(100,Math.round(r.score)));
  const v=$('verdict');v.className='verdict '+d;v.textContent=d==='long'?'Заходити в лонг':d==='short'?'Заходити в шорт':'Чекати';
  if(d!==lastDir){popClass(v,'pop');lastDir=d;$('reasons').innerHTML=(r.reasons||[]).map(x=>'<li>'+esc(x)+'</li>').join('')||'<li>Без пояснень</li>'}
  else [...$('reasons').children].forEach((li,i)=>{if(r.reasons&&r.reasons[i]!=null)li.textContent=r.reasons[i]});
  countTo($('scoreVal'),sc);$('ringArc').style.strokeDashoffset=339.3*(1-sc/100);
  $('ring').classList.toggle('hot',sc>=60&&d!=='flat');
  lastLines=r.lines||[];drawCandles();
}
function prepCanvas(cv){const dpr=devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;const g=cv.getContext('2d');g.scale(dpr,dpr);return{g,W,H}}
function drawCandles(){
  const cv=$('chart');if(!cv.clientWidth)return;const{g,W,H}=prepCanvas(cv);
  const up=css('--up'),dn=css('--down'),mu=css('--muted'),ln=css('--line');
  const n=Math.min(candles.length,Math.max(30,Math.floor(W/9))),off=candles.length-n,view=candles.slice(off);if(!view.length)return;
  let hi=Math.max(...view.map(x=>x.h)),lo=Math.min(...view.map(x=>x.l));const pd=(hi-lo)*.08;hi+=pd;lo-=pd;
  const R=58,cw=(W-R)/n,y=p=>(hi-p)/(hi-lo)*H;
  g.font='11px Onest,sans-serif';g.lineWidth=1;
  for(let k=0;k<=4;k++){const p=lo+(hi-lo)*k/4,yy=y(p);g.strokeStyle=ln;g.beginPath();g.moveTo(0,yy);g.lineTo(W-R,yy);g.stroke();g.fillStyle=mu;g.fillText(p.toFixed(3),W-R+6,yy+4)}
  view.forEach((x,i)=>{const cx=i*cw+cw/2,col=x.c>=x.o?up:dn;g.strokeStyle=col;g.fillStyle=col;g.beginPath();g.moveTo(cx,y(x.h));g.lineTo(cx,y(x.l));g.stroke();g.fillRect(cx-cw*.35,y(Math.max(x.o,x.c)),cw*.7,Math.max(1,Math.abs(y(x.o)-y(x.c))))});
  lastLines.forEach(L=>{if(!L.values)return;g.strokeStyle=L.color||mu;g.lineWidth=1.6;g.beginPath();let st=false;L.values.slice(off).forEach((v,i)=>{if(v==null)return;const px=i*cw+cw/2,py=y(v);st?g.lineTo(px,py):(g.moveTo(px,py),st=true)});g.stroke()});
  const last=view.at(-1),ly=y(last.c),col=last.c>=last.o?up:dn;
  g.setLineDash([3,3]);g.strokeStyle=col;g.beginPath();g.moveTo(0,ly);g.lineTo(W-R,ly);g.stroke();g.setLineDash([]);
  g.fillStyle=col;g.fillRect(W-R+2,ly-9,R-4,18);g.fillStyle='#fff';g.fillText(last.c.toFixed(3),W-R+6,ly+4);
  if(live&&!RM){const cx=(n-1)*cw+cw/2;g.fillStyle=col;g.globalAlpha=.25+.25*Math.sin(performance.now()/200);g.beginPath();g.arc(cx,ly,7,0,7);g.fill();g.globalAlpha=1}
}

/* ===================== БЕКТЕСТ ===================== */
function backtest(a){
  const h=cfg.expiry;let hits=0,n=0,pnl=0;
  for(let i=40;i<candles.length-h;i++){
    const r=safe(a,candles.slice(0,i+1));if(r.direction==='flat')continue;
    const ch=candles[i+h].c-candles[i].c;if(!ch)continue;
    const w=(r.direction==='long'&&ch>0)||(r.direction==='short'&&ch<0);n++;
    if(w){hits++;pnl+=cfg.stake*cfg.payout/100}else pnl-=cfg.stake;
  }
  return{n,rate:n?hits/n*100:0,pnl};
}
function runBt(){
  const r=backtest(byId(analyzerSel.value)),be=breakeven();
  if(r.n){countTo($('btHit'),r.rate,v=>v.toFixed(1)+'%');countTo($('btN'),r.n);countTo($('btPnl'),r.pnl,fmt)}else{$('btHit').textContent='—';$('btN').textContent='0';$('btPnl').textContent='—'}
  $('btPnl').style.color=r.pnl>=0?'var(--up)':'var(--down)';$('btBar').style.width=r.rate+'%';
  $('btNote').textContent=!r.n?'Стратегія не дала сигналів.':r.rate>be?`Вище порогу ${be.toFixed(1)}% на цих даних. Перевір на інших, перш ніж довіряти.`:`Нижче порогу ${be.toFixed(1)}%: на дистанції стратегія в мінусі.`;
}
function runCompare(){
  const be=breakeven(),rows=ANALYZERS.map(a=>({a,...backtest(a)})).sort((x,y)=>y.pnl-x.pnl);
  $('cmpBody').innerHTML=rows.map((r,i)=>`<tr style="animation-delay:${i*.06}s"><td>${esc(r.a.name)}</td><td>${r.n?r.rate.toFixed(1)+'%':'—'}</td><td>${r.n}</td><td class="${r.pnl>=0?'long':'short'}">${r.n?fmt(r.pnl):'—'}</td><td>${!r.n?'Без сигналів':r.rate>be?'Вище порогу':'Збиткова'}</td></tr>`).join('');
  $('cmpNote').textContent=`Поріг беззбитковості при виплаті ${cfg.payout}%: ${be.toFixed(1)}%. Перевіряй на кількох наборах даних: одна вдала вибірка ще нічого не доводить.`;
}

const savedBots=ls.get('sd-bots',null);
if(Array.isArray(savedBots))savedBots.forEach((s,k)=>{if(BOTS[k]&&s){if(s.an)BOTS[k].an=s.an;BOTS[k].savedOn=s.on}});
const saveBots=()=>ls.set('sd-bots',BOTS.map((b,k)=>({an:b.an,on:botState?botState[k].on:true})));
let botState;
function resetBots(){
  botState=BOTS.map(b=>({bal:cfg.start,hist:[cfg.start],open:[],on:b.savedOn!==false&&!!byId(b.an),w:0,l:0}));
  $('botLog').innerHTML='<div><span style="color:var(--muted)">Поки що угод немає</span></div>';buildBots();
}
const optsFor=cur=>ANALYZERS.map(a=>`<option value="${esc(a.id)}" ${a.id===cur?'selected':''}>${esc(a.name)}</option>`).join('');
function buildBots(){
  $('botGrid').innerHTML=BOTS.map((b,k)=>`<div class="bot" id="bot${k}" style="animation-delay:${k*.06}s">
    <div class="top">${avatar(b.name,44)}<div><h3>${b.name}</h3><div class="role">${b.role}</div></div></div>
    <select class="strat-sel" data-k="${k}" aria-label="Стратегія ${b.name}">${optsFor(b.an)}</select>
    <div class="bal" id="bal${k}"></div><div class="chg" id="chg${k}"></div><div class="state" id="st${k}"></div>
    <label><input type="checkbox" data-k="${k}"> Активний</label></div>`).join('');
  $('botGrid').querySelectorAll('input').forEach(x=>x.onchange=()=>{botState[+x.dataset.k].on=x.checked;saveBots();updateBots()});
  $('botGrid').querySelectorAll('select').forEach(x=>x.onchange=()=>setBot(BOTS[+x.dataset.k].name,x.value,true));
  updateBots();renderRoster();
}
function setBot(name,strategy,active){
  const k=BOTS.findIndex(b=>b.name===name);if(k<0)throw new Error('Немає бота '+name);
  if(strategy!=null){if(!byId(strategy))throw new Error('Немає стратегії '+strategy);BOTS[k].an=strategy;botState[k].open=[]}
  if(active!=null)botState[k].on=!!active;
  saveBots();buildBots();
}
function updateBots(){
  BOTS.forEach((b,k)=>{const s=botState[k],d=s.bal-cfg.start,tot=s.w+s.l,el=$('bot'+k);if(!el)return;
    el.classList.toggle('off',!s.on);el.classList.toggle('trading',s.open.length>0);
    el.querySelector('input').checked=s.on;
    countTo($('bal'+k),tot?s.w/tot*100:0,v=>Math.round(v)+'%');
    const c=$('chg'+k);c.className='chg '+(!tot?'flat':d>=0?'long':'short');c.textContent=tot?`${s.w} перемог із ${tot} угод`:'без угод';
    $('st'+k).textContent=!s.on?'Вимкнено':s.open.length?(s.open[0].dir==='long'?'▲ В угоді вгору':'▼ В угоді вниз'):live?'Шукає вхід…':'Очікує потік';
    if(s.flash){popClass(el,s.flash);s.flash=null}
  });
  drawBal();
}
function logBot(html){const box=$('botLog');if(box.textContent.includes('Поки що'))box.innerHTML='';const d=document.createElement('div');d.innerHTML=html;box.prepend(d);while(box.children.length>80)box.lastChild.remove()}
function stepBots(){
  const i=candles.length-1,last=candles[i];
  BOTS.forEach((b,k)=>{
    const s=botState[k];
    s.open=s.open.filter(t=>{if(i<t.exp)return true;
      const ch=last.c-t.entry,w=ch!==0&&((t.dir==='long'&&ch>0)||(t.dir==='short'&&ch<0));
      const p=w?cfg.stake*cfg.payout/100:-cfg.stake;s.bal+=p;w?s.w++:s.l++;s.flash=w?'win':'lose';
      logBot(`<span>${avatar(b.name,20)} <b style="color:${BCOL[k]}">${b.name}</b> ${t.dir==='long'?'вгору':'вниз'} → ${w?'виграш':'програш'}</span><span class="${p>=0?'long':'short'}">${w?'✓':'✗'}</span>`);return false});
    if(s.on&&s.open.length===0&&s.bal>=cfg.stake){const r=safe(byId(b.an),candles.slice());if(r.direction!=='flat')s.open.push({dir:r.direction,entry:last.c,exp:i+cfg.expiry})}
    s.hist.push(s.bal);if(s.hist.length>400)s.hist.shift();
  });
  updateBots();
}
function drawBal(){
  const cv=$('balChart');if(!cv.clientWidth)return;const{g,W,H}=prepCanvas(cv);
  const all=botState.flatMap(s=>s.hist);let hi=Math.max(...all),lo=Math.min(...all);if(hi===lo){hi+=10;lo-=10}
  const len=Math.max(...botState.map(s=>s.hist.length)),y=v=>(hi-v)/(hi-lo)*(H-24)+8;
  g.strokeStyle=css('--line');g.setLineDash([4,4]);g.beginPath();g.moveTo(0,y(cfg.start));g.lineTo(W,y(cfg.start));g.stroke();g.setLineDash([]);
  botState.forEach((s,k)=>{g.strokeStyle=BCOL[k];g.lineWidth=1.8;g.beginPath();let lx=0,lyy=0;s.hist.forEach((v,i)=>{const x=i/Math.max(1,len-1)*W;lx=x;lyy=y(v);i?g.lineTo(x,lyy):g.moveTo(x,lyy)});g.stroke();
    g.fillStyle=BCOL[k];g.beginPath();g.arc(Math.min(lx,W-4),lyy,3,0,7);g.fill();g.font='600 11px Onest,sans-serif';g.fillText(BOTS[k].name,6+k*50,H-2)});
}
